l_simp_chinese:
 je_prc_sandazhanyi: "三大战役"
 je_prc_sandazhanyi_reason: "旧时代的腐朽堡垒将在人民战争的怒潮中轰然崩塌。华北的冰雪尚未融化，淮河的波涛仍在翻滚，江南的春雷已经在远方酝酿。千百年来，中国的命运始终被少数人操控，而今，亿万劳动人民将以血与火的洗礼，打破这道历史的枷锁。我的命令是——解放全中国！"

 je_kaiguodadian: "开国事项"
 je_kaiguodadian_reason: "硝烟尚未完全散去，废墟之上已然传来新生的号角。国民党反动派的统治正式终结，而中国，迎来了属于人民的新时代。从北平到南京，从长江之畔到黄河之滨，千百年来饱受战乱与剥削的土地，终于迎来了新的主人。建立一个真正属于劳动人民的国家，这不仅是一场政权更迭，更是一个时代的更替。无数的挑战仍然横亘在前方，百废待兴的土地、急需重建的经济、仍未完全肃清的敌对势力……但人民已经站起来了，历史的车轮不再倒退。"
 je_prc_sandazhanyi_reason: "开国事项介绍"

 je_xinanjiaofei: "西南剿匪"
 je_xinanjiaofei_reason: "西南边陲，蜀地深山，滇黔峡谷，余孽盘踞，伺机而动。国民党残部、地方土匪、封建军阀的残余势力尚未彻底覆灭，他们寄希望于凭借地势险阻负隅顽抗，妄图等待境外势力的援助，企图死灰复燃。我们将整合云南、贵州、重庆、四川并部署足够多的兵营来平息匪患。"
 je_xinanjiaofei_goal: "进度达到100"
 
 je_tudigaige: "土地改革与社会主义改造"
 je_tudigaige_reason: "自封建时代起，中国的土地便掌握在少数地主阶级手中，亿万农民在贫困的阴影下挣扎。他们日出而作，日落而息，却终其一生无法摆脱沉重的租税与剥削。如今，这一切已经成为过去。土地改革的号角在田野间吹响，长久以来奴役着农民的剥削制度已被彻底粉碎，曾经被视为世代不变的秩序在革命的烈焰中灰飞烟灭。耕者有其田，劳动者成为真正的主人，而随着社会主义改造的深入，私有制也将让位于公有制，生产关系的革命将为新中国的腾飞奠定坚实的基础。"


