 disintegration_crisis:0 "解体危机"
 disintegration_crisis_reason:0 "曾经无比强大的苏维埃联盟，如今已是外强中干。内部的蛀虫噬空政府，苏共的领导地位遭到削弱，社会主义的治理原则被背弃，寡头们出于自身利益放弃了国家的统一，资本主义反对派趁机崛起，社会动荡愈演愈烈，曾经辉煌的祖国正在瓦解。如果苏联彻底放弃社会主义，华约将被解散，共产主义阵营将土崩瓦解，苏联的旗帜将不复存在。解体之后，曾经的加盟共和国将走向政治多元化，拥抱资本主义自由市场和西方式民主。"

 je_accept_the_black_south_africans: "接纳南非黑人和土著科伊桑人"
 je_accept_the_black_south_africans_goal: "完成接纳南非黑人和土著科伊桑人的任务。"
 je_accept_the_black_south_africans_reason: "南非黑人和科伊桑人世代生息于这片土地，他们的祖先早在殖民者踏足之前便是这片大地的主人。然而，殖民统治的残暴剥削，使他们沦为矿井的苦工、种植园的劳役，财富的增长却未曾惠及他们。随着历史的进程，他们的法定地位有所提升，但社会不公仍如枷锁般禁锢着他们的命运。在政治与经济领域，他们依旧被边缘化，社会的不平等已经成为国家潜在的不稳定因素。如果我们无法迅速推进人权改革，无法给予他们应有的权利，那么，未来的社会动荡，便是历史不可避免的回响。"

 je_accept_the_malayan: "接纳马来人和泰米尔人"
 je_accept_the_malayan_goal: "完成接纳马来人和泰米尔人的任务。"
 je_accept_the_malayan_reason: "自殖民时代以来，马来人和泰米尔人便成为经济体系的中坚力量，他们在矿场、种植园中挥洒汗水，为国家创造财富。然而，殖民政府的压迫，使他们长期处于社会底层，被剥夺权利，忍受剥削与歧视。如今，时代已然变迁，法定自由得以实现，但他们的社会地位仍未真正改变，政治参与度低，经济权利受限，长期的不公正已成为社会潜伏的危机。他们用双手建设了这片土地，本不该被拒于主流社会之外。若不能推动真正的社会改革，赋予他们平等的权利，国家的安定与发展将无法持续。"

 je_tudigaige2: "土地改革"
 je_tudigaige2_reason: "封建与半封建剥削的土地制度早已成为社会发展的枷锁，使农民世代贫困，国家经济长期受阻。如今，我们必须采取果断行动，彻底废除封建剥削体系，实行“耕者有其田”的政策，让土地真正归属于劳动者。但仅仅停止剥削还远远不够，国家的未来不能停留在小农经济之上。我们必须逐步推动私有制向公有制的转变，整合农业资源，使生产效率最大化。只有这样，社会主义的光辉才能真正照耀这片土地，人民才能从根本上获得解放！"

 regency:0 "摄政时期"
 regency_reason:0 "1945年，美国军队解救了比利时国王利奥波德三世，当他准备再次行使国王的权利时，却遭到比利时社会党、自由党、比利时共产党和乌德比斯特党的集体反对，于是退隐瑞士，把国事交给他的弟弟摄政王查理亲王处理，其子博杜安成为王位继承人，静待复位问题的裁决。"

