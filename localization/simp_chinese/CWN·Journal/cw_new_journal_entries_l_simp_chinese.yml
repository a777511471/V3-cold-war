 modifier_jap_terakoya: "扫盲运动"
 modifier_legacy_of_terakoya: "扫盲运动完成"
 je_terakoya: "扫盲运动"
 je_terakoya_reason: "知识即力量，扫盲是国家崛起的第一步。毛泽东时期，以教育普及为己任，全国范围内开展“冬学”、民校和夜校，实行汉字简化政策，让无数贫苦人民获得基本的读写能力。这一场扫盲运动，不仅提升了人民的文化水平，也为国家的现代化奠定了基础。\n\n然而，教育的未来不能止步于扫盲。如果我们希望培养出能够推动国家进步的人才，就必须进一步改革，建立更加正规的全国性教育体系。"

 modifier_establish_a_college_entrance_examination_system: "建立高考制度"
 je_establish_a_college_entrance_examination_system: "建立高考制度"
 je_establish_a_college_entrance_examination_system_reason: "知识改变命运，教育振兴国家。尽管高等教育资源有限，但全国范围内的普通高校招生制度，使无数有志之士得以凭借自身努力改变人生。然而，当前的教育体系仍存在许多不足。如果我们希望真正建立一套公平、公正、高效的高等教育体系，就必须进行系统化改革，统一招生制度，集中优质教育资源，培养国家未来的栋梁之才。"

 educational_resources_are_severely_inadequate: "教育资源严重不足"
 modifier_literacy_education: "扫盲教育完成"
 je_literacy_education: "扫盲教育"
 je_literacy_education_reason: "在全国范围内，教育资源极度匮乏，高等学府寥寥无几。然而，在这片土地上，仍有一批分散的民校和冬学，为最底层的人民提供基础教育。\n\n扫盲教育不仅确保了人民的基本读写能力，更让他们掌握了实用的生产知识。然而，这一体系仍然零散不成系统，无法满足现代国家发展的需求。如果我们要真正提升国民素质，推动国家进步，就必须改革教育制度，建立更正规、系统化的教育体系。"

 modifier_general_education: "通识教育完成"
 je_general_education: "通识教育"
 je_general_education_reason: "尽管教育资源有限，高等学府仍显不足，但国家的基础教育体系正在逐步完善。各地的学校为普通百姓提供了通识教育，使学生能够独立思考，具备跨学科的基本知识，帮助他们理解世界的运行逻辑。\n\n然而，仅仅普及通识教育是不够的。如果国家要在科技、工业和现代化领域取得突破，就必须进一步改革，推动高等教育的系统化，使学生不仅能理解知识，更能创造知识。"

 modifier_quality_education: "素质教育完成"
 je_quality_education: "素质教育"
 je_quality_education_reason: "尽管教育资源不是特别富裕，填鸭式教育大行其道，师生压力大，但有分散的学校为全国各地的平民提供教育。\n\n素质教育确保了学生能够正确面临和处理自身所处社会环境的大部分事物和现象。如果我们希望在全球竞争中立于不败之地，就必须推动素质教育，培养兼具创新能力与实践能力的新一代人才。"

 transfer_of_power2:0 "党国权力交接"
 transfer_of_power2_reason:0 "1975年4月蒋介石病故后，蒋经国已经被推选为中国国民党中央委员会主席兼中央常务委员会主席。1978年5月，蒋经国被选为国民政府第六届总统。"

 PRK_decision: "建立朝鲜民主主义人民共和国"
 PRK_decision_reason: "随着大韩民国在东亚的崛起，如同一把锋利的刀刃刺入苏联的战略腹地，克里姆林宫的阴影开始笼罩朝鲜半岛的北部。为了抵御西方势力的侵蚀，巩固其在远东的铁幕，苏联毫不犹豫地采取了行动——他们决定在半岛的北方扶植一个全新的社会主义政权。这不仅是对抗资本主义阵营的前哨站，更是苏联全球霸权野心的延伸。\n\n北方的土地在战争的废墟中颤抖，分裂的伤痕深深刻入民族的脊梁。然而，在这片破碎的土地上，一个新的国家即将诞生——朝鲜民主主义人民共和国。它的存在，既是苏联对东亚局势的冷酷算计，也是对西方世界的无声宣战。\n\n随着红旗在平壤上空升起，东亚的局势变得更加诡谲复杂。苏联的触角深入半岛的每一个角落，而朝鲜北部的政权则成为了这场全球博弈中的一枚关键棋子。未来的风暴正在酝酿，而这片土地上的每一个人，都将被卷入这场无法逃脱的历史洪流之中。"
 KOR_decision: "建立大韩民国"
 KOR_decision_reason: "随着北朝鲜在东亚的崛起，如同一把锋利的刀刃刺入美国的战略腹地，白宫的阴影开始笼罩朝鲜半岛的南部。为了抵御社会主义势力解放东亚，巩固其在远东的铁幕，美国毫不犹豫地采取了行动——他们决定在半岛的南方扶植一个全新的资本主义政权。白宫的战略意图明确无误，大韩民国的建立不仅是东亚冷战的必然结果，也是西方势力对社会主义阵营的正面回应。\n\n南方的土地在战争的废墟中颤抖，分裂的伤痕深深刻入民族的脊梁。然而，在这片破碎的土地上，一个新的国家即将诞生——大韩民国。它的存在，既是美国对东亚局势的冷酷算计，也是对社会主义世界的无声宣战。\n\n随着韩国太极旗在首尔上空升起，东亚的局势变得更加诡谲复杂。美国的触角深入半岛的每一个角落，而朝鲜南部的政权则成为了这场全球博弈中的一枚关键棋子。未来的风暴正在酝酿，而这片土地上的每一个人，都将被卷入这场无法逃脱的历史洪流之中。"

 modifier_encourage_childbearing:0 "鼓励生育完成"
 je_encourage_childbearing:0 "鼓励生育"
 je_encourage_childbearing_reason:0 "我们认识到全面加强人口和鼓励生育工作的艰巨性和紧迫性。人口问题始终是制约我国全面协调可持续发展的重大问题，是影响经济社会发展的关键因素。我们要对生育多子女的母亲给予奖励，授予“英雄母亲”称号；同时还要降低结婚年龄，女性结婚年龄从18岁降低到16岁，用来刺激结婚率和生育率。历史已经证明，强大的国家必须建立在充沛的人口基础之上。通过这一基本国策，我们不仅能确保国家的持续发展，也能为民族的复兴奠定坚实的基础。"

 modifier_compulsion_encourage_childbearing:0 "强制鼓励生育完成"
 je_compulsion_encourage_childbearing:0 "强制鼓励生育"
 je_compulsion_encourage_childbearing_reason:0 "随着罗马尼亚经济的发展，人民的物质条件改善，女性的观念也随之改变，越来越多的妇女不愿生育，这种“不负责任”的个人主义倾向，严重影响了国家的劳动力储备。面对这一威胁，国家必须果断采取措施，确保足够的新生人口来维持经济增长。\n\n770法令因此诞生。它要求每对夫妇至少生育四个孩子，任何无法受孕的女性都必须缴纳“生育税”，而所有形式的避孕和堕胎均被定为非法。每名适龄女性在月经期都要接受定期妇科检查，以防止“恶意不孕”。\n\n国家需要的是流水线上的工人，而不是咖啡馆里的闲谈者；是战壕里的士兵，而不是大学里的女学生。 个人的自由算得了什么？国家的未来才是最重要的！"

 modifier_family_planning:0 "优生少生"
 je_plan_childbearing:0 "计划生育"
 je_plan_childbearing_reason:0 "人口始终是制约国家发展的关键因素，过多的人口将拖累经济，消耗资源，阻碍社会进步。因此，国家必须采取计划生育政策，以确保人口增长符合经济与社会发展的需求。\n\n计划生育政策的实施，使我们提前实现了人口再生产类型的历史性转变，大幅度降低了人口对环境与资源的压力。实践证明，坚定不移地执行计划生育基本国策，不仅确保了国家的经济腾飞，也成为人类社会控制人口问题的成功范例。\n\n每一个新生命的诞生，都应经过计算。 这是科学管理的时代，岂能容忍人口增长的无序扩张？"

 modifier_compulsion_family_planning:0 "强制限制生育完成"
 je_compulsion_family_planning:0 "强制限制生育"
 je_compulsion_family_planning_reason:0 "人口过剩是国家的沉重负担，生育不再是权利，而是一种特权。为了减少城市拥挤、缓解资源压力，国家已经坚定不移地推行去城市化政策，并采取一系列强制性措施限制生育。过去的生育观念必须被摒弃，家庭的规模不应由个人意愿决定，而应由国家统一规划。\n\n如今，节育已不再是选择，而是法律义务。除特殊批准外，任何未经授权的生育都将被视为对国家经济发展的破坏。多余人口的减少不仅能提升社会平等，也能减少国家财政的负担，使社会更加稳定和谐。\n\n国家不需要太多“无用的人口”，国家需要的是高效的机器，而不是饥饿的嘴巴。 计划生育政策的实施，不仅是经济发展的必然选择，也是社会进步的必经之路。"

 je_accept_the_bengali_people: "接纳孟加拉人"
 je_accept_the_bengali_people_goal: "完成接纳孟加拉人的任务。"
 je_accept_the_bengali_people_reason: "孟加拉人自殖民时代起，便在国家的矿场、种植园和建筑工地上挥洒汗水，为经济增长贡献了不可估量的力量。然而，殖民政府给予他们的回报，是剥削、贫困和毫无希望的社会地位。\n\n即便在现代，孟加拉人仍被排除在政治权力之外，社会不公继续桎梏着他们的未来。他们被需要——但仅限于劳力，而非权利。\n\n然而，历史的教训一次次证明：被剥夺者不会永远沉默。不公平的待遇已成为社会动荡的隐患，若不加以解决，孟加拉人可能不会再等待施舍，而是自己争取权利——哪怕意味着用枪杆子来争取一片属于自己的土地。"

