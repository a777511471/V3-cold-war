 reestablish_roc_economy_2_reason:0 "在本轮经济建设计划中，政府将扮演核心角色，年度预算的大笔的资金将用于重点建设民用轻工业，尽可能补全民用工业的产业链缺陷，实现初级工业产品的自给自足。\n全面的工业化需要大量的熟练技工，而目前我国如此低下的识字率显然无法满足如此要求，因此政府在本阶段将在全国推行义务扫盲班运动，深入城市与乡村提供免费识字教育。至于全面重整教育体制，如何培养高级人才向更高级产业结构转型，这一重任便交给下一阶段吧。"
 
 reestablish_roc_economy_3:0 "中华民国经济重建：重整教育体制"
 reestablish_roc_economy_3_reason:0 "经过抗战时期的大学内迁与合以及二次内战的空前混乱，整片中华大地几乎难以找出几所正常运转的大学，基础教育几乎完全停摆，城市地区尚且如此，农村地区则几乎是文盲遍地。如此低下的识字率显然无法满足全面工业化的需求，因此全面重整教育系统刻不容缓，我们计划在全国范围内建设并开设大学，从英美友邦邀请学者与教师弥补教师力量的不足。至于这些学者向我们的大学生宣传自由主义言论的可能，这确实是内政部和军统一直强调和担心的事情，然而蒋经国专员力排众议，作为妥协我们会尽可能加强言论审查，总之邀请他们总比邀请共产主义者好，是吗？"

