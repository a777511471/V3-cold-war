 je_accept_the_quechua_people: "接纳克丘亚人"
 je_accept_the_quechua_people_goal: "完成接纳克丘亚人的任务。"
 je_accept_the_quechua_people_reason: "克丘亚人是南美洲的原住民之一，自印加帝国时代以来，便在这片土地上繁衍生息。他们长期从事鸟粪采集、矿场开发以及棉花和甘蔗的种植工作，世世代代承受着残酷的剥削。时至今日，克丘亚人的社会地位虽有所提升，但贫困、歧视与不公依旧困扰着他们。尽管他们在国家经济与社会发展中做出了不可磨灭的贡献，却仍然被排斥在政治权力之外。若这一状况得不到改变，社会的不满情绪将逐渐酝酿，最终演变为动荡的根源。为了国家的稳定，为了社会的公平，我们必须采取行动。人权法律改革势在必行，克丘亚人理应获得与其他公民同等的权利，并真正成为国家的一部分。"

 je_accept_the_chinese_people: "接纳华裔"
 je_accept_the_chinese_people_goal: "华裔代表的一封信。"
 je_accept_the_chinese_people_reason: "陟罚臧否，愚民敢献微言，请垂察。自1849始，华工迫于生计，辗转万里，贩于贵邦，役于鸟粪采掘、硝石开采，及棉花甘蔗之种植，协助王师南征智利，皆高劳而少酬，困苦备尝。虽其力竭心劳，然助贵邦经济兴盛，功不可没。至1860年，天京覆，太平余众走避天涯，流离海外，其间之众不乏流亡至秘鲁伊基克等地，亦多潜往为劳苦之民，入矿穴，采取精粹，从军伍，血染沙场，苦不堪言。及1874年，贵邦终废其“苦力贸易”，吾辈得以法定人身自由，然长年累月积习之偏见与种族轻视，犹困吾群也。倘不知变，必成社稷之患哉！是以可见，推动吾辈归化之工作，刻不容缓，须速决之,若得以成，必将助益国运，繁荣昌盛，指日可待！谨以微言，恳请垂怜，加恩体恤。切盼贵邦政府垂听，采纳吾辈之谏言，乃国家长治久安之策也。"

 je_accept_the_japanese_people: "接纳日裔"
 je_accept_the_japanese_people_goal: "完成接纳日裔的任务。"
 je_accept_the_japanese_people_reason: "19世纪末，日裔移民漂洋过海，投身矿场、农田，辛勤劳作，为国家经济发展作出不可磨灭的贡献。岁月流转，社会进步，他们获得了法定自由，财富日增，文化扎根。然而，他们在政治领域的影响力却始终被束缚，社会偏见与制度性障碍，使他们无法真正融入国家治理体系。今日，国家的发展已不可再忽视这一群体的诉求。不平等的现状不仅影响社会稳定，更阻碍了国家的真正统一。若要构建一个包容而强盛的国度，赋予日裔真正的公民权利，已成不可推卸之责任。"

 je_freedom_equality_and_fraternity: "自由、平等、博爱"
 je_freedom_equality_and_fraternity_reason: "共和的理想，不应止步于宣言。自法国大革命以来，“自由、平等、博爱”成为法兰西共和国的基石。然而，在这座灯塔照耀的土地上，少数族裔与法国黑人的社会地位仍未真正得到平等对待。他们曾在本土与殖民地的建设中挥洒汗水，他们在战火中与共和国并肩作战，然而法律之外，现实依旧残酷。社会歧视与制度性不公使他们难以获得与其他公民同等的机会。\n\n若法兰西要真正履行自己的承诺，维护共和体制的稳定，就必须推进这些群体在政治、经济、社会中的全面参与。我们理应积极推动社会对他们的接纳，以期真正实现“自由、平等、博爱”的伟大目标。"

