 je_shehuizhuyigaige: "社会主义改革"
 je_shehuizhuyigaige_reason: "废封建、除剥削，人民翻身作主人！
封建与半封建剥削制度长期束缚人民的双手，使社会停滞不前。唯有彻底摧毁旧的土地制度，实行“耕者有其田”，才能让国家焕发生机。\n\n社会主义改革不仅仅是土地制度的变革，更是社会经济结构的彻底重塑。私有制的终结，公有制的确立，将使[ROOT.GetCountry.GetName]走向真正的人民国家，迎来共同富裕的新时代。"

 je_zhanhouchongjian: "战后重建"
 je_zhanhouchongjian_reason: "战争的阴影仍未散去，破败的城市、荒芜的土地、衰落的经济，都是过去冲突留下的创伤。然而，我们不能停滞不前，必须迈出重建的步伐。战后重建不仅是经济的复苏，更是国家实力的重塑。我们必须加快工业化进程，重建基础设施，推动经济增长，使国家重新成为世界强国。这是一场新的战斗，而这一次，我们要战胜的，是贫穷与落后！"
