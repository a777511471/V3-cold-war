 great_steelmaking:0 "大炼钢铁"
 great_steelmaking_reason:0 "钢铁工业是整个工业的基础，是整个工业的纲，是整个工业的元帅。钢铁产品因其塑性、韧性、强度以及经济性的特点成为现代社会最重要的基础生产资料，是国家生存和发展的物质基础。历史上很多发达国家如美国、日本、西欧等无一不经历了以钢铁为支柱产业的重要发展阶段。更重要的是，即使到目前的科技发达程度看，我们仍然难以在可预见的将来，有任何其它材料能代替钢铁现有的地位。 钢铁工业是国民经济的重要基础产业，并仍然是是国家经济水平和综合国力的重要标志。我们必须全面跃进，通过提高钢铁产量摆脱贫穷落后的帽子，为我国经济的发展奠定重要基础，甚至超英赶美，否则将会造成极大的危机。"

 take_food_as_the_key_link:0 "以粮为纲"
 take_food_as_the_key_link_reason:0 "农业是国家和社会的基础，是国家和社会的纲，是国家和社会的元帅。农产品是社会最重要的基础生产资料，是国家生存和发展的物质基础。农业是国民经济的重要基础产业，并仍然是是国家经济水平的重要标志。我们现在正面临粮食供应不足和工业基础薄弱的双重挑战。为了保障人民基本生活需求并支持国家工业化建设，我们必须将粮食生产作为农业工作的核心任务，通过提高农产品产量摆脱贫穷落后的帽子，为我国经济的发展奠定重要基础，否则将会造成极大的粮食危机。"

 take_the_class_struggle_as_the_key_link:0 "以阶级斗争为纲"
 take_the_class_struggle_as_the_key_link_reason:0 "阶级斗争从未终结，革命胜利只是新战线的开始。社会主义国家的根基，建立在无产阶级对反动阶级的彻底压制之上。我们正面临双重威胁：外有反动势力试图复辟，内有走资派渗透党内，妄图篡夺人民的胜利果实。动摇阶级斗争，就是动摇社会主义制度的根基，稍有迟疑，资本主义的幽灵便会卷土重来。因此，我们必须将阶级斗争置于国家政治生活的核心，以革命的手段清除一切剥削势力。从思想到物质，从工厂到农村，从课堂到军营，每一个领域都不能成为阶级敌人的藏身之所。武斗与文斗，乃是无产阶级巩固政权、粉碎敌对势力的必要手段。妥协意味着背叛，怜悯意味着灭亡。只有彻底荡涤一切剥削制度，将敌人埋葬在历史的尘埃中，社会主义的光辉才能照耀未来。"

 je_august_revolution:0 "八月革命"
 je_august_revolution_reason:0 " 1945年8月17日，苏加诺宣布印度尼西亚独立，殖民统治的枷锁在硝烟中裂开。然而，帝国主义者岂会甘愿放手？荷兰殖民军重返群岛，妄图将印度尼西亚的人民再次拖入奴役的深渊。但人民将会为自由战斗到底。硝烟在城市街头燃起，游击队在丛林间游荡，工人、农民、学生纷纷拿起武器。然而，斗争尚未结束。殖民者可以被赶走，但殖民制度留下的毒瘤仍在腐蚀新生的共和国。民族独立只是第一步，社会革命才是决定国家命运的真正战场。一个由人民掌握的印度尼西亚，绝不允许帝国主义的残渣继续操控国家。只有继续斗争，彻底铲除一切殖民残余，国家才能真正站稳脚跟。 "

 great_leap_forward:0 "大跃进"
 great_leap_forward_reason:0 "在党的英明领导下，全国人民意气风发，迈入了一个前所未有的高速发展时期。钢铁产量节节攀升，农村田间地头燃起熊熊炉火，农民们白天劳动，夜晚炼钢，干劲冲天。短短几个月，全国各地拔地而起无数座炼铁炉，一股人民的钢铁洪流正滚滚向前！农业战线上更是捷报频传，公社化运动进一步解放了生产力，人民再无饥饿的烦恼。城市建设同样日新月异，工厂机器隆隆作响，人民公社生机勃勃。人们不再受旧社会的束缚，而是以主人翁的姿态投身于国家建设。遥望未来，工业化与农业革命并进，共产主义的光辉已然近在眼前！"

 future_plans:0 "未来的计划"
