 je_ouzhoulianmeng:0 "欧洲联盟"
 je_ouzhoulianmeng_reason:0 "1991年12月11日，欧共体成员国在马斯特里赫特首脑会议上达成历史性协议，决定迈向更紧密的政治与经济联合。《欧洲联盟条约》，即“马斯特里赫特条约”，成为这一变革的奠基石。1992年2月7日，该条约正式签署，欧洲理事会、委员会、议会应运而生，区域经济合作转向政经一体化。\n\n1993年11月1日，《马斯特里赫特条约》正式生效，欧洲联盟宣告成立，象征着欧共体从单纯的经济联盟转变为政治实体。自此，欧洲三大共同体统一于欧洲联盟旗帜之下，成员国开始在外交、安全、司法及内政事务上展开前所未有的深度合作。"
