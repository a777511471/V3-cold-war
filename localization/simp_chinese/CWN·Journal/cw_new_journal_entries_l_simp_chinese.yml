 je_45_year_plan: "四五计划"
 je_45_year_plan_reason: "共产主义就是[ROOT.GetCountry.GetName]政权加全国电气化。工业化是社会主义建设的基石，电气化则是国家现代化的关键。四五计划的目标不仅是恢复战争创伤，更是推动经济增长，实现工业、农业、交通、能源全面升级。五年之内，[ROOT.GetCountry.GetName]将经历一场史无前例的变革。生产资料的公有化，劳动效率的提升，全国范围的电气化，将使国家经济跃上新台阶。"
