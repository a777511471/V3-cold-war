 establishing_NATO: "成立北大西洋公约"
 establishing_NATO_reason: "为了遏制共产主义的蔓延，[ROOT.GetCountry.GetName]必须调整战略重心，从亚太回归欧洲，建立一个强有力的防御联盟。西欧各国孤立无援，面对苏联的军事压力，他们需要一个共同的防线。而我们，必须站在民主世界的一边，联合盟友，共同建立北大西洋公约组织，让西方世界的安全屏障牢不可破。"

 je_shoufulvshun: "和平收复旅顺和大连"
 je_shoufulvshun_reason: "山河破碎之痛，不容再延！旅顺与大连，曾是中华的土地，如今仍在#v $苏联$#!的掌控之下。虽曾并肩作战，但国土完整乃不可谈判之原则。我们必须坚定不移地收复这片土地，任何拖延都是对主权的让步，任何妥协都是对历史的背叛。无论采用何种方式，我们都必须让旅顺与大连重回祖国的怀抱。这不仅是国土的收复，更是国家尊严的重塑。"

 je_shoufuxianggang: "和平收复香港"
 je_shoufuxianggang_reason: "百年耻辱，岂能继续？香港，这颗南海之上的明珠，仍然被殖民主义余孽#v $英国$#!占据。然而，时代变迁，历史债务终将偿还。中华民族的崛起不容外人干涉，香港的主权问题绝不容置喙。我们必须动用包括外交、经济乃至其他一切手段，确保香港顺利回归祖国的怀抱。历史的车轮终将滚滚向前，任何力量都无法阻挡！"

 je_shoufuaomen: "和平收复澳门"
 je_shoufuaomen_reason: "半个世纪的分离，终将迎来终结。澳门，这片被#v $葡萄牙$#!殖民者占据的土地，依旧在帝国主义的掌控之中。然而，中华民族伟大复兴的脚步不可阻挡，主权问题绝无讨价还价的余地。我们将采取强硬立场，确保澳门的回归。无论对方如何拖延，这片土地终将回到祖国怀抱，这是历史的必然！"

 je_shoufutaiwan: "和平收复台湾"
 je_shoufutaiwan_reason: "国家统一大业，不容反动派阻挠！
由于内战的遗留问题，台湾仍然被反动的#v $中国台湾伪政府$#!占据，分裂的伤痕尚未愈合。然而，历史潮流浩浩荡荡，统一是全体中华儿女不可动摇的共同目标。我们必须采取一切必要手段，确保台湾回归祖国的怀抱。反动派终将被扫除，祖国的统一必将实现，人民万岁！"

