 je_group_objectives:0 "教程任务"
 je_fragile_rule: "脆弱的统治"
 je_fragile_rule_reason: "抗日战争胜利的光辉未及洒满神州，新的危机便已悄然降临。革命的烈焰尚未熄灭，内部的贪腐如蛀虫啃噬根基，行政管理在混乱中摇摇欲坠，而列强的阴影仍在国门之外窥伺。在这片满目疮痍的大地上，胜利只是新的考验的开始。若我们无法稳固政权，无法平息战火，若我们在即将到来的全面内战中失去四个关键地区，那么，这片土地的主宰权将不再属于[ROOT.GetCountry.GetName]，我们将被迫退守宝岛，在风暴中苟延残喘。"
 je_prk: "统一#v $朝鲜$#!"
 je_prk_reason: "三十八度线，一道冷漠的铅笔划痕，却割裂了一个古老的民族。殖民统治的伤疤尚未愈合，新的铁幕便已降临。#v $USA$#!与#v $苏联$#!的意志在这片土地上交错，如同两只无形之手，操纵着曾经血脉相连的同胞。北方与南方的兄弟在敌对的战壕中遥望，母亲在分界线两端呼喊，然而没有人能逾越这道人为的裂痕。\n\n但历史不会永远被锁死在冷战的铁幕之下。#v $朝鲜$#!的英雄儿女终将突破分裂的枷锁，超越派系与外部势力的干预，在奋斗与牺牲中迎来民族的团圆。无穷花将在统一的土地上重新绽放，祖国母亲不会再承受新的伤痛——对吗？"
 no_independent_prk_countries_tt: "所有拥有[GetCulture('korean').GetName][concept_primary_cultures]的[concept_country]都已被吞并或成为我们的[concept_subject]"
 je_ger: "统一#v $GER$#!"
 je_ger_reason: "1946年，废墟之上，日耳曼尼亚仍在哀鸣。 这个曾屹立于欧洲之巅的国度，如今被撕裂为四块残片。#v $苏联$#!、#v $USA$#!、#v $GER$#!、#v $FRA$#!的旗帜在柏林飘扬，胜利者的脚步踏碎了曾经的骄傲。但这片土地上的人民仍在生存，仍在呼吸，仍在低声诉说着一个古老的愿望——#v $GER$#!必须回归完整！\n\n如果我们还愿意称自己为一个国家，就不能永远活在外部势力的分割之下。只有跨越裂痕，弥合创伤，#v $GER$#!才能从过去的废墟中崛起，再次成为一个真正的国家，而非战胜国手中的战利品！"
 has_formed_ger_tt: "成立了国家#v $GER$#!"
 no_independent_ger_countries_tt: "所有拥有[GetCulture('north_german').GetName][concept_primary_cultures]的[concept_country]都已被吞并或成为我们的[concept_subject]"
 GER_event.3.t: "#v $GER$#!统一"
 GER_event.3.d: "人民，我们的反对者已被击败或臣服。#v $GER$#!再次统一，比以往任何时候都更强大。"
 GER_event.3.f: "统一、正义和自由，为了#v $GER$#!祖国；让我们一起为了这个目标而奋斗，像兄弟那样团结起来，献出我们的双手和真心。统一、正义和自由，是我们幸福的保证。在繁荣昌盛的光芒中绽放，绽放吧，#v $GER$#!祖国！在繁荣昌盛的光芒中绽放，绽放吧，#v $GER$#!祖国！"
 GER_event.3.a: "我们国家必须再次奋斗！"
 GER_event.3.b: "让我们恢复经济。"
 stalin_inheritance:0 "斯大林继承"
 stalin_inheritance_reason:0 "斯大林同志是[ROOT.GetCountry.GetName]的掌舵人，是这片辽阔土地上的红色巨人。 在他的领导下，社会主义工业化和农业集体化迅猛推进，使祖国从一片战乱与贫瘠中崛起为重工业与军事强国。在那场可怖的世界大战中，他以铁血意志指引苏维埃人民跨越烈火硝烟，直至柏林的毁灭。然而，历史的伟人终究无法战胜时间。斯大林同志早年的艰难岁月铸就了他的意志，也损害了他的健康，如今，他的身影已不再如往昔般挺拔，他的声音亦不复当年般铿锵。尽管他仍在运筹帷幄，但岁月的侵蚀已悄然显现。祖国不能失去太阳的照耀。 斯大林同志的身体状况令人忧虑，我们不能等待命运的裁决。此刻，我们必须未雨绸缪，为苏维埃的未来做好准备。无论谁将继承这面伟大的旗帜，必须确保社会主义的铁拳依旧握紧，确保这片土地不会因伟人的离去而陷入混乱！"
 stalin's_funeral:0 "斯大林的葬礼"
 stalin's_funeral_reason:0 "1953年3月5日，世界在沉默中颤抖。 我党、我军、我国各族人民公认的卓越领导人，伟大的马克思列宁主义者，无产阶级革命的巨人，斯大林同志，于今日下午因中风导致的脑溢血辞世。他曾带领人民走过最黑暗的年代，在工业化的熔炉中锻造苏维埃，在卫国战争的烈焰中将法西斯粉碎于尘埃。他的英明决策，他的坚定意志，他的革命精神，将长存于这片土地的血脉之中，激励我们以更加坚定的步伐，在[ROOT.GetCountry.GetName]社会主义建设的道路上前进。"
 kremlin_ministerial_conference:0 "克里姆林宫部长会议"
 kremlin_ministerial_conference_reason:0 "1953年，赫鲁晓夫、马林科夫、贝利亚、莫洛托夫、朱可夫五位同志组成中央书记处，并决定在今日召开部长级会议。然而，在这表面上的庄严会议背后，隐藏着巨大的暗潮——[ROOT.GetCountry.GetName]的党内斗争已至白热化，最高权力的角逐已然到来。苏维埃的未来将在这场无声的较量中被改写。在克里姆林宫地下室，朱可夫早已安排了军官，某些人或许也早已安排好了更隐秘的手段。"
 the_people's_army:0 "人民的军队"
 the_people's_army_reason:0 "朱可夫同志的英明领导正引领[ROOT.GetCountry.GetName]走向新的纪元。 卫国战争的英雄再一次挺身而出，在国家最危急的关头拯救了祖国，并将其带入了繁荣的社会主义新时代。军队在他的指挥下整顿，铁血纪律重塑红军荣光，国家经济也将更加贴近人民的需求。资本主义世界的威胁从未消失，我们必须在枪炮与铁拳的保护下，让[ROOT.GetCountry.GetName]的旗帜继续飘扬，直到世界尽头。"
 liberalization_of_the_Soviet_Union:0 "苏维埃联盟自由化"
 liberalization_of_the_Soviet_Union_reason:0 "长夜将尽，晨曦初现。 在贝利亚同志的领导下，[ROOT.GetCountry.GetName]正在经历一场前所未有的变革。曾经封闭的国门正在缓缓打开，曾经被压抑的声音正在获得表达的空间。在这条被称为[ROOT.GetCountry.GetName]社会主义道路的新航线上，祖国正迈向一个更加开放和包容的时代。出于建设一个现代化社会主义国家的目标，各地的苏维埃会议将获得更多权力，言论的枷锁正在松动。尽管旧势力仍在暗处伺机而动，但历史的车轮已然向前。"
 anti_Stalinism_movement:0 "反斯大林主义运动"
 anti_Stalinism_movement_reason:0 "随着雕像的倾倒，一段历史被揭开。 斯大林统治时期的罪行终于在赫鲁晓夫同志的秘密报告中被曝光，他揭露了红军在卫国战争初期因领导层的恐慌而陷入的混乱，揭露了大清洗期间的无情屠杀，揭露了个人崇拜如何将国家拖入独裁的深渊。曾经高高矗立在广场上的斯大林雕像被推翻，肃穆的眼神在变得迷茫而破碎。苏联的未来仍是晦暗不明。"
 continuation_of_Stalinism:0 "斯大林主义的延续"
 continuation_of_Stalinism_reason:0 "苏联人民钢铁铸就的信仰将一直延续。斯大林同志不仅是[ROOT.GetCountry.GetName]的掌舵人，更是列宁主义的坚定继承者。他用铁腕政策建立了工业强国，他以无与伦比的意志指引我们穿越战火，走向胜利。无论敌人如何诋毁，无论背叛者如何妄图动摇我们的信念，我们的道路依然坚定不移。唯一的正确道路已经铺就，我们将沿着斯大林同志指引的方向，迈向更伟大的社会主义时代！"
 je_franco_government_reshuffle:0 "国家的拯救者：政府改组"
 je_franco_government_reshuffle_reason:0 "佛朗哥将军仍然紧握着权柄，但岁月已在他身上刻下痕迹。他曾在战火中维持祖国的完整，曾在世界大战中维持中立，使[ROOT.GetCountry.GetName]免于更大的浩劫。然而，他不再年轻，时间的流沙正在一点点蚕食他的统治。无论如何，我们必须在变局来临之前，扶持或打压某个派系，为西班牙的未来铺路。"
 franco's_funeral:0 "佛朗哥的葬礼"
 franco's_funeral_reason:0 "1975年11月20日，独裁者终究走到了生命的尽头。 佛朗哥，这位统治西班牙长达四十年的将军，终于在漫长的病榻折磨后逝世。一个时代的终结，意味着另一个时代的来临。胡安·卡洛斯一世登基，西班牙正式迈入君主立宪制，民主改革的浪潮开始冲刷四十年的沉疴。考迪罗的阴影尚未散去，但西班牙已经踏上了新的旅程。"
 je_jianliminzhudeguo:0 "建立民主德国"
 je_jianliminzhudeguo_reason:0 "在国际政治格局的重塑中，我们有必要在苏占#v $GER$#!建立#v $GER$#!民主共和国，以适应当前的外交、政治与经济形势。这不仅关乎#v $GER$#!的未来，也关乎整个欧洲的稳定。"
 custom_loc_jianliminzhudeguo_goal:0 "#v $GER$#!联邦共和国存在，#v $GER$#!民主共和国不存在"
 je_ouzhougongheti:0 "欧洲共同体"
 je_ouzhougongheti_reason:0 "1939年至1945年，战争的烈火席卷欧洲，数百万生命在炮火中灰飞烟灭，经济与社会秩序被彻底摧毁。#v $GER$#!的军国主义行径让世界见识了极端主义的可怕，而核武器的降临，更让人类意识到——战争不再是一场可以承受的冒险。\n\n西欧的列强已然式微，新的世界格局由#v $USA$#!和#v $苏联$#!主导。面对这一现实，欧洲国家再不能单打独斗，必须寻找新的生存之道。为确保#v $GER$#!不会再次威胁和平，我们对其部分重工业进行拆除，煤炭产区由国际管控。然而，仅仅压制一个国家无法解决欧洲的长期安全问题。\n\n欧洲的统一思潮已有百年历史，而二战的浩劫使这一愿景走向现实。1946年9月，#v $英国$#!前首相温斯顿·丘吉尔呼吁建立“欧洲合众国”，随后，一系列泛欧组织相继成立。1950年，欧洲一体化先驱让·莫内与#v $FRA$#!外长舒曼提出了“欧洲煤钢共同体”计划，以经济合作限制#v $GER$#!的复苏风险。1951年4月18日，#v $FRA$#!、联邦#v $GER$#!、意大利、荷兰、比利时、卢森堡六国正式签署《欧洲煤钢共同体条约》，迈出了欧洲统一的第一步。一个崭新的欧洲，正在从战争的阴影中觉醒。"
