l_simp_chinese:
 je_unified_china: "统一祖国"
 je_unified_china_reason: "1946年，山河破碎，战火未熄。 这个本已千疮百孔的国度，再次被无情的内战撕裂。国民党在美国的支援下，撕毁停战协议，炮火再次轰向那片曾与他们并肩抗战的土地。全面内战爆发，历史的车轮驶入决战的关口。此刻，我们不能停滞在一隅之地，如果我们要让这片土地自废墟中重生，我们就必须举起旗帜，横扫一切阻碍，将分裂的山河重新铸成不可分割的国家！"
 chi.11.t: "祖国统一"
 chi.11.d: "烽烟散去，硝烟已冷，曾割裂这片土地的敌人已被击败，曾困扰国家的分裂者已被消灭，或是俯首称臣。[ROOT.GetCountry.GetName]再次巍然屹立，比以往任何时候都更加强大。"
 chi.11.f: "她从未见过如此璀璨的夜空。红色、金色、粉色的烟花在苍穹中绽放，将黑夜照得如同白昼。爆炸的光影映在窗棂上，与她家楼下街道上腾空的孔明灯交相辉映。人群汇聚在巷弄之间，老人们点燃香烛，孩子们挥舞着小旗，歌声与欢呼声在整座城池间回荡。\n\n夜色终将归于平静，庆典的焰火总会燃尽，但今日所铸成的铁血誓言不会消散。我们的祖国已经回归统一——不可分割，主权独立，直至永恒！"
 chi.11.a: "我们国家决不能再次分裂。"
 chi.11.b: "让我们全力重建祖国！"
 alignment_politics: "结盟政治"
