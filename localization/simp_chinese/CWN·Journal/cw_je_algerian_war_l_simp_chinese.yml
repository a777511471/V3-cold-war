l_simp_chinese:
  je_algerian_affair_main: "稳定阿尔及利亚局势"
  je_algerian_affair_main_goal: "完成稳定阿尔及利亚局势的一系列任务。"
  je_algerian_affair_main_reason: "阿尔及利亚不是一块普通的殖民地，而是法兰西的一部分，我们决不能允许叛乱分子撼动我们的统治。北非的风暴正席卷法兰西的南方疆土。阿尔及利亚，这片自十九世纪起便纳入法兰西版图的土地，如今正陷入动荡之中。民族主义者的呼声在山岳与市镇间回荡，激进分子在街头巷尾策划阴谋，遥远的国际势力亦在暗中搅动风云。然而，阿尔及利亚已是法兰西的延伸，数十万法国移民在此生息繁衍，这片土地的命运，岂容他人篡改？若要稳定局势，我们必须采取果断措施——一方面接纳忠于法国的阿尔及利亚人，给予他们一席之地，另一方面则以铁腕手段彻底剿灭叛乱，让反抗者明白，法兰西的统治不容挑战。"

 indochina.3.t: "报复印度支那？"
 indochina.3.d: "越南的局势已然失控，天主教徒成为迫害的目标，沙文主义者与虔信者群情激愤，要求法兰西立即作出回应。"
 indochina.3.f: "历史已经告诉我们，文明世界不能坐视野蛮的胜利。若不遏制暴政，今日他们迫害信徒，明日便将驱逐法兰西的影响。我们的军队不会久留，这不过是一场迅捷的干预，一次短暂的行动——但必要且正义。让我们过去吧——不会太久，去了就回，两个月的简单冒险而已。"
 indochina.3.a: "必须惩罚越南猴子，并且让整个越南置于法国的保护！"
 indochina.4.t: "印度支那联邦"
 indochina.4.d: "我们对印度支那的控制已得到成长和巩固，这片地方现在可以算作成功的殖民地和保护领之联邦。"
 indochina.4.f: "“因着思想、身体和精神的合一，我们为此欢庆。本土和印度支那现今行动、言语、感受都如同一体。我们各民族团结在一起，永远不会分裂。怎么可能会有其他的可能性呢？”"
 indochina.4.a: "在人民中推广我们的价值观。"
 indochina.4.b: "促进殖民地的橡胶生产。"
 indochina.4.c: "在印度支那扶植忠于我们的王公。"
 indochina.4.dd: "弘扬我们的光荣统治！"
 je_indochina: "印度支那行动"
 je_indochina_reason: "越南，那个曾在法兰西庇护下发展的土地，如今却弥漫着混乱与背叛。地方政权对天主教徒的迫害，昭示着对法国价值观的公然挑衅，亦是对帝国权威的亵渎。法兰西岂能容忍此等叛逆？我们不仅必须回应，还要让整个印度支那明白——谁才是这片土地真正的主人。我们的军队将带来秩序，我们的法律将带来正义，我们的旗帜将继续飘扬，直至整个地区重新回归正轨，直至法国的荣耀再次得到彰显。"