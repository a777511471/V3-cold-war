  je_salazar_main: "上帝、祖国和家庭"
  je_salazar_main_goal: "完成一系列任务，将[ROOT.GetCountry.GetName]变成[ROOT.GetCountry.GetRuler.GetFullName]所设想的“新国家”。"
  je_salazar_main_reason: "传统天主教价值观、法团主义、殖民主义是[ROOT.GetCountry.GetRuler.GetFullName]独裁统治的基石。然而，[ROOT.GetCountry.GetRuler.GetLastName]博士的宏伟计划正遭受着冷战新格局的强烈冲击——无论是美国所倡导的民主政治，还是苏联所倡导的共产主义，都与我们的规划背道而驰。正如那个流传已久的笑话一样，在历史的车道上，[ROOT.GetCountry.GetName]正目睹着其他国家逆行。"