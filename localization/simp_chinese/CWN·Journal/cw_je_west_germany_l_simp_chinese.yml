 je_first_berlin_blockade_main:0 "第一次柏林危机"
 je_first_berlin_blockade_main_goal:0 "让西德从封锁中挣脱出来。"
 je_first_berlin_blockade_reason:0 "柏林是德国的象征，如果我们要建立一个和苏联抗衡的德国的话，无论如何也不能丢掉西柏林。我们必须要通过各种手段来打破苏联封锁，保障西柏林市民的日常生活所需。只要我们撑过了这段时期，苏联就会渐渐发现他们的封锁不仅毫无意义，而且也让自身损失惨重，西柏林的封锁就会渐渐消失。最终，我们能够建立一个自由民主的德国，并以此同铁幕那边对抗。"
