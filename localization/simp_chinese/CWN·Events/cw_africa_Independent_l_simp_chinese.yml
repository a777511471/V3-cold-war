l_simp_chinese:
 africa_breakup.1.t: "西非独立"
 africa_breakup.1.d: "随着法兰西殖民帝国的衰落，西非成功独立，西非人民终于迎来了解放"
 africa_breakup.1.f: "在这个阳光明媚的季节，西非大地上一片生机勃勃。碧蓝的天空下，金黄的麦浪随风起伏，仿佛是在为这片土地的平凡英雄们谱写颂歌。历经多年斗争与牺牲，终于迎来了独立的时刻，昔日被钳制的灵魂在自由的旋律中重生。"
 africa_breakup.1.a:  "“解体成为不同的国家”"
 africa_breakup.1.b:  "“保持西非联邦！”"
 africa_breakup.2.t:  "赤道非州独立"
 africa_breakup.2.d:  "随着法兰西殖民帝国的衰落，赤道非州成功独立，赤道非洲的人民终于获得了独立和主权"
 africa_breakup.2.f:  "当赤道非洲的旗帜在阳光下轻轻飘扬，那一刻，历史的篇章翻开了新的一页。这片古老而充满魅力的土地，在经历了漫长的沧桑与斗争后，终于迎来了独立的曙光。赤道非洲，这个名字承载着无数梦想与希望，它的独立之路，不仅是一段民族觉醒的故事，更是一曲关于自由与和平的赞歌。"
 africa_breakup.2.a:  "“解体成为不同的国家”"
 africa_breakup.2.b:  "“保持中非联邦！”"
