l_simp_chinese:
 war.Korea_War_PRK.t:0 "决议发起朝鲜战争"
 war.Korea_War_PRK.d:0 "面对南方的伪政权，我们的政府正在商讨是否发动朝鲜战争，同意朝鲜半岛"
 war.Korea_War_PRK.f:0 ""同志，长久以来，我们敬爱的领袖金日成同志一直心系南方受苦受难的同胞们。如今，李承晚的傀儡政权摇摇欲坠，帝国主义的影响力日渐衰退。一个千载难逢的机会摆在我们面前：解放南方，统一朝鲜！但，同志，这并非一个轻率的决定。战争的代价是巨大的，国际形势也错综复杂。我们需要审慎地权衡利弊，才能做出最符合朝鲜人民利益的决定。""
 war.Korea_War_PRK.a:0 "“南下！”"
 war.Korea_War_PRK.b:0 "“现在还不能轻易进攻！”"
 war.Korea_War_USSR.t:0 "朝鲜战争爆发"
 war.Korea_War_USSR.d:0 "朝鲜人民军越过三八线，对南朝鲜发动全面进攻，战火蔓延至整个朝鲜半岛。面对美国及联合国军介入的可能性，苏联政府面临着艰难的抉择：是袖手旁观，还是支援朝鲜人民军？"
 war.Korea_War_USSR.f:0 "朝鲜战争的爆发，令苏联政府看到了扩大自身影响力的机会。作为朝鲜的盟友，苏联一直视朝鲜半岛为其势力范围，而美国在朝鲜战争中插手，更激起了苏联的警惕。为了维护自身利益，并阻止美国在东亚地区的扩张，苏联政府不得不考虑支援朝鲜人民军。"
 war.Korea_War_USSR.a:0 "“支持朝鲜，南下！”"
 war.Korea_War_USSR.b:0 "“这件事我们不能参与！”"
 war.Korea_War_USA.t:0 "朝鲜战争爆发"
 war.Korea_War_USA.d:0 "朝鲜人民军突然越过三八线，对南朝鲜发动全面进攻，战火蔓延至整个朝鲜半岛。面对共产主义势力扩张的威胁，美国政府面临着艰难的抉择：是袖手旁观，还是介入这场战争？"
 war.Korea_War_USA.f:0 "朝鲜战争的爆发，打破了战后世界短暂的平静，也令美国政府感到不安。作为世界头号强国，美国在冷战中一直试图遏制苏联的影响力，而朝鲜战争的爆发，恰恰体现了苏联在东亚地区扩张的野心。为了维护自身的利益，并阻止共产主义的进一步蔓延，美国政府不得不考虑介入这场战争。"
 war.Korea_War_USA.a:0 "“支持韩国，北上！”"
 war.Korea_War_USA.b:0 "“这件事我们不能参与！”"
 war.Korea_War_CHN.t:0 "朝鲜战争爆发"
 war.Korea_War_CHN.d:0 "1950年，随着两国冲突来到极点，朝鲜战争全面爆发,而美国对我国领土进行了侵犯"
 war.Korea_War_CHN.f:0 "朝鲜战争的爆发，让中国政府感受到了前所未有的压力。中国一直视朝鲜为其战略缓冲区，而美军越过三八线，更令中国政府感到不安。如果朝鲜半岛被美军控制，中国将面临着美军在东亚地区的直接威胁。为了保卫新中国，并阻止美帝在朝鲜半岛的扩张，中国政府不得不考虑抗美援朝。"
 war.Korea_War_CHN.a:0 "“为了我们的人民不再受屈辱，为了我们的家园不再被侵略，为了我们的天空上不再有帝国主义的轰炸机，为了我们的房屋，庄稼不再被烧毁，立即抗美援朝，保家卫国！”"
 war.Korea_War_CHN.b:0 "“我们现在还不能招惹美国”"
 korean_war.t:0 "“朝鲜战争爆发”" 
 korean_war.d:0 "1950年，朝鲜民主主义人民共和国的军队在金日成的指挥下，悄然越过三八线，向南方发起了全面攻势。这一刻，朝鲜战争的火焰开始蔓延，点燃了整个半岛的紧张局势。" 
 korean_war.f:0 "在清晨的第一缕阳光洒落之前，北朝鲜的炮火已开始轰鸣。数以万计的北朝鲜士兵在坦克和重火力的掩护下，迅速向南推进。面对突如其来的攻击，南朝鲜军队陷入混乱，首尔的街头瞬间被纷乱的民众和撤退的士兵淹没。" 
 the_korea_war_against_america:0 "抗美援朝"