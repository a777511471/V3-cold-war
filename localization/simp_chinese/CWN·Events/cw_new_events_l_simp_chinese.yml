l_simp_chinese:
 rus.8.t:0 "钢铁之殇" #斯大林逝世
 rus.8.d:1 "隆重而沉重的送葬队伍缓缓穿行于苏维埃社会主义共和国联盟的伟大街道。炮车稳稳前行，仿佛承载着整个国家的悲痛。苏维埃社会主义共和国联盟军队肃立于道路两旁，随行的人民代表神情的步伐沉稳而缓慢，似乎整个国家都在这一刻屏息默哀。"
 rus.8.f:1 "1953年3月，莫斯科的寒风裹挟着肃杀的气息，红场上的钟声低沉而沉重，仿佛在为一个时代的终结敲响丧钟。即便是在苏维埃社会主义共和国联盟的核心地带，这场伟大的悼念也是真挚而深切的。那些潜伏于阴影中的敌人，在克格勃的威慑下不敢妄动，而人民的哀思则如同潮水般在每一条街道蔓延。“莫洛托夫同志，我们现在可以回去了……”苏维埃社会主义共和国联盟部长会议第一副主席莫洛托夫低头盯着他的私人护理员，镜片后的冷漠目光让对方不敢再说下去。送葬的队伍穿过广阔的土地，每一座城市都涌出无数民众，目送着这位曾经决定苏维埃社会主义共和国联盟命运的伟人远去。莫洛托夫策马疾行，跨越漫长的路途，他的护卫队交接于国境线，而他下马跟随灵柩进入礼堂，成为送葬队伍中唯一离开的成员。
 rus.8.a:0 "莫洛托夫在口袋里翻找悼词。"

 rus.9.t:0 "再见了，斯大林同志！"
 rus.9.d:1 "他曾是革命的烈焰，点燃十月风暴的火种；他曾是战争的铁拳，将法西斯的野心碾碎在斯大林格勒的废墟之下。他以冷酷的目光凝视敌人，以坚定的意志统御亿万人民，将一个破碎的帝国重塑为红色巨人。他的名字是恐惧，也是希望；他的身影是灯塔，也是阴影。从饥荒的阴影到工业的轰鸣，从卫国战争的硝烟到冷战的棋局，他的铁腕带来了秩序，也带来了恐惧；他的远见铺就了道路，也埋下了苦难的种子。"
 rus.9.f:1 "莫洛托夫低垂着目光，他的声音在礼堂内回荡。他曾跟随这位伟人走过风雨岁月，每一次话语的回响都让他的心脏揪紧。他深知，此刻世界的目光都聚焦于他，摄像机的镜头无情地捕捉着他的一举一动。然而，当他缓缓抬头，目光望向远方，压抑的情绪终于冲破理智的枷锁。“但最重要的是……”他深吸一口气，声音低沉而坚定，“他是我的领袖。”"
 rus.9.a:0 "无论他是被后人传颂，或被诅咒；巨人的影子仍将长久地投射在这片红色的土地上。"

 rus.1.t:0 "日丹诺夫主持审查"
 rus.1.d:1 "在苏维埃社会主义共和国联盟伟大的革命征程中，日丹诺夫同志成为了意识形态斗争的坚实盾牌。作为中央委员会宣传部部长，他以无比坚定的信念维护着社会主义文化的纯洁，确保苏维埃的精神长存于人民心中。在他的领导下，苏维埃社会主义共和国联盟的文化阵线更加坚固，任何企图削弱苏维埃信仰的思想都将被无情清算。"
 rus.1.f:1 "他敏锐地洞察到文艺界的暗流，毫不犹豫地对左琴科与阿赫玛托娃等人的创作进行批评。他深知，苏维埃社会主义共和国联盟的文化必须成为社会主义建设的利剑，而非动摇人民信仰的毒素。正是他主导的改革，令苏维埃社会主义共和国联盟的文化阵地牢不可破，使国家意识形态的纯洁性得以巩固。"
 rus.1.a:0 "斯大林主义的又一个胜利…？"

 rus.2.t:0 "#v $苏维埃社会主义共和国联盟$#!共产党第十九次代表大会"
 rus.2.e:1 "伴随着雷鸣般的掌声和庄严的《国际歌》，斯大林同志缓步走向讲台。每一步都激起会场内更加热烈的欢呼，他的身影仿佛象征着苏维埃的伟大胜利。他的声音坚定而有力：“同志们！我们感谢来自世界各地的布尔什维克同志们！感谢他们对我们的信任，感谢他们对我们事业的坚定支持！我特别珍视这种信任，这种信任表示他们愿意支持我们党，为各国人民未来拥有一个光辉灿烂的前途而斗争，为反对战争而斗争，为维护和平而斗争！在世界人民共同奋斗的道路上，我们始终需要兄弟国家的信赖、同情与支持。昨日如此，今日如此，未来亦然！”"
 rus.2.f:1 "掌声如海浪般涌动，斯大林同志缓缓走下讲台。谁将承担结会演说的重任？"
 rus.2.a:0 "斯大林同志的助手：马林科夫同志！"
 rus.2.b:0 "斯大林同志的干将：赫鲁晓夫同志！"
 rus.2.c:0 "斯大林同志的尖刀：贝利亚同志！"
 rus.2.d:0 "斯大林同志的元帅：朱可夫同志！"

 russo_chinese.5.t:0 "贝利亚的演说"
 russo_chinese.5.e:1 "“同志们！自党的第十八次代表大会以来，世界风云变幻，历史的巨轮碾碎了帝国主义的妄想。在国际帝国主义反动势力的策划下，#v $德国$#!在西方，而军国主义#v $JAP$#!在东方而策划的战争，由于[ROOT.GetCountry.GetName]人民的英勇斗争，以帝国主义者料想不到的方式而结束了！我们是愈战愈强了，我们的国际地位提高了。中欧的好几个国家脱离了资本主义体系而建立了人民民主制度，以及比如#v $CHI$#!人民的历史性重大牺牲给帝国主义者带来了沉重的打击...而在未来的就很长一段时间中，我们伟大的[ROOT.GetCountry.GetName]都将为了巩固和斗争世界和平而奋斗！”"
 russo_chinese.5.f:1 "贝利亚同志的话音刚落，会场内已是掌声雷动。"
 russo_chinese.5.a:0 "杰出的演讲！"

 russo_chinese.6.t:0 "赫鲁晓夫的演说"
 russo_chinese.6.e:1 "自党的第十八次代表大会以来，世界发生了剧变，帝国主义的阴谋在[ROOT.GetCountry.GetName]人民的英勇反击下化为尘埃。西方的帝国主义#v $德国$#!溃败，东方的军国主义#v $JAP$#!崩溃，整个世界见证了社会主义力量的崛起！中欧各国纷纷走上人民民主的道路，在社会主义的旗帜下团结起力量。#v $CHI$#!人民的英勇斗争震撼了整个世界，令美帝国主义的走狗望风而降。未来，我们将继续奋斗，以坚定的信念守护和平，以钢铁意志粉碎一切反动势力！”"
 russo_chinese.6.f:1 "赫鲁晓夫同志自讲台走下，会场内的掌声经久不息。"
 russo_chinese.6.a:0 "杰出的演讲！"

 russo_chinese.7.t:0 "精彩的演说"
 russo_chinese.7.e:1 "“同志们！自党的第十八次代表大会以来，世界风云变幻，历史的巨轮碾碎了帝国主义的妄想。在西方，#v $德国$#!的战争机器轰然崩溃，在东方，军国主义#v $JAP$#!的野心化作泡影。而在这一切的背后，是[ROOT.GetCountry.GetName]人民的英勇斗争，是社会主义阵营的无上荣耀！我们的国际地位空前提高，中欧数国挣脱资本主义枷锁，而#v $CHI$#!人民的巨大牺牲更是给予帝国主义者以沉重打击。未来，我们伟大的[ROOT.GetCountry.GetName]，必将继续捍卫世界和平，粉碎一切反动势力的阴谋！”"
 russo_chinese.7.f:1 "在全场的掌声与欢呼中，这位同志结束了他的演讲，走下了讲台。"
 russo_chinese.7.a:0 "杰出的演讲！"

 russo_chinese.8.t:0 "朱可夫的演说"
 russo_chinese.8.e:1 "“同志们！自党的第十八次代表大会以来，世界的风暴翻腾，历史的浪潮冲刷着旧世界的腐朽根基。在西方，#v $德国$#!的战争机器在伟大卫国战争的怒火中化为焦土；在东方，军国主义#v $JAP$#!的疯狂妄想被钢铁洪流彻底粉碎。而这一切的胜利，皆源自[ROOT.GetCountry.GetName]人民坚定不移的意志，源自社会主义阵营的团结无畏。我们愈战愈强，我们的国际地位空前提升，帝国主义势力节节败退，而#v $CHI$#!人民以血肉之躯书写的伟大斗争更是给予敌人以致命一击。未来，我们伟大的[ROOT.GetCountry.GetName]，将继续高举革命旗帜，为世界和平与无产阶级的胜利而奋斗！”"
 russo_chinese.8.f:1 "在全场的掌声与欢呼中，朱可夫同志结束了他的演讲，走下了讲台。"
 russo_chinese.8.a:0 "杰出的演讲！"

 russo_chinese.9.t:0 "斯大林同志逝世"
 russo_chinese.9.e:1 "今天，我党、我军、我国各族人民公认的，享有崇高威望的卓越领袖，伟大的马克思列宁主义者，伟大的无产阶级革命家、政治家、军事家、外交家，久经考验、坚定不移的共产主义战士——约瑟夫·斯大林同志，由于中风导致的脑溢血，不幸永远地离开了我们！斯大林同志以其钢铁意志与非凡智慧，引领苏维埃社会主义共和国联盟走向辉煌，他的革命精神与伟大战略眼光将永存于世，激励我们用实际行动表达对他的悼念，在[ROOT.GetCountry.GetName]社会主义建设的道路上继续奋进！"
 russo_chinese.9.f:1 "来不及悲痛，时局需要一位新的[ROOT.GetCountry.GetName]主席代表无产阶级国家机器的意志："
 russo_chinese.9.a:0 "马林科夫同志是合格的接班人。"
 russo_chinese.9.b:0 "赫鲁晓夫同志更加适合处理当下的局势。"
 russo_chinese.9.c:0 "如今的形势需要贝利亚同志领导。"
 russo_chinese.9.d:0 "我们必须保持集体领导。"

 russo_chinese.10.t:0 "反对派发动党内斗争"
 russo_chinese.10.e:1 "现任的[ROOT.GetCountry.GetName]主席毫无疑问是斯大林同志所期望的继任者。然而，党内反对派却不甘接受这一决定，他们密谋策划，意图挑战党的领导，破坏苏维埃的团结。"
 russo_chinese.10.f:1 "这些阴险的野心家已然暗中集结，他们联合自身派系，试图动摇无产阶级专政的基石，为夺取[ROOT.GetCountry.GetName]主席的权位，不惜发动一场政治风暴！"
 russo_chinese.10.a:0 "组织的叛徒！"

 russo_chinese.11.t:0 "克里姆林宫部长会议"
 russo_chinese.11.e:1 "1953年，赫鲁晓夫、马林科夫、贝利亚、莫洛托夫和朱可夫五位同志组成了中央书记处，并决定在今天于克里姆林宫召开部长级会议。然而，在这表面上的庄严会议背后，隐藏着巨大的暗潮——[ROOT.GetCountry.GetName]的党内斗争已至白热化，最高权力的角逐已然到来。为了巩固自身地位，各方势力皆在暗中筹谋，最无情的清洗、最冷酷的政治斗争，即将拉开帷幕。"
 russo_chinese.11.f:1 "朱可夫同志的数名警卫已经埋伏在地下室，苏维埃的未来晦暗不明。"
 russo_chinese.11.a:0 "朱可夫决定独自行动。"
 russo_chinese.11.b:0 "贝利亚应该和朱可夫谈谈。"
 russo_chinese.11.c:0 "赫鲁晓夫需要与朱可夫沟通。"
 russo_chinese.11.d:0 "马林科夫预见了情况…？"

 russo_chinese.12.t:0 "清洗部长会议"
 russo_chinese.12.e:1 "1953年6月26日，克里姆林宫会议上，朱可夫同志突然发难，他当众宣读了一份罪行指控，并在埋伏已久的警卫协助下，将反对派彻底清除。"
 russo_chinese.12.f:1 "同年12月18日，朱可夫同志以叛国罪、恐怖主义罪和反革命罪将赫鲁晓夫等人处决。"
 russo_chinese.12.a:0 "朱可夫同志万岁！"

 russo_chinese.13.t:0 "赫鲁晓夫被捕"
 russo_chinese.13.e:1 "1953年6月26日的克里姆林宫会议上，贝利亚等人突然展开了对赫鲁晓夫的强烈抨击，并在莫斯卡连科和朱可夫等军人的协助下将他逮捕。"
 russo_chinese.13.f:1 "同年12月18日，贝利亚以叛国罪、恐怖主义和反革命罪将赫鲁晓夫等人处决。"
 russo_chinese.13.a:0 "贝利亚同志万岁！"

 russo_chinese.14.t:0 "贝利亚被捕"
 russo_chinese.14.e:1 "1953年6月26日的克里姆林宫会议上，赫鲁晓夫等人突然展开了对贝利亚的强烈抨击，并在莫斯卡连科和朱可夫等军人的协助下将他逮捕。"
 russo_chinese.14.f:1 "同年12月18日，赫鲁晓夫以叛国罪、恐怖主义和反革命罪将贝利亚等人处决。"
 russo_chinese.14.a:0 "赫鲁晓夫同志万岁！"

 russo_chinese.15.t:0 "朱可夫的阴谋被揭露"
 russo_chinese.15.e:1 "1953年6月26日的克里姆林宫会议上，一直迟迟没有到达会场的朱可夫突然在数名武装士兵的押送下垂头丧气地步入大厅。马林科夫当众宣读了针对朱可夫的指控："
russo_chinese.15.f:1 "在克里姆林宫的地下室中埋伏武装人员，意图颠覆[ROOT.GetCountry.GetName]的政权！但在马林科夫同志的英明领导下，苏维埃识破了这场阴谋，并决定将其逮捕送往法庭进行公正的审判。"
 russo_chinese.15.a:0 "[ROOT.GetCountry.GetName]万岁！"

 spa.1.t:0 "政府改组"
 spa.1.e:1 "1947年，佛朗哥将军宣布恢复君主政体，并自任[ROOT.GetCountry.GetName]国家元首。他选定胡安·卡洛斯为未来的[ROOT.GetCountry.GetName]国王，并将其召回国内接受严格的军事与政治教育。胡安·卡洛斯在中学毕业后，先后进入[ROOT.GetCountry.GetName]陆、海、空三军学院进行全面训练，为未来的统治做好准备。"
 spa.1.f:1 "为了[ROOT.GetCountry.GetName]的统一和稳定，我们需要选择扶植或打压某个派系："
 spa.1.a:0 "扶植伊莎贝尔派。"
 spa.1.b:0 "继续扶植佛朗哥派。"
 spa.1.c:0 "进一步打压卡洛斯派。"
 spa.1.d:0 "继续扶植国家工团主义者。"
 spa.1.g:0 "铲除那些激进的左翼分子。"

 spa.2.t:0 "佛朗哥将军逝世"
 spa.2.e:1 "[ROOT.GetCountry.GetName]的大独裁者、摄政王佛朗哥将军，在1975年11月20日逝世，胡安·卡洛斯一世登上[ROOT.GetCountry.GetName]王位，佛朗哥长达四十年的独裁统治自此落幕。"
 spa.2.f:1 "为了结束佛朗哥派的专制统治，推动君主立宪制与民主改革，我们需要决定如何应对各个政治派系："
 spa.2.a:0 "扶植伊莎贝尔派。"
 spa.2.b:0 "打压佛朗哥派。"
 spa.2.c:0 "尝试彻底铲除卡洛斯派。"
 spa.2.d:0 "打压国家工团主义者。"
 spa.2.g:0 "左派有时也需要拉拢。"

 guojialianmeng.1.t:0 "成立欧洲联盟"
 guojialianmeng.1.d:1 "欧洲共同体马斯特里赫特首脑会议通过《欧洲联盟条约》的那个夜晚，你做了一个梦。"
 guojialianmeng.1.f:1 "中世纪隔绝人民的层层城堡在圣光照耀下崩裂，无数邦国的骑士、国王与王后携手同行，率领他们的人民迈向未来。历史的伟力塑造了一个团结的欧洲，这是主赐予我们的新时代的伊甸园。"
 guojialianmeng.1.a:0 "全欧洲前所未有地团结在了一起！"

  nanmei.1.t: "[ROOT.GetCountry.GetName]公民"
  nanmei.1.d: "[ROOT.GetCountry.GetName]政府举行了盛大的仪式，纪念克丘亚人为[ROOT.GetCountry.GetName]做出的巨大贡献，并正式宣布克丘亚人现在享有与[ROOT.GetCountry.GetName]公民相同的权利。"
  nanmei.1.f: "来自欧洲的白人移民是我们亲密无间的同胞，那么，那些随[ROOT.GetCountry.GetName]而奋斗的克丘亚人，他们为何不能成为我国的公民？我们的国度诞生于反抗西班牙暴政的斗争之中，在自由和平等的法律的庇护下繁荣，我们绝不能重蹈压迫者的覆辙！"
  nanmei.1.a: "我是克丘亚人，[ROOT.GetCountry.GetName]公民，自由国度的公民！"

  nanmei.2.t: "[ROOT.GetCountry.GetName]公民"
  nanmei.2.d: "[ROOT.GetCountry.GetName]政府举行了盛大的仪式，纪念华人为[ROOT.GetCountry.GetName]做出的巨大牺牲，并正式宣布华人现在享有与[ROOT.GetCountry.GetName]公民相同的权利。"
  nanmei.2.f: "来自欧洲的白人移民是我们亲密无间的同胞，那么，那些随[ROOT.GetCountry.GetName]而奋斗的华人，他们为何不能成为我国的公民？我们的国度诞生于反抗西班牙暴政的斗争之中，在自由和平等的法律的庇护下繁荣，我们绝不能重蹈压迫者的覆辙！"
  nanmei.2.a: "我是华人，[ROOT.GetCountry.GetName]公民，自由国度的公民！"

  nanmei.3.t: "[ROOT.GetCountry.GetName]公民"
  nanmei.3.d: "[ROOT.GetCountry.GetName]政府举行了盛大的仪式，纪念日裔为[ROOT.GetCountry.GetName]做出的巨大牺牲，并正式宣布日裔现在享有与[ROOT.GetCountry.GetName]公民相同的权利。"
  nanmei.3.f: "来自欧洲的白人移民是我们亲密无间的同胞，那么，那些随[ROOT.GetCountry.GetName]而奋斗的日裔，他们为何不能成为我国的公民？我们的国度诞生于反抗西班牙暴政的斗争之中，在自由和平等的法律的庇护下繁荣，我们绝不能重蹈压迫者的覆辙！"
  nanmei.3.a: "我是秘鲁日裔，[ROOT.GetCountry.GetName]公民，自由国度的公民！"

 PRK_event.3.t:0 "政府改组"
 PRK_event.3.e:1 "1948年9月9日，朝鲜劳动党领导人金日成在#v $朝鲜$#!半岛北半部建国，采用了“#v $朝鲜$#!”这一国号，定国名为“朝鲜民主主义人民共和国”。然而，国内派系矛盾日益加剧，思想混乱，现在是时候做出变革了！"
 PRK_event.3.f:1 "为了确保朝鲜民主主义人民共和国的统一和稳定，我们必须在现实面前做出选择，扶植某个派系，以在未来稳固政权："
 PRK_event.3.a:0 "扶植游击队派"
 PRK_event.3.b:0 "扶植南劳派"
 PRK_event.3.c:0 "扶植延安派"
 PRK_event.3.d:0 "扶植甲山派"
 PRK_event.3.g:0 "扶植苏维埃社会主义共和国联盟派"

 PRK_event.4.t:0 "太阳的陨落"
 PRK_event.4.e:1 "[ROOT.GetCountry.GetName]的历史迎来了决定性的一刻——伟大的领袖、人民的太阳金日成主席于1994年7月8日溘然长逝。山河呜咽，举国哀悼，而在悲痛之中，一个新的时代即将开启。经过党内选举，领袖的长子金正日继任为[ROOT.GetCountry.GetName]的最高领导人，他将肩负起维系国家团结与稳定的伟大使命。""
 PRK_event.4.f:1 "然而，唯有铁腕方能确保国家的巩固与思想的纯洁。为了让主体思想成为[ROOT.GetCountry.GetName]唯一的信仰，我们必须采取果断措施，铲除一切不稳定因素："
 PRK_event.4.a:0 "扶植游击队派"
 PRK_event.4.b:0 "彻底铲除南劳派"
 PRK_event.4.c:0 "彻底铲除延安派"
 PRK_event.4.d:0 "彻底铲除甲山派"
 PRK_event.4.g:0 "彻底铲除#v $苏维埃社会主义共和国联盟$#!派"

 PRK_event.5.t:0 "#v $朝鲜$#!和平统一"
 PRK_event.5.d:1 "曾经，我们的国土被割裂，人民被迫分离，三八线之上，兄弟相向而立。然而，在伟大领导者的指引下，历史的齿轮终于滚向了正义的方向，[ROOT.GetCountry.GetName]的反对者已然臣服，统一的钟声响彻整个半岛。"
 PRK_event.5.f:1 "今天，随着北纬三十八度线上最后一个军事设施被拆除，再也没有任何东西能阻挡英雄的人民欢聚一堂！#v $朝鲜$#!在和平中重新统一，曾经的战壕化作麦田，家书不再需要越境传递。金达莱再次怒放于三千里锦绣河山，高丽的土地不再承受撕裂之痛。帝国主义强加的分裂终被粉碎，从今往后，我们将以主人翁的姿态掌控自己的命运。"
 PRK_event.5.a:0 "主！体！"

 chi.1.t:0 "农民踊跃参军"
 chi.1.d:1 "“嫩说蒋介撕似甚么反动派，那啥子叫反动派捏？”台下黑黢黢的老农抱着面黄肌瘦的孩子，目光迷惘。"
 chi.1.f:1 "你心头一震，竟不知如何说起。一边的干部急中生智，大喊：“反动派就是你们吃观音土的时候，他们顿顿都在吃猪肉大葱的饺子！”台下的群众顿时群情激愤地咒骂起来，挥舞着愤怒的拳头。"
 chi.1.a:0 "打倒反动派！"
 nongminyongyuecanjun_modifier:0 "农民踊跃参军"

 chi.2.t:0 "还乡团反攻倒算"
 chi.2.d:1 "“还乡团……是刮民党的爪牙，对抗[ROOT.GetCountry.GetName]，诋毁中央，这群恶霸汉奸，破坏土改，屠杀革命群众！求求中央，帮帮我们，快点消灭这帮畜生！”"
 chi.2.f:1 "你低头看向手中的求助信，字迹歪斜，字字泣血。“是谁写的？”“是之前被批斗分田的地主……咱只是分了他的地，那群天怒人怨的东西活埋干部焚烧房屋后，抢劫了我们留给他的薄产，还强暴了他唯一的孙女。”"
 chi.2.a:0 "审判还乡团！"
 huanxiangtuan_modifier:0 "还乡团反攻倒算"

 chi.3.t:0 "#v $苏维埃社会主义共和国联盟$#!的军事援助"
 chi.3.d:1 "1946年解放战争爆发后，#v $苏维埃社会主义共和国联盟$#!以国际主义精神向[ROOT.GetCountry.GetName]输送了大量援助。源源不断的军事物资自东北地区运输而来。"
 chi.3.f:1 "接应的野战军官兵看到，为首的高个子斯拉夫小伙在火车还未停稳时便遥遥招手。等到浓烟滚滚的车头缓缓停下，灰尘散尽，才看见他挥舞的并非手臂，而是一只卫国战争后安装的假肢。"
 chi.3.a:0 "阶级感情无论民族，这是国际主义的胜利。"
 sulianjunyuan_modifier:0 "#v $苏维埃社会主义共和国联盟$#!的军事援助"

 chi.4.t:0 "强征壮丁"
 chi.4.d:1 "解放战争时期，[ROOT.GetCountry.GetName]的国民党反动派与地痞、地主老财等反动势力相互勾结，以剿匪为幌子大抓壮丁，榨取最后一丝民脂民膏。"
 chi.4.f:1 "1933年6月17日，国民党就出台了一部新法，叫做《[ROOT.GetCountry.GetName]兵役法》，实行“征兵制”，将战争的代价强行分摊到千家万户。由于国军基层层层压榨盘剥管理混乱，逃亡成为最后的生存手段，而国民党毫不犹豫地选择了更残酷的方式：封村、围剿、驱赶，一队队青壮年被押解至军营，成为一具具等待被抛弃的血肉工具。从1937年开始，抓壮丁就成了西南地区人们挥之不去的梦魇。"
 chi.4.a:0 "为了党国，再苦一苦人民。"
 zhuazhuangding_modifier:0 "强征壮丁"

 chi.5.t:0 "#v $USA$#!的军事援助"
 chi.5.d:1 "全面内战的烽火席卷中华大地，而在这场决定国运的战争中，#v $USA$#!以反共为名向[ROOT.GetCountry.GetName]提供了大量援助，试图扶持一个他们能够掌控的政权。"
 chi.5.f:1 "1946年后，#v $USA$#!向[ROOT.GetCountry.GetName]提供了大量的物资援助。只不过这个物资援助……可能不是官兵们想要的。"
 chi.5.a:0 "嗯？库房里怎么突然多出好多钢琴呀！"
 meiguojunyuan_modifier:0 "#v $USA$#!的军事援助"

 GER.4.t:0 "德国和平统一"
 GER.4.d:1 "从神圣罗马帝国的荣光，到腥风血雨中的分裂，德国的历史一直在撕裂与团结之间摇摆。魏玛的萧条、纳粹的疯狂、冷战的壁垒……这些过去的一切，如今都将归于历史的尘埃。"
 GER.4.f:1 "东西德人民在街头相拥而泣，久违的统一重新降临这片土地。意识形态的界限不再阻隔日耳曼人的血脉，统一、正义和自由将成为我们幸福的保证。无论之前的道路如何曲折，日耳曼妮娅还是头戴花冠，推倒了那面高墙，让我们重新拥抱在一起，迎接未知又充满期待的挑战，#v $GER$#!，我们的祖国，再次站立在历史的转折点上。"
 GER.4.a:0 "为了我们的#v $GER$#!祖国，我们必须再次奋斗！"

 guojialianmeng.2.t:0 "成立北大西洋公约组织"
 guojialianmeng.2.d:2 "从波罗的海的什切青到亚得里亚海的的里雅斯特，一条横贯欧陆的铁幕已然降下。在[ROOT.GetCountry.GetName]的倡议下，#v $英国$#!、#v $FRA$#!、荷兰、比利时、卢森堡、加拿大、丹麦、挪威、冰岛、葡萄牙、意大利等12国在华盛顿签订北大西洋公约。公约规定，缔约国任何一方遭到武装攻击时，应视为对全体缔约国的攻击。各缔约国应采取视为必要之行动，包括武力之使用在内。北大西洋公约组织（简称北约）条约经各国陆续批准后开始生效。"
 guojialianmeng.2.f:2 "面对全球战略态势的变化，你以国家元首的身份庄严宣告：“任何对我们成员国的武装攻击，都将被视为对全体成员国的攻击。我们承诺，以一切必要手段保卫自由世界。”"
 guojialianmeng.2.a:0 "若要世界和平，自由必先备战！"

 chi.6.t:0 "[ROOT.GetCountry.GetName]收复旅顺和大连"
 chi.6.d:1 "世界的目光汇聚在这场谈判之上，而今日，结果终于揭晓：#v $苏维埃社会主义共和国联盟$#!承诺归还旅顺和大连，苏军将彻底撤出这片饱经风霜的土地，在我国的主动要求下，苏维埃社会主义共和国联盟舰队撤出中国海域。
 chi.6.f:1 "这不仅是一场外交的胜利，更是一代人奋斗的见证。旅顺、大连的码头上，万人空巷，红旗飘扬。第三世界国家纷纷发来贺电，庆祝中华民族的这一历史性胜利。斯拉夫谈判官缓缓离去的背影，似乎映照着旧世界的黯然退场——这个时代，已经不再属于那些凭借炮舰恫吓世界的帝国。新中国不需要别人的保护，列强在海边架起几座大炮就能吓倒华夏儿女的时代已经一去不复返了。"
 chi.6.a:0 "孪生兄弟不再是暴徒脚下的两团烂泥。"

 chi.7.t:0 "[ROOT.GetCountry.GetName]收复香港"
 chi.7.d:1 "早在多年之前，中英两国就香港是否应该回归中国一事展开了数年的协商和谈判，在众多中外媒体镜头的见证下，撒切尔夫人的那惊天一摔，宣告了昔日那个不可一世的日不落帝国早已无力再束缚东方的巨龙，哪怕只是九牛一毛，海角一隅。"
 chi.7.f:1 "英国愿意归还香港等地，让所有部队撤出香港。在举世瞩目下，英国国旗缓缓降下，五星红旗和紫荆花旗冉冉升起。海风轻拂，维多利亚港畔的市民们热泪盈眶，欢呼声此起彼伏。紫荆花盛开在太平山道，这一刻，中国的版图终于又补上了失去的一块，历史的公正终得实现。"
 chi.7.a:0 "凤阙阶前守夜的黄豹赶走了狞恶的海狮！"

 chi.8.t:0 "[ROOT.GetCountry.GetName]收复澳门"
 chi.8.d:1 "澳门，这座自明朝以来被葡萄牙租占的海港，曾是倭寇、海盗与殖民者的温床。弗朗机与万恶的封建地主达成协议，将这片土地运营成了法外之地。来往的海盗和倭寇正是在这里进行贸易和补给，葡萄牙人的每一块白银，背后都沾染了铁炮和倭刀上沿海军民的血迹。"
 chi.8.f:1 "澳门的回归并未引发太多震动，葡萄牙早已失去了昔日的荣光。今天，面对中华民族不可阻挡的崛起，衰败的帝国终于放下了手中的那张残破契约。葡萄牙代表低头在协议上签字，曾经的殖民者早已没有了大航海时代的骄傲。在佝偻的身姿前，五千年前就已经屹立在世界舞台上的那个庞大国家机器，正满面春风，焕发新颜。"
 chi.8.a:0 "请叫儿的乳名，叫我一声澳门！"

 chi.9.t:0 "[ROOT.GetCountry.GetName]收复台湾"
 chi.9.d:1 "自从原国民党政权溃逃台湾，数十年来，台湾被海峡所隔，成为中华大地未能收回的孤岛，人民似乎已经适应了台湾海峡这片中国的内海被外国舰队封锁的日常。然而今日，所有报纸的头版都刊登着同样的画面——台北升起的五星红旗，宣告了中华民族的伟大统一。"
 chi.9.f:1 "漫长的分裂时代终于画上句号，历史的尘埃随风散去。此刻，站在祖坟前的老兵泪流满面，他已等了大半生，终于等到了这一日。离岸的游子再也不是西方大国手中遏制母亲的锁链，它是那样安全地依偎在东方雄鸡的怀里。"
 chi.9.a:0 "王师北定中原日，家祭勿忘告乃翁！"

 chi.10.t:0 "百废待兴，确立中央！"
 chi.10.e:1 "硝烟散去，战火泯灭。国民党反动派的残余势力已被扫荡殆尽，人民终于迎来了胜利的曙光。我们是时候正式接管作为中国唯一合法政府的地位了。尽管还有许多工作亟需完成，但前路已然开朗。"
 chi.10.f:1 "中国革命胜利在即，关于新中国的定都问题，也成为了伟大领袖毛泽东和[ROOT.GetCountry.GetName]中央一直在慎重考虑的议题。北平、南京、武汉，哪一座城市将成为新时代的政治中心？这将是一个载入史册的决定。"
 chi.10.a:0 "定都北平！"
 chi.10.b:0 "定都南京！"
 chi.10.c:0 "定都武汉！" 

  fra.1.t: "自由、平等、博爱"
  fra.1.d: "[ROOT.GetCountry.GetName]政府举行了盛大的仪式，向为自由法国事业英勇献身的少数族裔与法国黑人致以最高的敬意，并正式宣布，他们如今与所有法兰西公民享有同等权利。"
  fra.1.f: "一百多年前，阿尔萨斯洛林地区的德意志人献身于大革命事业之中，自此，阿尔萨斯洛林人便是我们亲密无间的同胞。那么，那些在枪林弹雨中捍卫自由法国的少数族裔与黑人战士，又怎能被排除在法兰西大家庭之外？法兰西共和国的基石在于反抗压迫，我们绝不会沦为曾经的暴君！"
  fra.1.a: "我是新法兰西人，法国公民，自由法国的公民！"

 rus.3.t:0 "改革成功"
 rus.3.d:1 "在对农业、手工业、资本主义工商业及劳动者权益进行深远的社会主义改革后，[ROOT.GetCountry.GetName]的经济体系已全面转型，社会主义制度正式确立。这标志着国家进入了新的历史阶段——社会主义初级阶段！"
 rus.3.f:1 "然而，社会主义的建设远未完成，我们必须继续前进！"
 rus.3.a:0 "实行一党制！"
 rus.3.b:0 "推广无神论！"	

 rus.4.t:0 "苏维埃社会主义共和国联盟解体"
 rus.4.d:1 "今日，我为我们的人民感到痛心，他们已不再是那个伟大国家的公民。分崩离析的红色帝国让每个人的未来蒙上阴影，混乱与不确定性席卷整个国度。"
 rus.4.f:1 "秃鹰开始盘旋，红旗在风中颤抖，曾经横跨欧亚的庞然巨兽即将化作历史尘埃。"
 rus.4.a:0 "永别了……"

  saf.1.t: "[ROOT.GetCountry.GetName]公民"
  saf.1.d: "[ROOT.GetCountry.GetName]政府举行了盛大的仪式，政府举行了隆重的仪式，向南非黑人与科伊桑人为国家做出的巨大贡献表示敬意，并正式宣布他们现享有与[ROOT.GetCountry.GetName]公民同等的权利。"
  saf.1.f: "来自欧洲的白人移民是我们亲密无间的同胞，如今，那些共同为国家奋斗的南非黑人与科伊桑人又怎能被拒之门外？我们的共和国诞生于反抗殖民暴政，我们绝不能成为非洲新的压迫者！"
  saf.1.a: "我是南非黑人与土著科伊桑人，[ROOT.GetCountry.GetName]公民，自由国度的公民！"

  saf.2.t: "南非的燃烧年代"
  saf.2.d: "南非黑人与科伊桑人宣布拿起武器，向政府发起全面斗争，他们的要求再无妥协余地——驱逐政府内的所有白人，一个不留。国家的统治正遭受前所未有的挑战。"
  saf.2.f: "战火在南非蔓延，城市与乡村燃起熊熊烈焰，这片土地正经历一场决定命运的斗争。南非黑人与科伊桑人决意不惜一切代价夺回他们认为属于自己的自由的未来。"
  saf.2.a: "我们寡不敌众，只能投降！"

  sel.1.t: "[ROOT.GetCountry.GetName]公民"
  sel.1.d: "[ROOT.GetCountry.GetName]政府举行了盛大的仪式，纪念马来人和泰米尔人为[ROOT.GetCountry.GetName]做出的巨大贡献，并正式宣布马来人和泰米尔人现在享有与[ROOT.GetCountry.GetName]公民相同的权利。"
  sel.1.f: "来自中华大地的移民早已成为我们亲密的同胞，而那些同样为[ROOT.GetCountry.GetName]付出血汗的马来人与泰米尔人，又怎能被视为外人？我们的国家诞生于反抗殖民压迫，我们绝不能成为亚洲新的暴君！"
  sel.1.a: "我是马来人和泰米尔人，[ROOT.GetCountry.GetName]公民，自由国度的公民！"

 rus.5.t:0 "土库曼斯坦独立"
 rus.5.d:1 "伴随着全场代表们狂风暴雨般的掌声和庄严的歌声，土库曼斯坦德高望重的领袖萨帕尔穆拉特·尼亚佐夫缓缓地走向讲台，他的步伐坚定，目光炯炯，掌声随之愈发热烈，最终化作经久不息的欢呼。“同志们！我们感谢所有友好地派遣代表来参加我们会议的国家以及党内的同志们！感谢他们的友好祝贺、感谢他们对我们成功的信任！我特别珍视这种信任，这种信任表示他们愿意支持我们党，为各国人民未来拥有一个光辉灿烂的前途而斗争，为反对战争而斗争，为维护和平而斗争。独立并非终点，而是新的起点，我们必须团结一致，共同迎接挑战。外国兄弟们的信任，同情与支持仍然是我们重要的支撑，过去如此，未来亦然！”"
 rus.5.f:1 "在全场的掌声与欢呼中，尼亚佐夫结束了他的演讲，颤颤巍巍的走下了讲台。今后，尼亚佐夫将担任新独立的土库曼斯坦的总统。"
 rus.5.a:0 "巴什的恩情还不完！"	

 bel.1.t:0 "比利时王位继承"
 bel.1.d:1 "伴随着全场代表们狂风暴雨般的掌声和庄严的比利时国歌，比利时王子博杜安步入会场，迎接属于他的历史性时刻。掌声雷动，人群的欢呼汇聚成滚滚声浪，见证着新君临国。博杜安微笑着向国民致意，他的声音沉稳而充满信念：“公民们！感谢所有友邦的祝贺，也感谢你们的信任。比利时将继续前行，为和平与繁荣而奋斗。我们的王国建立在信任与团结之上，无论过去还是未来，这将始终是我们最宝贵的财富！”"
 bel.1.f:1 "在全场的掌声与欢呼中，博杜安结束了他的演讲，走下了讲台。今后，博杜安将成为比利时王国萨克森-科堡-哥达王朝的第五位国王。"
 bel.1.a:0 "博杜安一世的恩情还不完！"	

 spa.3.t:0 "午睡与经济危机"
 spa.3.d:1 "在马德里的政府大楼内，佛朗哥与最器重的技术官僚们围坐在会议桌前，展开了一场激烈的争论。议题并非军事或外交，而是西班牙人引以为傲的传统——午睡。他们讨论了午睡与西班牙持续的经济低迷之间的联系，顾问们坚定地认为，若能减少午睡时间，将显著提高工厂生产率，缓解经济疲软。"
 spa.3.f:1 "佛朗哥的回应则极为愤怒，他不肯认输，坚持认为与文化差异相比，午睡带来的影响可以忽略不计。争论又一次以僵局告终。"
 spa.3.a:0 "佛大帅辛苦了一辈子，想多睡会怎么了？！"

 spa.4.t:0 "时代的落幕" #佛朗哥去世
 spa.4.d:1 "送葬队伍缓缓前行，炮车在大道上颠簸，沉重地碾压着西班牙的历史篇章。军队列队肃立，首都的市民代表静默随行，他们的脚步同样沉重。"
 spa.4.f:1 "马德里的天空阴沉得仿佛要压垮大地，钟声沉闷地在城市上空回荡。身披黑纱的哀悼者静默伫立，目送覆盖着西班牙国旗的灵柩在炮车的颠簸中缓缓前行。街道两旁，身着戎装的士兵肃立不动，佩戴黑色袖章的官员低声交谈，而远处的人群中，或是啜泣，或是默然无语。在西班牙战火纷飞的年代，这位统治者曾以铁腕重塑国家，如今，他沉默地躺在棺椁中，随着送葬队伍驶向埋葬昔日帝王的陵墓。神职人员诵念着安魂祷文，肃穆的弥撒在教堂中回响，然而在这沉重的悲悼背后，某些目光已经投向未来——属于他的时代，已经成为历史的一部分。在送葬队伍抵达墓园之时，胡安·卡洛斯王子缓步上前，面对肃立的军队与哀悼的人群，他的目光投向棺椁，神情凝重。"
 spa.4.a:0 "如今，他已长眠于大地，西班牙的未来，则交托于我们。"

 spa.5.t:0 "再见了，考迪罗"
 spa.5.d:1 "一位复杂到令人看不清的军人魂归天际！"
 spa.5.f:1 "卡洛斯的目光转向远处，仿佛穿越时间的迷雾，看到了那场内战的硝烟与废墟，看到了佛朗哥在战后废墟上重建的工厂、铁路与教堂。“他并非没有瑕疵，”他继续说道，“岁月会评判他的功过，但无人能否认，他将一生献给了这片土地的存续。他的离去，是一个时代的终结，也是对我们所有人的试炼。”"
 spa.5.a:0 "在佛朗哥的灵柩前，卡洛斯肃立良久。他未曾落泪，因为王者的尊严不允许软弱，但他心中的波澜却如比利牛斯山脉的寒风般呼啸。“"

 por.1.t:0 "游行队伍" #萨拉查去世
 por.1.d:1 "特茹河上的迷雾还未散尽，国家广播电台的电流声划破清晨：“安东尼奥·德·奥利维拉·萨拉查博士，葡萄牙的守护者，已于今日凌晨三时四十七分回归主的怀抱。”消息如一枚哑火的炮弹，在里斯本街头炸开无声的震荡。电车停摆，穿卡其制服的秘密警察背靠墙壁抽烟，烟灰落进绣着“PIDE”字样的袖口褶皱里。四十年的铁腕、殖民帝国的残梦、蓝衫军游行的口号，随着总统府阳台上那面孤悬的国旗一同垂落。"
 por.1.f:1 "后排议员听见玻璃穹顶外传来学生的口号，又迅速被宪兵的马靴声碾碎。"
 por.1.a:0 "内阁会议厅内，卡埃塔诺凝视着萨拉查空置的橡木椅，钢笔尖在悼词草案上洇出墨渍：“他是一座花岗岩丰碑——我们曾躲在这座丰碑的阴影下避雨，却忘了雨水终会渗透石缝。”"

 por.2.t:0 "再见了，考迪罗"
 por.2.d:1 "数十年的威权统治、殖民帝国的残影、蓝衫军的铁律，此刻皆随一具枯槁的躯体被钉入历史。"
 por.2.f:1 "灵柩途经罗西乌广场时，一名老妇将康乃馨抛向覆盖国旗的棺木，花瓣被骑兵卫队的马蹄踏进石板缝隙。卡埃塔诺在当夜日记中写道：“他锁住了时间，现在我们要么继承锈蚀的钥匙，要么熔铸新的。”非洲殖民地的电报仍在涌入军部，但总督们的效忠誓言里已混入了枪声、罢工倒计时和巴黎流亡者电台的摩尔斯电码——时代的裂痕，正从里斯本大学的砖墙蔓延至安哥拉的咖啡种植园。"
 por.2.a:0 "地下印刷的传单上，有人用油墨拓下萨拉查墓碑的轮廓，空白处潦草写着：“现在轮到历史审判我们了。"

 por.3.t:0 "葡萄牙权力交接"
 por.3.d:1 "1968年9月，葡萄牙总理萨拉查因中风而无法处理国政，将权力移交给其心腹马尔塞洛·达斯内维斯·阿尔维斯·卡埃塔诺。"
 por.3.f:1 "萨拉查的橡木办公桌抽屉里，卡埃塔诺翻出一份未拆封的《殖民地自治白皮书》（1961年草案），封面结着干涸的咖啡渍。当他试图转动地球仪，锈住的转轴发出类似罗安达街头装甲车履带的摩擦声。褪色的非洲地图上，红色铅笔圈出的“安哥拉钻石矿区”异常醒目。里斯本大学送来的罢课声明正静静躺在镀金拆信刀下。"
 por.3.a:0 "威权统治还要延续吗？"	

 rus.6.t:0 "钢铁之魂"
 rus.6.d:1 "我们的祖国曾以钢铁铸就未来，矗立在高耸烟囱与熊熊炉火之间的，是那些象征人民与革命的雕像。它们或高举火炬，或手握书籍，或肩扛钢枪，代表着一个时代的精神。"
 rus.6.f:1 "然而，时间的车轮滚滚向前，新时代的潮流是否会抹去这些金属巨人？锈迹斑斑的雕像终将让位于崭新的象征，钢铁为骨煤炭作血的时代是否已然远去？人们是否还会记得，那些曾经屹立于共和国心脏的雕塑，诉说着一个信仰的时代？"
 rus.6.a:0 "忘记过去就意味着背叛！"	

 rus.7.t:0 "为祖国服役！"
 rus.7.d:1 "为苏维埃服役，是每一位战士的使命。"
 rus.7.f:1 "在极北的寒风之中，在极昼不息的烈焰下，在这座不冻港的冰冷码头，在这长明火的光芒里，我的身后是我的祖国，苏维埃祖国，我就在这里，在这风雪的世界里，为祖国服役，保卫祖国的明天。"
 rus.7.a:0 "祖国牢不可破！"	

 chi.12.t:0 "党国权力交接"
 chi.12.d:1 "1975年4月蒋介石病故后，蒋经国已经被推选为中国国民党中央委员会主席兼中央常务委员会主席。1978年5月，蒋经国被选为国民政府第六届总统。"
 chi.12.f:1 "台北的雨雾中，这位新领袖的身影显得既熟悉又陌生——他曾是“经济奇迹”的幕后推手，亦是“白色恐怖”铁幕下的冷酷执行者。岛内，反对派如暗火般滋长，民众的不满在高压下积聚成雷霆；岛外，共产中国的阴影如巨兽般盘踞海峡对岸，而国际间的孤立态势则让这弹丸之地如履薄冰。早在担任台湾省政府主席与国防部长期间，他便以高压手段肃清异己，以暴力镇压异议，以恐惧维系统治。就职演说中“国家不可一日无主”的低语，不是治国者的承诺，而是独裁者的警告。"
 chi.12.a:0 "这是光荣的传承吗…？"	

 chi.13.t:0 "国民党败退台湾" #
 chi.13.d:1 "十六岁的毛孝伏攥着油瓶子，海风裹着咸腥的气味掠过他的额发。竹篮里的酱油瓶晃出细碎光斑，母亲咳血已三个月之久，昨夜大夫说需用绍兴老酒调药，否则怕是熬不过春寒。酱缸前他踮起脚从酱缸沿儿刮了最后一层酱渣，用草纸裹了又裹。"
 chi.13.f:1 "突然间码头哨兵的卡宾枪铜管抵住后腰，他闻见海风捎来的鱼腥味还混着灶膛柴火的气息。荷枪实弹的哨兵突然从阴影中窜出，粗嗓门吼着"上船"，十六岁的少年被粗鲁地拽进船舱，铁皮撞击的闷响里，他数着被海水浸透的蓝布衫褶皱——那是母亲用旧蓝布衫改的校服，补丁缝了十七个。船舷摇晃的刹那，他恍惚看见自家屋檐垂下的冰棱正在融化，老槐树新抽的芽尖上还凝着晨露。铁皮舱房里霉味混着柴油味，老兵们攥着褪色家书教后生辨认字迹，唯独他对着墙角那堆空酱油瓶发怔，说能闻见瓶口沾着的岱山海盐味，就像母亲用绍兴老酒调药时满屋弥散的味道。某个台风夜，信箱里飘来半页从美国转来的家书，墨迹被雨水泡得发胀的字句里，母亲坟头的老槐树正在抽芽。他恍惚间听见呼啸的寒风混着母亲咳血的声响。“你回来了”，母亲放下手里的针线用手搓着他冻红的脸。"
 chi.13.a:0 "柴门闻犬吠，风雪夜归人。"

 pak.1.t: "[ROOT.GetCountry.GetName]公民"
 pak.1.d: "[ROOT.GetCountry.GetName]政府举行了盛大的仪式，纪念孟加拉人为[ROOT.GetCountry.GetName]做出的巨大牺牲，并正式宣布孟加拉人现在享有与[ROOT.GetCountry.GetName]公民相同的权利。"
 pak.1.f: "克什米尔人、信德人、俾路支人和普什图人是我们亲密无间的同胞，那么，那些随[ROOT.GetCountry.GetName]而奋斗的孟加拉人，他们为何不能成为我国的公民？我们的国度立足于反抗英国暴君的统治，我们绝不能成为亚洲的暴君！"
 pak.1.a: "我是孟加拉人，[ROOT.GetCountry.GetName]公民，自由国度的公民！"

 pak.2.t: "孟加拉国独立战争"
 pak.2.d: "孟加拉人宣布对政府发动武装斗争，要求把东巴基斯坦的巴基斯坦人全部驱逐出去，一个不留，印度也出动军队介入。我们的统治正面临着空前的挑战。"
 pak.2.f: "孟加拉人的武装斗争在东巴基斯坦展开，巴基斯坦这片土地上的统治正面临着空前的挑战。孟加拉人的战斗意志是坚定的。这一次，他们愿意为自己的自由而战。"
 pak.2.a: "我们寡不敌众，只能投降！"

 chi.14.t:0 "人民解放军占领南京" #
 chi.14.d:1 "江风掠过芦苇荡时，最后一箱弹药刚搬上木船。在总攻前的寂静里，能听见浪花啃噬堤岸的声响。粟裕将军的大衣下摆在风中翻卷，他忽然想起赣南的竹林——二十年前举着火把夜行的年轻人，此刻正把红旗插在刺刀尖上。信号弹升空的刹那，上千条木桨同时劈入江水，浪沫溅在战士们的绑腿上，转眼凝成薄霜。"
 chi.14.f:1 "浦口码头的木桩在炮火中燃烧，像一排流泪的红烛。弹雨打穿船板的声音，混着北方口音的呐喊，把六朝金粉地的春夜撕开一道裂口。总统府门楼那面青天白日旗坠落时，正巧盖住了台阶上半块摔碎的青瓷。长江仍在奔流。货郎摇着拨浪鼓走过中华门，担子里的桂花糕还温热；茶馆说书人醒木一拍，惊飞檐下新筑巢的燕子。历史在这里打了个结，又匆匆向下游淌去。挎着盒子炮的战士靠在城墙根打盹，绑腿缝隙里钻出几茎倔强的野草，在四月的风里轻轻摇晃。"
 chi.14.a:0 "钟山风雨起苍黄，百万雄师过大江。"

 gbr.1.t: "伦敦烟雾"
 gbr.1.d: "近日，伦敦上空受反气旋影响，大量工厂生产和居民燃煤取暖排出的废气难以扩散，积聚在城市上空。"
 gbr.1.f: "伦敦被有浓厚的烟雾笼罩，交通瘫痪，行人小心翼翼地摸索前进。市民不仅生活被打乱，健康也受到严重侵害。许多市民出现胸闷、窒息等不适感，发病率和死亡率急剧增加。就连前泰坦尼克号二副、英国海军“加里”号驱逐舰舰长莱托勒都因此在家中病逝。讽刺的是，就在第二天，一阵西风吹散了笼罩在伦敦的烟雾。据统计，当月因这场大烟雾而死的人多达4000人。此次事件被称为“伦敦烟雾事件”，成为20世纪十大环境公害事件之一。"
 gbr.1.a: "这已经不是一般的烟雾了，必须要出重拳！"

 ger.1.t: "建立联邦德国"
 ger.1.d: "1949年，在战后的断壁残垣之上，西德意志占领当局召集代表齐聚波恩，他们面对一个将决定德意志未来命运的抉择——是否合并西部占领区，以建立一个独立的、与西方世界接轨的德意志国家。冷战的铁幕已经落下，苏维埃社会主义共和国联盟的影响力正迅速笼罩欧洲东部，而西方世界不愿让整个德国落入共产主义的掌控之中。在漫长的谈判和政治角力之后，一个新的主权国家轮廓逐渐浮现。它将拥有民主宪政，受市场经济引导，并成为西方阵营在欧洲大陆的桥头堡。然而，这一选择也意味着德意志的进一步分裂，东西两部分的裂痕将成为新秩序下不可调和的现实。"
 ger.1.f: "“德意志将再次成为欧洲的荣光。”"
 ger.1.a: "这是迈向统一与繁荣的第一步，德意志的经济奇迹将由此开启。" #同意
 ger.1.b: "这只是另一种形式的占领罢了，我并不觉得这是个明智的选择" #不独立

 ger.2.t: "建立民主德国"
 ger.2.d: "1949年10月，在莫斯科的支持下，东柏林的领导人们召开会议，决定正式成立德意志民主共和国，一个在苏维埃模式下运作的社会主义国家。苏占领当局强调，这将是一个‘反法西斯民主’的新德国，一个由工人阶级掌握权力、彻底摒弃资本主义剥削的国家。然而，这并非没有争议。德意志的统一已然破碎，两德分立成为既定事实。在红色旗帜的阴影下，一个新的国家被正在浮现。"
 ger.2.f: "“德意志将再次成为欧洲的荣光！”"
 ger.2.a: "人民民主将确保德国不再重蹈覆辙，社会主义是未来的方向！" #同意
 ger.2.b: "这里是占领区，你们有没有一点战败国的自觉？" #不独立

 ind.1.t:0 "[ROOT.GetCountry.GetName]八月革命胜利"
 ind.1.d:1 "在美国压力下，尼德兰与[ROOT.GetCountry.GetName]双方在海牙签订“圆桌会议协定”。协定规定[ROOT.GetCountry.GetName]与印度尼西亚领土上由荷兰殖民者所建立的15个傀儡政权组成“印尼联邦共和国”，而后者再与尼德兰、荷属苏里南和库拉索共同组成以尼德兰女王为联邦元首的荷印（尼）联邦。协定虽规定除西伊里安外，尼德兰应将主权移交给“印尼联邦共和国”，但保留了军事、外交、经济方面的许多特权。"
 ind.1.f:1 "最终，尼德兰移交主权，印尼联邦共和国选举苏加诺为总统，哈达出任联邦政府总理。虽然[ROOT.GetCountry.GetName]八月革命以双方的妥协而告终，但是印度尼西亚人民持续了几个世纪的反殖民主义斗争取得了最终的胜利！"
 ind.1.a:0 "伟大胜利！"

 Korea_War_event.1.t: "武力统一朝鲜最终决定"
 Korea_War_event.1.d: "人民民主将确保朝鲜半岛不再重蹈覆辙，社会主义是朝鲜半岛未来的方向！"
 Korea_War_event.1.f: "三十八度线，一道冷漠的铅笔划痕，却割裂了一个古老的民族。殖民统治的伤疤尚未愈合，新的铁幕便已降临。#v $USA$#!与#v $苏维埃社会主义共和国联盟$#!的意志在这片土地上交错，如同两只无形之手，操纵着曾经血脉相连的同胞。北方与南方的兄弟在敌对的战壕中遥望，母亲在分界线两端呼喊，然而没有人能逾越这道人为的裂痕。\n\n但历史不会永远被锁死在冷战的铁幕之下。#v $朝鲜$#!的英雄儿女终将突破分裂的枷锁，超越派系与外部势力的干预，在奋斗与牺牲中迎来民族的团圆。无穷花将在统一的土地上重新绽放，祖国母亲不会再承受新的伤痛——对吗？"
 Korea_War_event.1.a: "南下，统一祖国！" #同意
 Korea_War_event.1.b: "拒绝发动战争" #不打仗
 dp_war_of_korea: "统一朝鲜" 

 bic.1.t:0 "领导权问题" #
 bic.1.d:1 "我们国家被征服的篇章已经翻过"
 bic.1.f:1 "新的自主篇章开启了。"
 bic.1.a:0 "尼赫鲁是当然的选择"
 bic.2.b:0 "付出甚多的男人，甘地"

 chi.15.t:0 "反右派斗争" #
 chi.15.d:1 "1957年，在整风运动中，极少数资产阶级右派分子乘机鼓吹所谓“大鸣”、“大放”、“大民主”，向党和社会主义制度发动进攻。"
 chi.15.f:1 "为了坚持党对社会主义事业的领导，巩固新生的社会主义制度，党领导群众进行了反右派斗争。中共中央发出关于组织力量准备反击右派分子进攻的内部指示。同日，《人民日报》发表题为《这是为什么？》的社论。此后，全国陆续开展了大规模的反右派斗争。"
 chi.15.a:0 "一切权力归于党和人民！"

 chi.16.t:0 "“长波电台”风波" #
 chi.16.d:1 "1958年，苏维埃社会主义共和国联盟第一艘核动力潜艇试航成功，实现了远洋航行。外出潜艇与基地的通讯和联络问题便提上了议事日程。"
 chi.16.f:1 "苏维埃社会主义共和国联盟海军建议，在中国的海南岛建一个长波发射台。恰在此时，中方也提出了同样的要求。根据《肖劲光回忆录(续集)》，随着潜艇部队的发展，迫切需要大功率的长波电台。海军便与苏维埃社会主义共和国联盟有关方面联系，希望获得帮助。同年，苏维埃社会主义共和国联盟国防部长马利诺夫斯基致函中国国防部部长彭德怀，建议从1958年至1962年在中国华南地区，由中苏共同建设1000千瓦大功率长波发射电台和远程接收中心各一座，投资1.1亿卢布，苏维埃社会主义共和国联盟出7000万，中国出4000万，建成后中苏两国共同使用。"
 chi.16.a:0 "同意，并且允许建设共同舰队"
 chi.16.b:0 "坚决拒绝！"

 chi.17.t:0 "苏维埃社会主义共和国联盟要求提前清偿债务" #
 chi.17.d:1 "苏维埃社会主义共和国联盟政府要求我方提前偿还全部对苏债务。"
 chi.17.f:1 "是否同意提前清偿贷款？"
 chi.17.a:0 "同意提前偿还贷款"
 chi.17.b:0 "拒绝提前偿还要求"

 chi.18.t:0 "苏维埃社会主义共和国联盟撤资原子弹" #
 chi.18.d:0 "苏维埃社会主义共和国联盟终止原子弹技术合作，撤离全部在华专家顾问。"
 chi.18.f:1 "苏维埃社会主义共和国联盟单方面终止对我国的原子弹技术援助，并撤走全部在华专家顾问，同时停止对华的原子弹投资。"
 chi.18.a:0 "接受现实，独立自主。"

 chi.19.t:0 "苏维埃社会主义共和国联盟撤走军事顾问" #
 chi.19.d:0 "苏维埃社会主义共和国联盟终止陆军技术合作，撤离全部在华军事顾问及撤资在华的军工企业。"
 chi.19.f:1 "苏维埃社会主义共和国联盟单方面终止对我国的陆军技术援助，并撤走全部在华军事顾问，同时停止对华的军事投资，撤离相关企业。"
 chi.19.a:0 "接受现实，独立自主。"

 chi.20.t:0 "苏维埃社会主义共和国联盟撤资在华企业" #
 chi.20.d:0 "苏维埃社会主义共和国联盟终止商业合作，撤资在华的企业。"
 chi.20.f:1 "苏维埃社会主义共和国联盟单方面终止对我国的经济援助，同时停止对华的商业投资，撤离相关企业。"
 chi.20.a:0 "接受现实，独立自主。"

 kmt.1.t:0 "赤色威胁的消散？"
 kmt.1.d:0 "随着最后一支赤匪武装放下武器，血腥的剿匪戡乱终于宣告结束，虽然可以预见的是赤匪成建制的抵抗不太可能再次出现，但是彻底荡平赤匪仍任重道远。故而《动员戡乱》依然有必要继续实施贯彻下去，直到最后一个赤匪被我送上绞刑架。"
 kmt.1.f:0 "若非从速戡平叛乱，则不仅宪政与民主无由实现，即国家之统一与安全亦已失其保障。故政府决心戡乱，实出于万不得已。必须全国军民集中意志，动员全国力量，一面加紧戡乱，一面积极建设，方能扫除民主宪政之障碍，达成和平建国之目的。"
 kmt.1.a:0 "必要之恶"

 kmt.2.t:0 "首届政党轮替"
 kmt.2.d:0 "今天，随着最后一张来自全国三十五省的一亿一千八百万张选票的清点结束，中国千年文明史上首次真正意义上的全民普选宣告结束。尽管计票过程困难重重，任务繁重，但最终大选结果并不令人意外，长期领导民间民主运动，数次受伤和被捕的，***博士，现如今依法当尊称为*大总统，及其创建组织的中华联邦党不出意料的赢得了大选 \n当大总统手抚宪法宣誓就任中华民国第七任大总统时，饱受两千年专制荼毒的中华大地完成了首届政党轮替。愿自由普照，天下为公！"
 kmt.2.f:0 "对于自由和平等的渴望贯彻了人类历史乃至文明本身，也正因如此我们从始至终坚信人人生而平等的，都享有与生俱来的不可剥夺的权力。历经千年专制的满满长夜，从陈胜吴广起义到黄花岗七十二烈士的牺牲，再到紫金山学运的殉难，无数先辈的眼泪与鲜血终使民国取代了帝国，公民取代了子民，自由主义战胜了共产主义。今天我们所点燃的这束万事不灭的火炬，不仅将驱散我国千年专制的阴云，更将照亮通向以自由，平等，博爱与美德作为基石的大同之梦的道路。"
 kmt.2.a:0 "自由，平等，博爱！\n民族，民权，民生！"

 kmt.3.t:0 "破碎的国民经济"
 kmt.3.d:0 "纵使我们已经战胜了朵毛赤匪，民国的经济目前似乎已经积重难返，1948年九月，中华民国的法定货币，法币，与美元汇率已经跌至8,683,000:1，较1946年六月贬值了3,258倍。国势艰难如此，但政府仍旧贪墨横行，上下离心，民间官商勾结，鱼肉百姓，国库黄金储备几乎告罄，金融体系摇摇欲坠。针对于此，政府业已派遣蒋经国为专员前往上海打虎，愿他能不负众望，为奄奄一息的民国经济创造出一线生机"
 kmt.3.f:0 "一、自即日起以金圆为本位币，十是准备发行金圆券，限期收党已发行之法币及东北流通券。 \n二、限期收觉人民所有黄金自银银币及外国币券，逾期任何人不得持有。\n三、限期登记管理本国人民存放国外之外汇资产，违者予以制裁。\n四、整理财政并加强管制经济，以稳定物价平衡国家总预算及国际收支。"
 kmt.3.a:0 "道阻且长"

 kmt.4.t:0 "响彻世界的一枪"
 kmt.4.d:0 "1978年3月20日，前往上海参加《中苏和解备忘录》的总统在与火车站迎接群众互动式遭到了潜藏在人群中的刺客的暗杀，刺客使用苏制便携手枪向总统连开三枪，其中一枪命中颈部动脉。尽管总统医疗团队竭尽全力，总统仍在当日下午5点20分于上海联邦医院不幸辞世。而刺客则使用藏于其口中的氰化物胶囊在被捕前一刻自杀身亡\n尽管相关调查仍在进行中，但种种迹象包括手枪制式和其用俄语书写的笔记都将幕后主使指向苏联。\n这响彻世界的一枪将原本有望和解的中苏关系再次带到了几乎战争边缘，国内文官政府和军队之间的本就极度紧张的关系也出现了致命的裂痕"
 kmt.4.f:0 "思余自受教以来，即束身自爱，虽寡过之未获，从未结怨于私人。清政不良，起任改革，亦重人道、守公理，不敢有毫权之见存。今国基未固，民福不增，遽尔撒手，死有余恨"
 kmt.4.a:0 "脆弱的民主制度能否经受住即将到来的浩劫？"

 kmt.5.t:0 "上海打虎？一场闹剧！"
 kmt.5.d:0 "蒋经国专员在上海开展的旨在拯救濒临崩溃的国民经济的打虎行动，尽管有其总统父亲的全力支持，仍未能在内战结束后的宝贵的的窗口期内达成改革目标。更糟糕的是蒋公子的打虎行动在得罪各路显贵收效显著，在上海地方势力和国民政府内部根深蒂固的腐败网络的联合施压下，蒋经国专员已被召回南京述职。上海打虎运动至此曲终人散"
 kmt.5.f:0 "监察院内政地政委员会、财政粮政委员会、交通委员会联席会议决议：各地拒用金圆券，效用已失，财部迄无对策，应予经照"
 kmt.5.a:0 "那么谁来拯救苦苦挣扎在死亡线上的四万万同胞呢？"

 kmt.6.t:0 "新生的黎明"
 kmt.6.d:0 "蒋经国专员在上海开展的旨在拯救濒临崩溃的国民经济的打虎行动，在其总统父亲的全力支持下，所有目标业已达成，收效显著。蒋经国专员已被召回南京，参与并主持下一阶段的经济重建工作。"
 kmt.6.f:0 "本轮经济建设计划中，政府将扮演核心角色，年度预算的大笔的资金将用手重点建设民用轻工业，尽可能补全民用工业的产业链缺陷，实现初级工业产品的自给自足。\n全面的工业化需要大量的熟练技工，而目前我国如此低下的识字率显然无法满足如此要求，因此政府在本阶段将在全国推行义务扫盲班运动，深入城市与乡村提供免费识字教育。至于全面重整教育体制，如何培养高级人才向更高级产业结构转型，这一重任便交给下一阶段吧"
 kmt.6.a:0 "再造黄金十年的经济奇迹"

 kmt.7.t:0 "历史的重担"
 kmt.7.d:0 "尽管战争的硝烟并未完全散去，一所所小学，中学，大学的建设就已经付诸实施。在废墟之上，我们建起的不仅仅是一栋栋教学楼，实验室，体育馆，更是中华民族未来的希望"
 kmt.7.f:0 "我们在一代人的时间内经历了辛丑国耻，辛亥革命，两次世界大战以及效不胜效的惨绝人寰的内战，我们这一代人虽遍体鱗伤但仍为了这片苦难深重的土地扛起了十字架。但我们这一代人终将逝去，历史的重担终将传给我们同样饱受战争摧残的孩子们。贫穷与无知使民族卑贱，因为我们希望我们的孩子们可以通过教育，有尊严地自由地不受威胁地度过他们的一生，去建设一个我们基全來敢没想的富强的国象，去实现那国父所梦想的天下为公的社会"
 kmt.7.a:0 "知识就是力量，教育就是希望"












