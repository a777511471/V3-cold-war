 xinanjiaofei.1.t: "剿匪顺利进行"
 xinanjiaofei.1.d: "我们的努力卓有成效，国民党残部的实力已被大大削弱了，剿匪任务想必近日就能完成。"
 xinanjiaofei.1.f: "剿匪顺利进行"
 xinanjiaofei.1.a: "太棒了！"

 xinanjiaofei.2.t: "剿匪不顺"
 xinanjiaofei.2.d: "敌人比我们想象的更顽强，更凶悍，宣布胜利为时尚早。如果在该地区加强投入，剿匪工作的进展应该会更顺利"
 xinanjiaofei.2.f: "剿匪不顺"
 xinanjiaofei.2.a: "没有这个必要"
 xinanjiaofei.2.b: "特批一部分资金用于剿匪"
 
 xinanjiaofei.3.t: "西南匪患猖獗"
 xinanjiaofei.3.d: "西南匪患仍然猖獗，我军现有资源难以应付，剿匪工作举步维艰，各级官兵亟待中央新的指示。"
 xinanjiaofei.3.f: "西南匪患猖獗"
 xinanjiaofei.3.a: "我们管不了那么多"
 xinanjiaofei.3.b: "增强在当地的军事存在，务必将匪徒彻底扫清"
 
 waijiaozhengce.1.t: "一边倒？"
 waijiaozhengce.1.d: "一边倒，是中华人民共和国成立初期的政策，意指在国际斗争中坚定地站在以苏联为首的社会主义阵营一边，反对帝国主义和以美国为首的西方资本主义阵营"
 waijiaozhengce.1.f: "一边倒？"
 waijiaozhengce.1.a: "我们与社会主义国家之间的情谊坚不可摧"
 waijiaozhengce.1.b: "平衡的外交政策更符合国家利益"
 
 jiefangzhanzheng_breakup.1: "中国内战再次爆发"
 jiefangzhanzheng_breakup.1.d: "1946年6月26日凌晨，中原腹地宣化店方向突然爆发的炮火，撕碎了重庆谈判桌上残留的和平假象。当国民党第5军装甲集群碾过焦土时，中原军区司令员李先念的电台仍在向延安发送最后一份电文："敌军以30万重兵围剿，请求战略转移。"此刻的毛泽东正站在延安枣园窑洞的地图前，手中铅笔划过中原解放区的红色箭头，这原本是周恩来在《双十协定》谈判中力争保留的生存空间。“他们总要打，那就打吧。”毛泽东将烟蒂按在地图上，烟灰在“中原解放区”字样上烫出焦痕。"
 jiefangzhanzheng_breakup.1.f: "“决定战争胜败的是人民，而不是一两件新式武器。中国人民在美国帝国主义和中国反动派的联合进攻之下，将要受到长时间的苦难，但是这些反动派总有一天要失败，我们总有一天要胜利。一切反动派都是纸老虎！”\n——毛泽东"
 jiefangzhanzheng_breakup.1.a: "解放全中国！"

 jiefangzhanzheng_breakup.2: "中国内战再次爆发"
 jiefangzhanzheng_breakup.2.d: "随着国民党撕毁《双十协定》，调集重兵，向中原解放区发动大规模进攻，接着又将战火扩大到其他解放区，中国再一次陷入内战。"
 jiefangzhanzheng_breakup.2.f: "“我不明白，为什么大家都在谈论着“项羽被困垓下”，仿佛这中原古战场对我们决定了凶多吉少。二十年前，我从徐州踏上征途，开始了第二次北伐，中华秋海棠叶遂归于一统。那种勃勃生机、万物竞发的境界，犹在眼前。短短二十年后，这里竟至于一变而为我的葬身之地了吗？无论怎么讲，八十万对六十万，优势在我！”\n-蒋介石"
 jiefangzhanzheng_breakup.2.a: "剿灭共匪，和平建国！"

