 sandazhanyi.1: "辽沈战役"
 sandazhanyi.1.t: "辽沈战役完成"
 sandazhanyi.1.d: "辽沈战役完成"
 sandazhanyi.1.f: "1948年11月，豫东平原和往常一样时不时传来一阵阵若有若无的哒哒声，那些仓皇北顾的国军似乎这中原古战场注定了那位站在紫金山上的独裁者早已是凶多吉少。前桥村的农夫老孟推着装满子弹的木制小车，深一脚浅一脚地穿梭在泥泞的乡间小道上。他的棉袄被雨水浸透，却顾不上擦拭额头的冷汗——昨夜刚把补给送到解放军物资站，今夜又接到了新的任务：再送一车弹药到青龙集前线。老孟的家乡早已成为两军拉锯的阵地。他亲眼看着国民党军在村口修筑碉堡，又见证了解放军战士用土工作业突破防线。每逢夜幕降临，乡亲们便自发组成支前队伍，用独轮车推出一条条通往战场的生命线。老孟常说：“咱送的不是子弹是全村人的盼头。”"
