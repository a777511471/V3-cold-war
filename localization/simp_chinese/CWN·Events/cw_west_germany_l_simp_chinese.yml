l_simp_chinese:

 BRD.1.t: "六国伦敦会议"
 BRD.1.d: "随着第二次世界大战的结束，德国被分裂为四个地区，而美英法就盟军占德国的管理召开了伦敦会议。"
 BRD.1.f: "“尽管我们和苏联达成了默契，绝不成立所谓的“西德”。但是在这次会议上，与会各国还是就成立一个“在我们控制下的德国”进行了讨论。如果我们下定决心要成立一个我们控制的德国，那势必会惹恼苏联人。我们应该怎么做？”"
 BRD.1.a: "还是不要惹怒红色巨人。"
 BRD.1.b: "欧洲的铁幕已经落下！"

 DDR.1.t: "来自西方的背叛"
 DDR.1.d: "随着第二次世界大战的结束，德国被分裂为四个地区，而美英法就盟军占德国的管理召开了伦敦会议。"
 DDR.1.f: "“苏联刚才宣布切断我们与西柏林之间的交通联系，作为我们最近货币改革行动的回应。如果我们任凭苏联继续封锁的话，西柏林将不复存在，并且我们会失去一个在铁幕背后的据点。可我们要是与苏联对抗的话，说不定会进一步激怒这个红色巨人。我们该怎么办？”"
 DDR.1.a: "我们必须阻止他们!"
 DDR.1.b: "我们目前没工夫管德国问题"

 BRD.3.t: "苏联封锁"
 BRD.3.d: "伦敦会议召开后，苏联立即封锁了东西柏林的交通线。"
 BRD.3.f: "“尽管我们和苏联达成了默契，绝不成立所谓的“#v $BRD$#!”。但是在这次会议上，与会各国还是就成立一个“在我们控制下的德国”进行了讨论。如果我们下定决心要成立一个我们控制的德国，那势必会惹恼苏联人。我们应该怎么做？”"
 BRD.3.a: "我们不得不放弃西柏林。"
 BRD.3.b: "必须保住西柏林！"

 BRD.4.t: "苏联让步"
 BRD.4.d: "伦敦会议已经召开，苏联却没有任何回应。"
 BRD.4.f: "“已经过去了好几周，可我们没有收到任何来自苏联的负面消息或是敌对行为，看来苏联默认了我们的小动作，目前没有打算和我们翻脸。既然苏联选择退让，那我们可以进行下一步了。”"
 BRD.4.a: "德国的新生！"

 BRD.5.t: "联邦德国的建立"
 BRD.5.d: "盟国在柏林危机中成功保下了西柏林，并宣告成立#v $BRD$#!。"
 BRD.5.f: "“西柏林的封锁终于结束，西方最终没有丢掉这个德国曾经的心脏和中心，让自己的势力仍然挺立在铁幕深处。在柏林危机期间，英美法三国的占领区一直在进行统合尝试，并且邀请了一大批德国本土的民主人士进行新政府组建和宪法起草事宜。最终，苏联撤掉了对西柏林的封锁，这意味着西方在一段时间内不会再失去西柏林，同时也意味着出现了一个成立#v $BRD$#!良好契机。因此在今天，在波恩，我们郑重宣誓：”"
 BRD.5.a: "#v $BRD$#!成立了！"

 BRD.6.t: "鬼城"
 BRD.6.d: "盟国最终还是失去了西柏林，#v $BRD$#!成立无望。"
 BRD.6.f: "由于长期缺乏物资供应，西柏林的大多数市民，甚至是极少部分驻军都逃往了铁幕的另一边。原本还有一些生气的西柏林，在这种情况下已经完全成了一座“鬼城”。英法美已经宣布撤出在西柏林的驻军，这实际上是默认了苏联接下来吞并西柏林的举动。据小道消息称，英法美失败的原因是来自法国的阻力，法国一直反对建立一个统一的德国。在波恩，我们可以看到，原本筹划的新政府已经解散，各种统合政策已经被取消，看来四国占领的状态还将继续保持。"
 BRD.6.a: "德意志从此彻底消沉。"

 BRD_air_transport.1.t: "来自#v $USA$#!的空运"
 BRD_air_transport.1.d: "#v $USA$#!为了应对苏联对西柏林的封锁，向西德地区进行空运"
 BRD_air_transport.1.f: "在冷战的阴云之下，盟国团结一致，对抗苏联的威胁。当西柏林被苏联封锁时，#v $USA$#!决心不惜一切代价打破封锁，保障其公民的自由。#v $USA$#!的飞机从基地起飞，满载着食物、药品和燃料。这些飞机穿梭于苏联设立的危险空域，为被围困的西柏林居民提供生命线。"
 BRD_air_transport.1.a: "西德将会重见光明！。"

 BRD_air_transport.2.t: "来自#v $FRA$#!的空运"
 BRD_air_transport.2.d: "#v $FRA$#!为了应对苏联对西柏林的封锁，向西德地区进行空运"
 BRD_air_transport.2.f: "在冷战的阴云之下，盟国团结一致，对抗苏联的威胁。当西柏林被苏联封锁时，#v $FRA$#!决心不惜一切代价打破封锁，保障其公民的自由。#v $FRA$#!的飞机开始从基地起飞，满载着食物、药品和燃料。这些飞机穿梭于苏联设立的危险空域，为被围困的西柏林居民提供生命线。"
 BRD_air_transport.2.a: "西德将会重见光明！。"

 BRD_air_transport.3.t: "来自#v $GBR$#!的空运"
 BRD_air_transport.3.d: "#v $GBR$#!为了应对苏联对西柏林的封锁，向西德地区进行空运"
 BRD_air_transport.3.f: "在冷战的阴云之下，盟国团结一致，对抗苏联的威胁。当西柏林被苏联封锁时，#v $GBR$#!决心不惜一切代价打破封锁，保障其公民的自由。#v $GBR$#!的飞机开始从基地起飞，满载着食物、药品和燃料。这些飞机穿梭于苏联设立的危险空域，为被围困的西柏林居民提供生命线。"
 BRD_air_transport.3.a: "西德将会重见光明！。"

 BRD.8.t: "邀请德国民主人士"
 BRD.8.d: "盟国为了应对苏联对西柏林的封锁，特意邀请德国民主人士展开相关行动"
 BRD.8.f: "盟国急于巩固其在西部的影响力。为了削弱苏联在东德的统治，他们决定邀请西德最著名的民主人士和反共分子。西德民主力量得到加强，该国与西方建立了牢固的联系。这在冷战期间发挥了至关重要的作用，帮助防止西德倒向苏联。"
 BRD.8.a: "西德将会重见光明！。"

 BRD.9.t: "基本法"
 BRD.9.d: "在美国的带领下，西德三地联合发表《基本法》"
 BRD.9.f: "在盟军的支持下，西德三地联合出表《基本法》，宣告成立#v $BRD$#!，与东方苏联势力相对抗，并带领德意志走向民主与和平"
 BRD.9.a: "#v $BRD$#!万岁！。"

 BRD.10.t: "军事援助"
 BRD.10.d: "在美国的带领下，盟军的军队逐渐到达西柏林"
 BRD.10.f: "为了防止苏联的入侵，美英法三国决定向德国派去驻军"
 BRD.10.a: "看苏联还敢不敢入侵西柏林。"

 BRD.11.1.t: "美国方要求与我国谈判"
 BRD.11.1.d: "美国要求就柏林问题展开谈判"
 BRD.11.1.f: "美国与苏联决定在柏林举行高层会议，目的是寻求解决柏林问题的和平途径。双方代表团在城市中心的一个历史悠久的会议厅里聚集，各自携带着明确的立场与期待，气氛凝重而复杂。美国提出了几个重要议题，要求与苏联方进行谈判与沟通"
 BRD.11.1.a: "或许，有些妥协是我们共同的未来之路。"
 BRD.11.1.b: "我们绝不会允许西方的毒素渗透进来。"
 
 BRD.11.2.t: "法国方要求与我国谈判"
 BRD.11.2.d: "法国要求就柏林问题展开谈判"
 BRD.11.2.f: "法国与苏联决定在柏林举行高层会议，目的是寻求解决柏林问题的和平途径。双方代表团在城市中心的一个历史悠久的会议厅里聚集，各自携带着明确的立场与期待，气氛凝重而复杂。法国提出了几个重要议题，要求与苏联方进行谈判与沟通"
 BRD.11.2.a: "或许，有些妥协是我们共同的未来之路。"
 BRD.11.2.b: "我们绝不会允许西方的毒素渗透进来。"

 BRD.11.3.t: "英国方要求与我国谈判"
 BRD.11.3.d: "英国要求就柏林问题展开谈判"
 BRD.11.3.f: "英国与苏联决定在柏林举行高层会议，目的是寻求解决柏林问题的和平途径。双方代表团在城市中心的一个历史悠久的会议厅里聚集，各自携带着明确的立场与期待，气氛凝重而复杂。英国提出了几个重要议题，要求与苏联方进行谈判与沟通"
 BRD.11.3.a: "或许，有些妥协是我们共同的未来之路。"
 BRD.11.3.b: "我们绝不会允许西方的毒素渗透进来。"

 BRD.12.t: "苏联同意达成部分议题"
 BRD.12.d: "通过与苏联进行谈判，柏林问题的突破性进展"
 BRD.12.f: "会谈结束时，我们的代表团站在窗前，望向西柏林的天空。今天的谈判成功将是历史中的一次重要转折。这不仅是柏林历史上的一页新篇章，更是一个和平的曙光，在陷入阴霾的世界中散发出希望的光辉。"
 BRD.12.a: "柏林前途一片光明！"

 BRD.13.t: "苏联拒绝达成谈判"
 BRD.13.d: "经过数小时的争论，苏联代表团重申拒绝盟国提出的任何协议"
 BRD.13.f: "谈判在无望中结束，苏联代表团果断离开，会场的气氛凝重得如同一块铅块。我们的代表万般无奈，他们意识到，柏林的命运将继续徘徊在东西方的对抗之中，成为冷战历史上的一个永恒谜题。柏林的街头仍然熙熙攘攘，人们对未来充满期待与忧虑，而在权力的筹码之上，鲜有人能够明确这座城市的命运走向。"
 BRD.13.a: "只能走一步看一步了。"