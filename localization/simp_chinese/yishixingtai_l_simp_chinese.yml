l_simp_chinese:
#海地国家利益集团
 ideology_haitian_abolitionist_leader: "海地废奴主义者"
 ideology_haitian_abolitionist_leader_desc: "#lore 这个领袖认为奴隶制和长时间劳作是违反人权的可憎制度，并寻求将其从世界上废除。#!"
 ideology_haitian_abolitionist: "海地废奴主义者"
 ideology_haitian_abolitionist_desc: "#lore 这个集团憎恨奴隶制和长时间劳作，认为它是野蛮过往的象征。#!"

#印度国家利益集团
 ig_zamindars: "扎明达尔"
 ig_zamindars_desc: "扎明达尔人是典型的世袭大庄园地主。他们通常代表莫卧儿时代贵族的残余，被授予代表统治者征收土地收入的权利。"
 ideology_zamindar: "扎明达尔"
 ideology_zamindar_desc: "#lore 这个集团对试图自我管理的民众没有信心，认为他们需要扎明达尔（印地语对土地拥有者的称谓）的引导。#!"
 ig_indian_army: "印度军队"
 ig_indian_army_desc: "印度军队是印度的主要武装力量，通过将各管辖区部队统合为单一实体形成，主要由印度土兵组成。"
 ig_ryots: "莱特"
 ig_ryots_desc: "莱特是印度传统农民及自给农的统称，通常没有自己的土地。他们天然的利益大多在于农业耕作。"
 ig_civil_servants: "公务员"
 ig_civil_servants_desc: "公务员包括印度本土的知识分子，这个以知识分子为主的阶层主要从印度殖民地官僚机构中发展而来。他们通常担任或曾经担任过职员或其他中低级别的管理人员。"
 ig_bhadralok: "巴德拉罗克"
 ig_bhadralok_desc: "巴德拉罗克，或“绅士”指的是印度社会中富有的中产阶级。这个集团起源于孟加拉地区，由孟加拉当地的商人、实业家和金融家组成，他们在东印度公司统治印度期间与东印度公司结盟。"
 ig_kisanharu: "基桑哈鲁"
 ig_kisanharu_desc: "吉斯奈鲁是尼泊尔传统农民及自给农的统称，通常他们没有自己的土地。他们天生就是为了从事农业工作。"

#伊斯兰国家利益集团
 ig_wahhabi:0 "瓦哈比派"
 ig_wahhabi_desc:0 "瓦哈比派主张要严格奉行认主独一的教义，革除多神崇拜和一切形式的“标新立异”。"
 ig_ibadites:0 "伊巴德派"
 ig_ibadites_desc:0 "伊巴德派是伊斯兰教仅次于逊尼派和什叶派的第三大教派，接近于逊尼派，主张应以实际行动发扬和恢复先知穆罕默德及哈里发阿布·伯克尔、欧麦尔执政时期古朴纯正的风尚和传统。"

 #苏联利益集团
 ig_grandees:0 "显贵"
 ig_grandees_desc:0 "通常指的是在社会中具有较高地位和影响力的人物，他们可能是政治、经济、文化等领域的杰出人士。在现代政治体系中，这样的地位可能与高级官员、知名企业家、杰出的科学家或艺术家等相关。"
 ig_trait_UAW: "工人联合会"
 ig_trait_UAW_desc: "组织工作不会在工作日结束时结束！统一战线不仅需要在工厂里相互帮助，也需要在我们的家庭和社区里相互帮助。"
 ig_entrepreneur: "企业家"
 ig_entrepreneur_desc: "对技术进步和工业增长感兴趣的企业经营者或组织者。"
 ig_red_army: "人民军"
 ig_red_army_desc: "人民军致力于保卫和传播革命，是传统武装力量与无产阶级和共产主义意识形态结合的产物。"
 ig_workers_and_peasants_red_army: "苏联武装力量"
 ig_workers_and_peasants_red_army_desc: "苏联武装力量致力于保卫苏维埃联盟和传播革命，是传统武装力量与无产阶级和共产主义意识形态结合的产物。"
 ig_bureaucracy: "官僚"
 ig_bureaucracy_desc: "官僚是我国在地方为国家服务的政府官员。"

#中共利益集团
 ig_workers_and_peasants: "农会"
 ig_workers_and_peasants_desc: "农会是农民协会的简称，或称农协，代表着中国广大农民的利益。"
 ig_liberation_army: "解放军"
 ig_liberation_army_desc: "解放军是中国最主要的武装力量，他们担当着保卫祖国、参加社会主义革命和建设的任务。"
 ig_individual_business: "个体工商户"
 ig_individual_business_desc: "个体工商户指中国从事工商经营活动的人或家庭，他们活跃在中国的街头巷尾，为中国的经济增添着活力。"

#美帝国主义和其乏走狗的邪恶利益集团
 ig_monopoly_bourgeoisie:0 "垄断资产阶级"
 ig_monopoly_bourgeoisie_desc:0 "金融利益是德国金融业的主要驱动力。德国和犹太资本大佬投资新业务，开拓新市场，逐步垄断了资本。"
 ig_giant:0 "豪门"
 ig_giant_desc:0 "豪门是位高权重而气势凌人的家族，是传统和“老钱”的守护人。"
 ig_elite:0 "政治精英"
 ig_elite_desc:0 "由政治共同体全体成员中最优秀的少数人组成的上层集团。"
 ig_academic_group:0 "学术集团"
 ig_academic_group_desc:0 "学术集团在我国扮演着重要的角色，无论是政府的支持者还是政府的批评者。该集团致力于为国家设立高标准的科研和教学标准。"
 ig_federal_reserve:0 "美联储"
 ig_federal_reserve_desc:0 "金融利益是美国金融业的主要驱动力。掌握美联储的资本大佬投资新业务，开拓新市场。"
 ig_military_industry_iomplex:0 "军工复合体"
 ig_military_industry_iomplex_desc:0 "军队、军工企业和其他利益与国家军事方面密切相关的政府议员。"
 ig_administrative_bureaucrat: "公务员"
 ig_administrative_bureaucrat_desc: "公务员是在地方为国家和地方政府服务的工作人员。"
 ig_bureaucratic_bourgeoisie: "官僚资产阶级"
 ig_bureaucratic_bourgeoisie_desc: "官僚资产阶级是指勾结帝国主义和地主阶级势力，掌握国家政权，垄断全国经济命脉的买办性的资产阶级。"
 ig_national_bourgeoisie: "民族资产阶级"
 ig_national_bourgeoisie_desc: "民族资产阶级，致力于发展民族工商业的中等资产阶级。"
 ig_chaebol: "财阀"
 ig_chaebol_desc: "金融利益是金融业的主要驱动力。资本大佬投资新业务，开拓新市场，逐步垄断了资本。"
 ig_militia: "驻军"
 ig_militia_desc: "驻军致力于保卫美国控制下的日本。"
 ig_farmers: "大农场主"
 ig_farmers_desc: "大农场主是大型农场和大种植园的拥有者，是传统和“老钱”的守护人。"

 ideology_state_capitalism: "国家资本主义者"
 ideology_state_capitalism_desc: "#lore 这个领袖相信国家应该采取一种政府和市场相结合的国家资本主义模式来发展国家。#!"
 ideology_enlightened_theocrats: "开明神权主义者"
 ideology_enlightened_theocrats_desc: "#lore 这个领袖相信要由教会以教义和工会等保护公民权益的组织来促进社会公正和减少不平等。#!"
 ideology_moderate: "温和主义者"
 ideology_moderate_desc: "#lore 这个领袖被认为是他们利益集团中的温和派，并没有自己特定的意识形态。#!"
 ideology_traditionalist: "传统主义者"
 ideology_traditionalist_desc: "#lore 这个领袖主张维持传统习俗，并把它们视作自然法则的延伸。#!"
 ideology_atheist: "虚无主义者"
 ideology_atheist_desc: "#lore 这个领袖将不惜一切代价推翻旧秩序旧思想，试图为全面革新社会扫清道路。#!"
 ideology_three_peoples_principles: "三民主义者"
 ideology_three_peoples_principles_desc: "#lore 这个领袖寻求建立一个民主的共和国。#!"
 ideology_political_trainer: "训政主义者"
 ideology_political_trainer_desc: "#lore 这个领袖寻求建立一个民主的共和国。#!"
 ideology_republican_leader: "共和主义者"
 ideology_republican_leader_desc: "#lore 这个领袖寻求建立一个由民选官员统治的共和国。#!"
 ideology_truman_leader: "杜鲁门主义者"
 ideology_truman_leader_desc: "#lore 这个领袖相信美国必须积极地介入世界事务，并且在需要时使用军事手段保卫自己和同盟国的利益。通过这种方式，美国可以成为国际体系的领导者，维护国际和平和稳定。这个领袖支持西式民主政体，反对共产主义和苏联扩张。#!"
 ideology_radical: "激进主义者"
 ideology_radical_desc: "#lore 这个领袖致力于激进的政治改革，以谋求真正的人民民主理念的推广。并且通过一个由具备献身精神的激进分子组成的民主政党来让社会更平等一些。#!"
 ideology_abolitionist: "废奴主义者"
 ideology_abolitionist_desc: "#lore 这个领袖认为奴隶制是违反人权的可憎制度，并寻求将其从世界上废除。#!"
 ideology_anti_slavery: "废奴主义者"
 ideology_anti_slavery_desc: "#lore 这个集团憎恨奴隶制，认为它是野蛮过往的象征。#!"
 ideology_slaver: "蓄奴主义者"
 ideology_slaver_desc: "#lore 这个领袖把奴隶制视作他们生活方式中非常自然的一部分，并反对将其废除。#!"
 ideology_feminist: "女权主义者"
 ideology_feminist_desc: "#lore 这个领袖认为女性和男性是平等的，并争取扩大她们的公民权利。#!"
 ideology_reformer: "改良主义者"
 ideology_reformer_desc: "#lore 这个领袖希望进行一些渐进式变革来让社会更平等一些，但不要过度。#!"
 ideology_secularized_reformer: "世俗化改良主义者"
 ideology_secularized_reformer_desc: "#lore 这个领袖希望进行一些渐进式变革来让社会更世俗一些，但不要过度。#!"
 ideology_de_gaulle: "戴高乐主义者"
 ideology_de_gaulle_desc: "#lore 这个领袖在外交上坚持独立自主的原则，强调随时准备战斗以维持独立，在内政上希望进行一些渐进式变革来让社会更平等一些，但不要过度。#!"
 ideology_pacifist: "和平主义者"
 ideology_pacifist_desc: "#lore 这个领袖相信非暴力是他们的手段，和平是他们的目标。#!"
 ideology_jingoist_leader: "沙文主义者"
 ideology_jingoist_leader_desc: "#lore 这个领袖拥护侵略性的外交政策，强调随时准备战争以彰显其野心。#!"
 ideology_caudillismo_leader: "考迪罗主义者"
 ideology_caudillismo_leader_desc: "#lore 该角色相信伟大的国家需要有军事背景的强人领袖，而自己是唯一有资格担任这个职位的人。#!"
 ideology_carlos: "卡洛斯派"
 ideology_carlos_desc: "#lore 这个领袖忠于君主制及合法统治者，支持传统的天主教价值观，反对议会主义。#!"
 ideology_isabelle: "伊莎贝尔派"
 ideology_isabelle_desc: "#lore 这个领袖忠于君主制及合法统治者，致力于自由主义改革，以谋求君主立宪理念的推广。#!"
 ideology_national_syndicalists: "国家工团主义者"
 ideology_national_syndicalists_desc: "#lore 这个领袖认为可以通过上层阶级的让步和整个民族的合作来解决阶级冲突。#!"
 ideology_royalist: "保皇主义者"
 ideology_royalist_desc: "#lore 这个领袖忠于君主制及合法统治者。#!"
 ideology_social_democrat: "社会民主主义者"
 ideology_social_democrat_desc: "#lore 这个领袖相信要通过议会改革来实现社会主义社会。#!"

#红色意识形态
 ideology_market_socialism: "市场社会主义者"
 ideology_market_socialism_desc: "#lore 这个领袖相信国家应该采取一种市场和政府相结合的市场社会主义模式来发展国家。#!"
 ideology_syndicalism: "工团主义者"
 ideology_syndicalism_desc: "#lore 这个领袖相信工人阶级要通过工会运动和罢工的方式夺取政治权力，用工会取代国家机器来管理社会，反对先锋队。#!"
 ideology_democratic_socialism: "民主社会主义者"
 ideology_democratic_socialism_desc: "#lore 这个领袖被认为是反对武装革命，鼓吹超阶级的国家观点，视混合经济为社会主义，主张以渐进的改良措施来达到社会主义。 #!"
 ideology_national_communist: "民族共产主义者"
 ideology_national_communist_desc: "#lore 这个领袖相信一个国家要以主体民族的解放为基础，工人阶级要通过一切必要手段夺取政治权力。#!"
 ideology_communist: "共产主义者"
 ideology_communist_desc: "#lore 这个领袖相信工人阶级要通过一切必要手段夺取政治权力。#!"
 ideology_vanguardist: "马克思列宁主义者"
 ideology_vanguardist_desc: "#lore 这个领袖相信要通过一个由具备献身精神的激进分子组成的先锋党来实现社会主义社会。#!"
 ideology_stalin: "斯大林主义者"
 ideology_stalin_desc: "#lore 这个领袖是一位极权主义者，主张通过一个由具备献身精神的激进分子组成的先锋党来实现社会主义社会。#!"
 ideology_mao: "毛泽东主义者"
 ideology_mao_desc: "#lore 这个领袖是一位毛泽东主义者，主张通过一个由具备献身精神的激进分子组成的先锋党来实现社会主义社会。#!"
 ideology_jin: "主体思想主义者"
 ideology_jin_desc: "#lore 这个领袖是一位极权主义者，忠于主体思想及拥有正统血脉的合法统治者。#!"
 ideology_khrushchev: "赫鲁晓夫主义者"
 ideology_khrushchev_desc: "#lore 这个领袖是一位修正主义者，提倡对文化差异采取更多的包容，采取更开放的国际关系政策，否定专断和恐怖政策。#!"

#黑色意识形态
 ideology_country_socialists: "国家社会主义者"
 ideology_country_socialists_desc: "#lore 这个领袖是一个国家社会主义者，主张利用资产阶级国家政权进行社会改良。#!"
 ideology_national_socialists: "民族社会主义者"
 ideology_national_socialists_desc: "#lore 这个领袖是一位极端民族主义者，主张恢复在现代背景下被认为传统、专制的价值观。#!"
 ideology_fascist: "法西斯主义者"
 ideology_fascist_desc: "#lore 这个领袖是一位极端民族主义者，主张恢复在现代背景下被认为传统、专制的价值观。#!"

#奇怪的意识形态
 ideology_anarchist: "无政府主义者"
 ideology_anarchist_desc: "#lore 这个领袖寻求废除等级制、政府管理机构与国家，由人民自己来管理自己。#!"
 ideology_ethno_nationalist: "族裔民族主义者"
 ideology_ethno_nationalist_desc: "#lore 这个领袖相信一个国家要以特定族裔为基础。#!"
 ideology_wahhabi_leader: "瓦哈比派"
 ideology_wahhabi_leader_desc: "#lore 这个领袖主张要严格奉行认主独一的教义，革除多神崇拜和一切形式的“标新立异”。#!"
 ideology_theocrat: "神权政治主义者"
 ideology_theocrat_desc: "#lore 这个领袖相信要由教会以教义来运行国家。#!"
 ideology_market_liberal: "市场自由主义者"
 ideology_market_liberal_desc: "#lore 这个领袖认为自由市场那看不见的手应该是国家经济的指导力量。#!"

#Interest Group Ideologies
 ideology_wahhabi: "瓦哈比派"
 ideology_wahhabi_desc: "#lore 这个集团主张要严格奉行认主独一的教义，革除多神崇拜和一切形式的“标新立异”。#!"
 ideology_paternalistic: "家长式主义者"
 ideology_paternalistic_desc: "#lore 这个集团对试图自我管理的民众没有信心，认为他们需要传统贵族的引导。#!"
 ideology_patriarchal: "父权主义者"
 ideology_patriarchal_desc: "#lore 这个集团相信男人应当拥有政治权威，而女人应当服从她们的父亲和丈夫。#!"
 ideology_truman: "杜鲁门主义者"
 ideology_truman_desc: "#lore 这个集团相信美国必须积极地介入世界事务，并且在需要时使用军事手段保卫自己和同盟国的利益。通过这种方式，美国可以成为国际体系的领导者，维护国际和平和稳定。这个集体支持西式民主政体，反对共产主义和苏联扩张。#!"
 ideology_republican: "共和主义者"
 ideology_republican_desc: "#lore 这个集团相信最好的领袖是由公众选举产生的，支持共和政体。#!"
 ideology_populist: "平民主义者"
 ideology_populist_desc: "#lore 这个集团相信民治，并且寻求将选举权扩展到所有社会阶层。#!"
 ideology_stratocratic: "阶层主义者"
 ideology_stratocratic_desc: "#lore 这个集团赞同通过传统形式的税收与劳动关系来维持社会的等级制。#!"
 ideology_laissez_faire: "自由放任主义者"
 ideology_laissez_faire_desc: "#lore 这个集团信奉贸易和劳动力的自由流动，倾向于市场的判断而不是政府的判断。#!"
 ideology_individualist: "个人主义者"
 ideology_individualist_desc: "#lore 这个集团认为每个人都要对自己的命运负责，反对政府提供本可由个人支付的服务。#!"
 ideology_pious: "虔信徒"
 ideology_pious_desc: "#lore 这个集团认为宗教原则是至高无上的道德真理，应该渗入社会的每个角落。#!"
 ideology_particularist: "特殊主义者"
 ideology_particularist_desc: "#lore 这个集团希望践行地方社群自治的理念，摆脱封建奴工契约的条款。#!"
 ideology_isolationist: "孤立主义者"
 ideology_isolationist_desc: "#lore 这个集团希望国家专注于国内事务，反对向外扩张的野心，排斥外国移民。#!"
 ideology_moralist: "道德主义者"
 ideology_moralist_desc: "#lore 这个集团对宗教道德秩序有强烈的信念，并认为观点和文化的多样性是对这一秩序的威胁。#!"
 ideology_jingoist: "沙文主义者"
 ideology_jingoist_desc: "#lore 这个集团信奉侵略性的外交政策，并愿意维持一支军队以支撑该信念。#!"
 ideology_loyalist: "效忠派"
 ideology_loyalist_desc: "#lore 这个集团认为每个公民都应主动纳税，为国家的关键职能提供资金。#!"
 ideology_meritocratic: "精英主义者"
 ideology_meritocratic_desc: "#lore 这个集团相信成功是争取来的，那些取得成功的人理应获得相应的责任和财富。#!"
 ideology_patriotic: "爱国主义者"
 ideology_patriotic_desc: "#lore 这个集团对自己的国家有着强烈的忠诚，希望对那些散布异见者采取严厉措施。#!"
 ideology_red_liberalism: "红色自由主义者"
