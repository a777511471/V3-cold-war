 DLC_THEME_BREAKDOWN_ITEM: "$TAB$#header [Theme.GetName]#![Theme.GetCategory.GetName]"
 dlc001: "维多利亚2音乐包"
 dlc002: "美洲建筑包"
 dlc003: "大众旋律"
 dlc004: "人民之声"
 dlc005: "人民之声主题包"
 dlc006: "人民之声主题包预购"
 dlc007: "黎明奇迹"
 dlc008: "南方巨人"
 dlc010: "冷战·新铁幕"
 dlc011: "象之觉醒"
 dlc003_desc: "音乐是人民的艺术，在冷战期间更是如此。这个包括14首乐曲时长将近一小时的原创音乐包是一场纪念普通人日常奋斗和抱负的音乐会，灵感来自于对那些在土地上劳动的简单日子的浪漫向往。"
 dlc004_desc: "在冷战的铁幕之下，被剥削的劳动人民正在觉醒！《人民之声》让您切身体验这场伟大的社会变革！加入革命阵营，掌握生产资料，建立无产阶级专政，用人民的力量塑造一个没有压迫，没有剥削的理想世界！让人民之声响彻寰宇，宣告共产主义的最终胜利！"
 dlc007_desc: "从红日初升的光辉到月光下城市的繁华，《黎明奇迹》让您将体验别样的艺术和生命。在日月循环中，世界的秩序正在被悄然改变，新时代之黎明正在崛起。"
 dlc008_desc: "在世界被红色与自由蓝撕裂之际，南美洲大陆在热带阳光下孕育着变革的种子。从安第斯山脉的高耸山峰到亚马逊雨林的深邃腹地，这片土地不仅是资源的宝库，也是意识形态冲突的新战场。选择你的道路：是拥抱承诺的革命，还是紧握既定的秩序？无论你选择哪一方，都要记住，历史的车轮永不停歇。"
 dlc010_desc: "旧日的战争硝烟散去，新的对峙阴影笼罩。冷战的寒意不仅渗透进欧洲的每一寸土地，更蔓延至全球。钢铁的帷幕已经落下，但一种无形的、更为致命的屏障正在形成——猜疑、恐惧和意识形态的鸿沟，将世界切割得支离破碎。准备好迎接新的铁幕，它的影响将比以往任何时候都更加深远。"
 dlc011_desc: "沉睡的巨象睁开了它的双眼。在冷战的阴影下，印度不再满足于做一个旁观者。从不结盟运动的倡导者，到地区力量的崛起，印度正在书写属于自己的历史，在这场世界性的博弈中寻找自己的位置。"
