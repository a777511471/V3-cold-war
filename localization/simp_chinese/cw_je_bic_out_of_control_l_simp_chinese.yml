l_simp_chinese:
 je_bic_out_of_control_main: "挽救殖民统治"
 je_bic_out_of_control_main_goal: "完成挽救殖民统治的一系列任务。"
 je_bic_out_of_control_main_reason: "为了挽救我们的殖民统治，我们需要接纳穆斯林与印度教徒，同时完成一系列现代化改革措施。"
 je_bic_partition_main: "印巴分治方案"
 je_bic_partition_main_goal: "挑拨穆斯林与印度教徒关系，直到进度条满。"
 je_bic_partition_main_reason: "一种体面的退出在印度殖民统治的方式，也许是守住我们殖民时代遗产的最可行方法：殖民政府可以离开印度，但英国必须有能力继续在印度次大陆施加影响力。无论是为了体面，还是为了继续维护殖民统治的遗产，我们都有必要“解决”印度国大党和穆斯林联盟的冲突，顺势而为，创造一个分裂的、永无宁日的印度次大陆。"
 je_hnd_expansion_main: "大婆罗多：第一阶段"
 je_hnd_expansion_main_goal: "将殖民主义的残余从南亚次大陆清扫干净，并解决前殖民政府遗留的克什米尔问题。"
 je_hnd_expansion_main_reason: "前殖民政府与其他殖民者之间的妥协不被我们所承认，南亚残余的殖民势力必须彻底清除。"
 je_bht_expansion_main: "大婆罗多：第二阶段"
 je_bht_expansion_main_goal: "统一南亚次大陆的所有地区，征服喜马拉雅。"
 je_bht_expansion_main_reason: "南亚次大陆的统一是印度的历史使命，是大婆罗多计划的第二步。成为南亚的霸权已经无法满足民族主义者的野望，我们会成为南亚的统一者，并向高原进军。"
 je_bht_expansion_second_main: "大婆罗多：第三阶段"
 je_bht_expansion_second_main_goal: "将我们的影响力从南亚拓展到西亚、东亚和东南亚；征服锡兰，将印度洋牢牢掌控。"
 je_bht_expansion_second_main_reason: "大婆罗多的目标近在咫尺，如果实现，我们将有望成为具有全球影响力的新兴霸权。"