 BRD_decision: "建立德意志联邦共和国"
 BRD_decision_desc: "根据外交，政治与经济形势需要，我们准备在西德建立德意志联邦共和国。"
 DDR_decision: "建立德意志民主共和国"
 DDR_decision_desc: "根据外交，政治与经济形势需要，我们准备在东德建立德意志民主共和国。"
 KOR.1.t: "建立大韩民国"
 KOR.1.d: "根据外交，政治与经济形势需要，我们需要决定是否建立大韩民国。"
 KOR.1.f: "为了对抗苏联在朝鲜北部的影响力，美国决定支持朝鲜半岛南部建立一个独立的民主国家大韩民国，简称韩国。"
 KOR.1.a: "这可真棒" #同意
 KOR.1.b: "我并不觉得这是个明智的选择" #不同意
 PRK.1.t: "建立朝鲜民主主义人民共和国"
 PRK.1.d: "眼看着大韩民国的成立，我们应该决定是否建立朝鲜民主主义人民共和国与之抗衡。"
 PRK.1.f: "为了对抗美国在朝鲜南部的影响力，苏联决定支持朝鲜半岛北部建立一个独立的社会主义国家朝鲜民主主义人民共和国，简称朝鲜。1948年9月9日凌晨5时15分，平壤火车站的蒸汽机车发出刺耳的汽笛声。金日成站在装甲列车车顶，手中紧握着从苏联莫斯科带回来的《朝鲜民主主义人民共和国成立宣言》原件。薄雾笼罩的鸭绿江对岸，美国军用飞机正沿着三八线进行例行侦察，飞行员透过舷窗惊愕地发现，往日荒芜的平壤城头，不知何时已飘扬起鲜红的旗帜。这座城市尚未从战争的废墟中完全恢复。联合国军撤退时炸毁的发电厂仍在冒烟，街道两侧的木屋墙上留着弹孔，但沿大同江畔新搭建的临时广场上，二十万民众已提前聚集。穿着补丁摞补丁的棉袄，妇女们头顶竹篓盛着新碾的米糕，孩童们举着用木棍绑扎的纸质星星灯。当第一缕晨光穿透云层时，金日成迈着稳健步伐走向观礼台，"同胞们！"金日成的声音穿透了广场上此起彼伏的欢呼。他展开用朝鲜文和俄文双语印刷的宣言，高声宣读："我们建立了真正代表全体朝鲜人民的政权！"话音未落，十二门苏制喀秋莎火箭炮突然向天空齐射，弹道划出的红色弧光与初升的朝阳交相辉映。人群中爆发出海啸般的欢呼声，有人跪地亲吻洒满花瓣的地面，有几个穿着军装的年轻人激动得热泪盈眶，他们胸前的红星徽章在晨光中闪闪发亮。一切活动结束之后，金日成望着西北的白头山。呼啸的秋风自西北而来，从丹东一路南下直达平壤，秋风裹挟着不属于这个季节的雪轻轻落在了他的肩膀上。真是“白头山上雪，染我一身白”。"
 PRK.1.a: "金日成将军的恩情还不完" #同意
 PRK.1.b: "这可不太妙" #不同意
 AUS_decision: "建立统一的奥地利"
 AUS_decision_desc: "根据外交，政治与经济形势需要，我们准备建立统一的奥地利。"
 AUS.1.t: "建立统一的奥地利"
 AUS.1.d: "英美法苏占领区召开了一场会议，决定是否合并占领区以建立统一的奥地利。"
 AUS.1.f: "“奥地利将再次成为欧洲的荣光。”"
 AUS.1.a: "这可真棒" #同意
 AUS.1.b: "我并不觉得这是个明智的选择" #不独立

