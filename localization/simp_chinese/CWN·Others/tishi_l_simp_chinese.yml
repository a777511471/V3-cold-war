 subject_type_territory:0 "监管国"
 subject_type_territory_no_icon:0 "监管国"
 concept_territory_desc:0 "监管国，指国际关系中名义上完全享有主权，但其国内政治、军事和外交受战胜国干预的战败国，当监管国可能出现政治变革之时，宗主国将付诸武力干涉；另外，由于国势弱小，需要有一个强大国家监管的国家也常被称为监管国。监管国属于二战后国际关系中出现的政治术语，出现于第二次世界大战结束后。"
 subject_type_special_administrative_region:0 "特别行政区"
 subject_type_special_administrative_region_no_icon:0 "特别行政区"
 concept_special_administrative_region_desc:0 "特别行政区是根据宪法规定设立的省级或州级行政区，与省、州、自治区、直辖市同属直辖于中央政府的地方行政区域。"
 concept_semi_autonomous_colony_desc:0 "殖民[concept_country]在[concept_decentralized_nation]发起的定居行动。一个未来的殖民国必须有[SelectLocalization(GetPlayer.IsValid,'concept_colony_desc_added','殖民事务')][concept_institution]和在该[concept_strategic_region]的[concept_interest]。一开始，只有一个[concept_province]会被夺取。邻近$concept_provinces$被$concept_colonized$的速率取决于$concept_country$的[concept_colonial_growth]，并且在此期间产生[concept_tension]。"
 concept_satellite_desc:0 "卫星国，指国际关系中名义上完全享有主权，但其国内政治、军事和外交受强权干预的国家，强权国家常被称为宗主国，当卫星国可能出现政治变革之时，宗主国将付诸武力干涉；另外，由于国势弱小，需要有一个强大国家保护的国家也常被称为卫星国。卫星国属于现代国际关系中出现的政治术语，出现于第二次世界大战结束后冷战时期。"

