l_simp_chinese:
 PRK_decision: "建立朝鲜民主主义人民共和国"
 PRK_decision_desc: "根据外交，政治与经济形势需要，我们准备在北朝鲜建立朝鲜民主主义人民共和国。"
 KOR_decision: "建立大韩民国"
 KOR_decision_desc: "根据外交，政治与经济形势需要，我们准备在南朝鲜建立大韩民国。"
 KOR.1.t: "建立大韩民国"
 KOR.1.d: "根据外交，政治与经济形势需要，我们需要决定是否建立大韩民国。"
 KOR.1.f: "为了对抗苏联在朝鲜北部的影响力，美国决定支持朝鲜半岛南部建立一个独立的民主国家 - 大韩民国，简称韩国。"
 KOR.1.a: "这可真棒" #同意
 KOR.1.b: "我并不觉得这是个明智的选择" #不同意
 PRK.1.t: "建立朝鲜民主主义人民共和国"
 PRK.1.d: "眼看着大韩民国的成立，我们应该决定是否建立朝鲜民主主义人民共和国与之抗衡。"
 PRK.1.f: "随着韩国的建立，为了巩固其在东亚的势力，苏联最终决定支持朝鲜半岛北部建立一个独立的社会主义国家——朝鲜民主主义人民共和国，简称朝鲜。"
 PRK.1.a: "好点子" #同意
 PRK.1.b: "这可不太妙" #不同意
 AUS_decision: "建立统一的奥地利"
 AUS_decision_desc: "根据外交，政治与经济形势需要，我们准备建立统一的奥地利。"
 AUS.1.t: "建立统一的奥地利"
 AUS.1.d: "英美法苏占领区召开了一场会议，决定是否合并占领区以建立统一的奥地利。"
 AUS.1.f: "“奥地利将再次成为欧洲的荣光。”"
 AUS.1.a: "这可真棒" #同意
 AUS.1.b: "奥地利应该跟随苏联的脚步" #不独立
 AUS.1.c: "我并不觉得这是个明智的选择" #不同意