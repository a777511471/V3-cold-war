l_simp_chinese:
 sericulture: "古代技艺"
 sericulture_desc: "传统民间技艺是民间传承下来的工艺，有着悠久的历史。"
 tech_international_loans: "国际贷款"
 tech_international_loans_desc: "国际贷款是指债权人和债务人分属不同国别的贷款。国际资本流动的主要方式之一。"
 tech_financial_currencies: "金融货币"
 tech_financial_currencies_desc: "金融货币就是在现行货币定义的基础上加入国债的份额，才能更为准确的体现该国的货币供应情况。"
 permanent_magnet_motors: "永磁电机"
 permanent_magnet_motors_desc: "永磁电机是一种广泛应用的电机类型，具有高效率，良好动态响应性能，低噪音等优势，在电动汽车、机器人和其他需要高效率、高动态性能和低噪音等领域被广泛应用。"
 tech_early_economics: "早期经济学"
 tech_early_economics_desc: "经济学作为一门学科的历史可以追溯到古希腊时期。从柏拉图的《理想国》到亚里士多德的《政治学》，古希腊思想家们对于物质财富的分配、管理和利用进行了深入思考。在中世纪，欧洲的经院哲学家们也开始关注经济学问题，探讨了货币、价格、利息和税收等概念。西欧资本原始积累时期，依次产生了重商主义思想和重农学派思想。"
 tech_sraffa_political_economy: "斯拉法政治经济学"
 tech_sraffa_political_economy_desc: "当代政治经济学流派之一。 以1960年出版的英籍意大利经济学家斯拉法的《用商品生产商品》中提出的商品价值论，分析古典经济学的经济学学派，故称。"
 tech_economics_of_the_future: "未来经济学"
 tech_economics_of_the_future_desc: "未来经济学是一门对未来经济进行科学预测并加以研究的多学科交叉边缘学科，是未来学与经济学的有机结合，是研究未来的经济学。"
 tech_network_economy: "网络经济"
 tech_network_economy_desc: "一种建立在计算机网络(特别是Internet)基础之上，以现代信息技术为核心的新的经济形态。"
 tech_platform_capitalism: "平台资本主义"
 tech_platform_capitalism_desc: "平台资本主义是资本主义在数字经济时代的一种发展趋势，平台资本主义依赖数字基础实施的性质与网络本质，是资本主义更加深入的集约化体现。在网络化作为政策指导原则下，商业、物流、医疗、文娱等所有行业都卷入网络，平台被视为了总体结构原则。 "
 tech_theories_of_imperialism: "帝国主义论"
 tech_theories_of_imperialism_desc: "帝国主义论，一是专指资本主义的特殊历史阶段即垄断资本主义，亦称现代资本主义；二是泛指一个国家对别国进行侵略、掠夺、控制或统治的扩张政策。"
 tech_modern_hydraulic_engineering: "现代水利工程"
 tech_modern_hydraulic_engineering_desc: "二战后，随着工农业生产的快速发展，以及为满足日益增长的人口的需要，世界上许多国家投入大量资金发展水利，在整治河道、提高防洪能力、扩大灌溉面积、建设大水库和大水电站、 改善航运条件、跨流域引水、防治水污染、保护水源以及结合水利工程发展旅游等方面，都取得了较大成就，使水资源的开发、利用和保护达到了较高水平。"
 tech_machine_language: "机器语言"
 tech_machine_language_desc: "机器语言是机器能直接识别的程序语言或指令代码，无需经过翻译，每一操作码在计算机内部都有相应的电路来完成它，或指不经翻译即可为机器直接理解和接受的程序语言或指令代码。"
 tech_assembly_language: "汇编语言"
 tech_assembly_language_desc: "汇编语言是任何一种用于电子计算机、微处理器、微控制器或其他可编程器件的低级语言，亦称为符号语言。"
 tech_early_high_level_languages: "早期高级编程语言"
 tech_early_high_level_languages_desc: "FORTRAN是第一个广泛使用的高级编程语言，主要用于科学和工程计算，极大地简化了数值计算的编程过程。"
 tech_c: "中期高级编程语言"
 tech_c_desc: "中期高级编程语言之一的C语言是一种较早的程序设计语言，诞生于1972年的贝尔实验室。1972 年，丹尼斯·里奇设计了C语言，它继承了B语言的许多思想，并加入了数据类型的概念及其他特性。 "
 tech_pansen: "晚期高级编程语言"
 tech_pansen_desc: "晚期高级编程语言之一的Python提供了高效的高级数据结构，还能简单有效地面向对象编程。Python语法和动态类型，以及解释型语言的本质，使它成为多数平台上写脚本和快速开发应用的编程语言，随着版本的不断更新和语言新功能的添加，逐渐被用于独立的、大型项目的开发。"
 tech_java: "现代计算机编程语言"
 tech_java_desc: "现代计算机编程语言是现代程序设计的最重要的工具，它是指计算机能够接受和处理的、具有一定语法规则的语言。java语言就是一种现代计算机编程语言。"

 tech_modern_meteorology: "现代气象学"
 tech_modern_meteorology_desc: "现代气象学是把大气当作研究的客体，从定性和定量两方面来说明大气特征的学科，集中研究大气的天气情况和变化规律和对天气的预报。"
 tech_contemporary_meteorology: "当代气象学"
 tech_contemporary_meteorology_desc: "当代气象学借助大数据和数值模拟，已经可以进行更准确的气象预测。通过收集大量气象数据，运用数值模型进行模拟，当代气象学能够提供更为精确的气象预报。这种技术手段为人们提供了更多预测天气的依据。"
 tech_enso: "enso理论"
 tech_enso_desc: "enso理论以气候预测为桥梁，影响着社会生活的各个领域，让个体可以通过预判，调整更有利的行为方式。"
 tech_southern_ocean_flow_mechanics: "南冰洋洋流动力学"
 tech_southern_ocean_flow_mechanics_desc: "南冰洋洋流动力学是对南冰洋洋流的研究，是指对于南冰洋洋流的动力学理论。 "
 tech_planetary_science: "行星科学"
 tech_planetary_science_desc: "行星科学由地球科学、天文学、空间科学等基础学科交叉而成，主要研究对象为太阳系的行星、彗星、小行星和系外行星，以阐明太阳系天体的物质和结构组成、揭示太阳系主要天体及系外行星的形成和演化、探寻地外生命、寻找宜居星球等为主要研究内容，涉及国家深空探测、航空航天等多个领域。"
 tech_modern_hydraulic_engineering: "现代水利工程"
 tech_modern_hydraulic_engineering_desc: "二战后，随着工农业生产的快速发展，以及为满足日益增长的人口的需要，世界上许多国家投入大量资金发展水利，在整治河道、提高防洪能力、扩大灌溉面积、建设大水库和大水电站、 改善航运条件、 跨流域引水、防治水污染、保护水源以及结合水利工程发展旅游等方面，都取得了较大成就，使水资源的开发、利用和保护达到了较高水平。"
 tech_machine_language: "机器语言"
 tech_machine_language_desc: "机器语言是机器能直接识别的程序语言或指令代码，无需经过翻译，每一操作码在计算机内部都有相应的电路来完成它，或指不经翻译即可为机器直接理解和接受的程序语言或指令代码。"
 tech_assembly_language: "汇编语言"
 tech_assembly_language_desc: "汇编语言是任何一种用于电子计算机、微处理器、微控制器或其他可编程器件的低级语言，亦称为符号语言。"
 tech_early_high_level_languages: "早期高级编程语言"
 tech_early_high_level_languages_desc: "FORTRAN是第一个广泛使用的高级编程语言，主要用于科学和工程计算，极大地简化了数值计算的编程过程。"
 tech_c: "中期高级编程语言"
 tech_c_desc: "中期高级编程语言之一的C语言是一种较早的程序设计语言，诞生于1972年的贝尔实验室。1972 年，丹尼斯·里奇设计了C语言，它继承了B语言的许多思想，并加入了数据类型的概念及其他特性。 "
 tech_pansen: "晚期高级编程语言"
 tech_pansen_desc: "晚期高级编程语言之一的Python提供了高效的高级数据结构，还能简单有效地面向对象编程。Python语法和动态类型，以及解释型语言的本质，使它成为多数平台上写脚本和快速开发应用的编程语言，随着版本的不断更新和语言新功能的添加，逐渐被用于独立的、大型项目的开发。"
 tech_java: "现代计算机编程语言"
 tech_java_desc: "现代计算机编程语言是现代程序设计的最重要的工具，它是指计算机能够接受和处理的、具有一定语法规则的语言。java语言就是一种现代计算机编程语言。"
 political_agitation: "现代政治煽动"
 political_agitation_desc: "政治鼓动者们直接在大屏幕上亮相发表演讲，点燃群众的情绪，煽动他们第一时间搞出各种政治行动。"
 corporatism: "趋同论"
 corporatism_desc: "趋同论是西方资产阶级经济学和未来学中“变形论”的一种。认为社会主义制度和资本主义制度都在变形，二者具有相同的发展趋向，即“合并”为既不是资本主义又不是社会主义的社会 ，最终目标是解决阶级冲突。"
 elevator: "现代电梯"
 elevator_desc: "借助一套复杂的机械和电力系统，可以随意将人和物体提升到所需的高度。"
 steel_frame_buildings: "现代钢结构建筑"
 steel_frame_buildings_desc: "通过使用钢框架支撑整个建筑，有可能建造更高更结实的建筑。"
 urban_planning: "城市规划"
 urban_planning_desc: "在建设前就规划好城市的布局，而非让其野蛮地自然发展，我们才能打造更有效率的生活空间。"
 urbanization: "城市化"
 urbanization_desc: "随着越来越多的人从乡村搬到城市生活，他们的生活方式也注定会改变。"
 antibiotics: "民用抗生素"
 antibiotics_desc: "抗生素是用来治疗或预防由细菌引起的感染的药物，显著提高了病人和牲畜的成活率，也可以用于防治农作物病害。"
 tech_basic_light_industry: "基本轻工业"
 tech_basic_light_industry_desc: "大战前轻工业最基本的生产技术，在规范、规模、技术水平方面都存在相当不足。"
 tech_basic_food_industry: "基本食品工业"
 tech_basic_food_industry_desc: "战后第一代食品工业技术，引进了冷冻干燥、保鲜、添加剂、新型包装技术，专业食品工业机器开始引入，食品规范开始形成。"
 pasteurization: "食品杀菌"
 pasteurization_desc: "经过反复试验，科学家们发现了保存食物的方法，如用巴氏杀菌法加热牛奶或将其浓缩成炼乳，腌制水果和蔬菜，以及将肉和汤装入罐头。所有这些技术的共同点是从待储存的食品中去除病菌，这一概念直到在显微镜下发现细菌后才被完全理解。随着这一概念在大众中普及，食品安全标准也随之拔高，同时公共健康水平也得到了很大的改善，死亡率随之降低。"
 tech_mature_food_industry: "成熟食品工业"
 tech_mature_food_industry_desc: "冷战中期食品工业技术，巴氏杀菌法的普及真空包装技术的推广大大加强了食品的安全性，食品营养均衡问题开始受到重视。"
 tech_advanced_food_industry: "先进食品工业"
 tech_advanced_food_industry_desc: "千禧年后食品工业技术，现代科学的发展助推了食品工业的进步，在储存、发酵、杀菌、萃取等方面有长足进步。"
 tech_modern_food_industry: "现代食品工业"
 tech_modern_food_industry_desc: "近未来尖端食品工业技术，大量运用最新技术，同时兼顾了生产效率与食物质量。"
 tech_basic_civil_light_industry: "基本民用轻工业"
 tech_basic_civil_light_industrytech_desc: "战后第一代民用轻工业技术，大量新型材料进入民用领域（如塑料），给生活用品带来了更多选择。"
 tech_mature_civil_light_industry: "成熟民用轻工业"
 tech_mature_civil_light_industry_desc: "电子技术、冲压技术与注塑技术的发展共同推动了家电走进普通人家中，同时助长了对稳定电力供应的需求。"
 tech_advanced_civil_light_industry: "先进民用轻工业"
 tech_advanced_civil_light_industry_desc: "微处理器与集成电路的发展让本来硕大无朋的电脑得以走进普通人的家庭，以信息技术为基础，生物医药、通信产业得以蓬勃发展。"
 tech_modern_civil_light_industry: "现代民用轻工业"
 tech_modern_civil_light_industry_desc: "AI技术是这个时代最显著的特征，它无处不在，小到手表，大到整栋房屋的，为消费者提供最好的服务。"
 tech_basic_agricultural_production: "基本农业生产"
 tech_basic_agricultural_production_desc: "粮食是人类社会一切的基础，农业从未改变，我们还是像一万年前的先祖们一样，播种，收割。"
 tech_cross_breeding: "杂交育种"
 tech_cross_breeding_desc: "杂交育种是将父母本杂交，形成不同的遗传多样性。再通过对杂交后代的筛选，获得具有父母本优良性状，且不带有父母本中不良性状的新品种的育种方法。"
 tech_plant_nutrition: "植物营养学"
 tech_plant_nutrition_desc: "植物营养学是研究植物对营养物质的吸收，运输，转化和利用的规律及植物与外界环境之间营养物质和能量交换的学科。目的是提高作物产量和改良产品质量。"
 tech_soil_nutrition: "土壤学"
 tech_soil_nutrition_desc: "土壤学是以地球陆地表面能够生长绿色植物的疏松层为对象，研究其中的物质运动规律及其与环境间关系的科学，是农业科学的基础学科之一。"
 tech_transgenosis: "现代转基因技术"
 tech_transgenosis_desc: "转基因技术指人为将一种生物的一个或几个已知功能基因转移到另一种生物体内安家落户，使该生物获得新功能。"
 tech_gene_sequencing: "基因测序"
 tech_gene_sequencing_desc: "基因测序是一种新型基因检测技术，能够从血液或唾液中分析测定基因全序列，预测罹患多种疾病的可能性，个体的行为特征及行为合理。基因测序技术能锁定个人病变基因，提前预防和治疗。"
 tech_synthetic_ammonia: "合成氨"
 tech_synthetic_ammonia_desc: "合成氨指由氮和氢在高温高压和催化剂存在下直接合成的氨，为一种基本无机化工流程。"
 tech_fertilizer_synthesis: "化肥合成"
 tech_fertilizer_synthesis_desc: "基于化学反应的化合物合成，为植物的生长提供高效而合理的营养成分，农业不可或缺的部分。"
 tech_greenhouse_technology: "温室技术"
 tech_greenhouse_technology_desc: "通过创造有利的小气候环境，为作物提供更好的生长环境。"
 tech_basic_mining: "基本矿业"
 tech_basic_mining_desc: "最早的采矿技术可以追溯到石器时代，在人类文明进程中扮演了重要的角色。"
 tech_diverse_handheld_tools: "多样手持工具"
 tech_diverse_handheld_tools_desc: "钻头、锯子、锤子、扳手、砂轮机……工业的发展使得多样化、专精化的手持工具出现。"
 tech_explosives: "爆破物"
 tech_explosives_desc: "诺贝尔发明了最早的安全炸药，而如今，炸药家族早已开枝散叶，成为矿业和建筑业中密不可分的部分。"
 tech_mine_construction: "矿井构建"
 tech_mine_construction_desc: "集成地质勘探、设计规划、井巷掘进、机电安装，实现安全高效矿井系统建设的综合技术。"
 tech_security_equipment: "安全设备"
 tech_security_equipment_desc: "曾经矿工是一个死亡率极高的职业，而如今，我们的集成通风防尘、压力监测、水害防治、机电保护及智能监控的安全技术让矿工只流汗，不流血。"
 tech_unified_tool_standards: "统一工具标准"
 tech_unified_tool_standards_desc: "在不同领域或行业中，对所使用的工具、设备等进行标准化处理，以确保它们之间的兼容性、互换性和高效性，这一技术对于提升工作效率、降低成本、促进技术创新等方面具有重要意义。"
 tech_steel_tools: "钢制工具"
 tech_steel_tools_desc: "作为制造业的重要基础，以其优良的机械性能和广泛的应用范围，极大地促进了生产效率的提高和工业技术的发展。"
 tech_rubber_accessories: "橡胶配件"
 tech_rubber_accessories_desc: "作为密封、减震、耐磨等关键部件，保障了机械设备的高效、稳定运行，提升了工业生产的可靠性和安全性。"
 tech_electric_tools: "电力工具"
 tech_electric_tools_desc: "便携、高效，能够显著提升工作效率，降低劳动强度，是工业生产和加工过程中不可或缺的重要辅助设备。这些工具通过电动机等动力装置驱动，实现了对材料加工、设备安装、维护检修等多种作业的高效完成，为工业生产带来了极大的便利和效益。"
 tech_electronic_tools: "电子化工具"
 tech_electronic_tools_desc: "极大地简化了工作流程，提高了工作效率，实现了智能化代替人工化的基本转化，并促进了工业生产的自动化、信息化和智能化发展。"
 tech_petroleum_extraction_and_application: "石油提取与应用"
 tech_petroleum_extraction_and_application_desc: "石油的提取为工业提供了高效的能源支持，而石油产品的广泛应用则涵盖了能源、交通、化工、建材、医药等多个领域，成为现代工业生产不可或缺的关键要素。"
 tech_metal_oxide_catalysts: "金属氧化物催化剂"
 tech_metal_oxide_catalysts_desc: "作为促进化学反应的媒介，显著提高了生产效率和产品质量，广泛应用于化工、能源、环保等多个领域。"
 tech_integrated_petroleum_exploration_technology: "石油综合勘探技术"
 tech_integrated_petroleum_exploration_technology_desc: "集地质、物理、化学等多学科于一体的系统性方法，旨在高效、精准地探测地下油气资源，提高油气发现率和开采效率。"
 tech_hydraulic_fracturing_: "水力压裂技术"
 tech_hydraulic_fracturing_desc: "通过向地层高压注入压裂液，使地层岩石破裂产生裂缝并保持裂缝张开状态，从而改善油气流动环境、提高油气井产量的油气井增产措施。"
 tech_shale_oil_and_gas_extraction: "页岩油气开采"
 tech_shale_oil_and_gas_extraction_desc: "在页岩地层中构建油气流动通道，从而将难以直接开采的页岩油气资源安全高效地开采出来的过程。使得页岩油层油气资源得以大规模商业化开发。"
 tech_basic_power_generation: "基本发电"
 tech_basic_power_generation_desc: "将各种形式的能源（如煤炭、石油）转化为电能的过程。"
 tech_refined_fuel: "精炼燃料"
 tech_refined_fuel_desc: "经过高度提纯和处理，以提高燃烧效率和减少污染物排放的优质能源材料。"
 tech_combined_combustion_support: "化合助燃"
 tech_combined_combustion_support_desc: "通过添加特定化学物质与燃料混合，增强燃烧反应，提高燃烧速率和能量释放效率的过程。"
 tech_clean_energy: "清洁能源"
 tech_clean_energy_desc: "在使用过程中不产生或极少产生对环境有害物质的能源。"
 tech_advanced_clean_energy: "先进清洁能源"
 tech_advanced_clean_energy_desc: "采用更先进技术提高能源利用效率、减少环境影响，并具备可持续发展特性的清洁能源。"
 tech_basic_chemical_industry: "基本化工产业"
 tech_basic_chemical_industry_desc: "大战前基本化工技术，是一系列工业部门的基础，国民经济的根基。"
 tech_gas_chromatography: "气相色谱法"
 tech_gas_chromatography_desc: "利用气体作为流动相，通过色谱柱中固定相与试样中各组分分子的不同作用力，实现各组分的分离和检测，广泛应用于易挥发有机化合物的定性、定量分析。"
 tech_quantum_chemistry: "量子化学"
 tech_quantum_chemistry_desc: "研究原子、分子和凝聚态体系电子结构、化学键性质、分子间相互作用力、化学反应理论、各种光谱、波谱和电子能谱的理论，以及无机和有机化合物、生物大分子和各种功能材料的结构与性能关系的科学。"
 tech_organic_chemistry: "有机化学"
 tech_organic_chemistry_desc: "研究有机化合物的结构、性质、合成方法、反应机理及其与生命过程关系的科学，涉及碳氢化合物及其衍生物的结构、功能和应用。"
 tech_synthesis_of_conductive_materials: "导电材料合成"
 tech_synthesis_of_conductive_materials_desc: "通过化学或物理方法，将具有导电性能的元素或化合物组合成新材料的过程，旨在提高材料的导电性、机械性能和稳定性。"
 tech_pet: "PET"
 tech_pet_desc: "聚对苯二甲酸乙二醇酯是一种热塑性聚酯材料，具有优异的机械强度、耐化学性和透明度，广泛应用于包装、纤维、薄膜和工程塑料等领域。"
 tech_eps: "EPS"
 tech_eps_desc: "聚苯乙烯泡沫是一种轻质、闭孔结构的泡沫塑料，具有优良的保温隔热、减震缓冲和隔音性能，常用于建筑、包装和冷藏等领域。"
 tech_glass_blowing: "玻璃吹制"
 tech_glass_blowing_desc: "一种古老的玻璃成型技术，通过吹气使熔融的玻璃膨胀并塑形，制作出各种精美的玻璃器皿和装饰品。"
 tech_rolling_method: "卷压法"
 tech_rolling_method_desc: "一种金属加工技术，通过辊压或模具将金属板材逐步弯曲、卷绕并压合成形，常用于制造管道、容器和其他复杂形状的金属制品。"
 tech_float_glass_process: "浮法玻璃制程"
 tech_float_glass_process_desc: "一种将玻璃加热到熔融后，倒入充满锡液的模具中，形成上下表面平整、厚度均匀的玻璃带的技术。"
 tech_melt_down_process: "熔融下拉制程"
 tech_melt_down_process_desc: "一种通过从熔融的玻璃池中连续下拉玻璃带，冷却固化后形成平整光滑的玻璃板的技术。"
 tech_electric_glass: "电玻璃"
 tech_electric_glass_desc: "将具有光电、热电、声光及磁光等功能的高技术玻璃产品应用于电子、微电子及光电子领域的技术。在智能手机、电视等电子设备中扮演着关键角色。"
 tech_basic_steel_smelting: "基本钢铁冶炼"
 tech_basic_steel_smelting_desc: "大战前基础炼钢技术，原料浪费较大，产量与质量都不高。"
 tech_mature_steel_smelting: "成熟钢铁冶炼"
 tech_mature_steel_smelting_desc: "冷战成熟炼钢技术，在元素配比、质量控制方面有了较大进展。"
 tech_open_hearth_steelmaking_method: "氧气顶吹转炉炼钢法"
 tech_open_hearth_steelmaking_method_desc: "通过从炉顶吹入高纯度氧气，与高温铁水发生氧化反应，快速去除杂质并提升钢水质量，速度快、质量优、成本低。美中不足的是会产生大量烟气，需进行净化。"
 tech_oxygen_top_blown_converter_steelmaking_method: "电渣重熔"
 tech_oxygen_top_blown_converter_steelmaking_method_desc: "电渣重熔钢是利用电流通过熔渣时产生的电阻热作为热源进行熔炼的方法。其目的是提高金属纯度，改善铸锭结晶。"
 tech_electric_arc_furnace_steelmaking_method: "电弧炉炼钢法"
 tech_electric_arc_furnace_steelmaking_method_desc: "利用电弧热效应加热炉料进行熔炼的炼钢方法，通过石墨电极向电弧炼钢炉内输入电能，以电极端部和炉料之间发生的电弧为热源进行炼钢。工艺灵活，质量高、炉渣和炉气均可调控氧化还原性。 "
 tech_modern_steelmaking_formula: "现代炼钢配方"
 tech_modern_steelmaking_formula_desc: "现代炼钢配方和炼钢技术的进步使得钢的质量更加稳定和可靠。"
 tech_engine_manufacturing: "引擎制造"
 tech_engine_manufacturing_desc: "将精密的机械部件、燃料系统、冷却系统、润滑系统及电子控制系统等集成组装，生产出能够转换能源为机械动力的复杂机械设备的过程。"
 tech_alloy_engine: "合金引擎"
 tech_alloy_engine_desc: "采用高强度、耐热、耐磨等特性优越的合金材料制成的发动机，旨在提供更高性能、更耐久和更高效的动力输出。"
 tech_electronic_control_engine: "电控发动机"
 tech_electronic_control_engine_desc: "通过集成电子控制单元精确管理燃油喷射、点火正时、排放控制等关键功能，实现高效能、低排放和良好驾驶体验的现代化动力装置。"
 tech_oil_electric_engine: "油电发动机"
 tech_oil_electric_engine_desc: "结合传统燃油发动机与电动机的混合动力系统，能够在不同驾驶条件下自动切换或联合工作，以优化燃油效率和减少排放。"
 tech_vehicle_motor: "车用电机"
 tech_vehicle_motor_desc: "专为汽车设计的电动驱动装置，负责将电能转换为机械能，驱动车辆行驶，高效、环保、噪音低。"
 railways: "火车"
 railways_desc: "在固定轨道上行驶的交通工具，通过车轮与轨道的相互作用，搭载乘客和货物进行长途、大容量的快速运输。"
 tech_train: "铁路"
 tech_train_desc: "首条蒸汽动力铁路被建造用于运送乘客，之后才用于工业用途。这种高效而快捷的旅行手段很快使得运河系统变得过时落后，有时这甚至发生在刚刚花费巨资完成运河的数年后。"
 tech_power_railway: "动力铁路"
 tech_power_railway_desc: "一种采用电力或内燃机等动力源驱动列车，在特设轨道上高速、安全、高效运行的铁路运输系统。"
 tech_electric_railway: "电力铁路"
 tech_electric_railway_desc: "利用电力作为动力源，通过接触网或第三轨等方式为列车供电，实现清洁、高效、环保的铁路运输方式。"
 tech_shipbuilding: "船舶制造"
 tech_shipbuilding_desc: "依据设计图纸和严格规范，采用金属或其他材料，通过焊接、组装等工艺流程，构建出具有浮力、载重能力和航行能力的水上交通工具的过程。"
 tech_ocean_going_freighters: "远洋货轮"
 tech_ocean_going_freighters_desc: "远洋货轮是指适于无限航区，可航行于远洋航线的货轮，最早于一战前发明。"
 tech_large_freighters: "大型货轮"
 tech_large_freighters_desc: "二战时期专门用于海上运输大宗货物的巨型船舶，具备巨大的载货量、长距离航行能力，世界运输的重要一环。"
 tech_special_ship_coatings: "特种船舶涂料"
 tech_special_ship_coatings_desc: "专为海洋环境设计的，具备超强防腐、防污、耐候等特殊性能，以保护船舶免受海水侵蚀、生物附着及恶劣天气影响的先进涂层材料。"
 tech_large_cargo_ships: "现代大型货轮"
 tech_large_cargo_ships_desc: "现代专门用于海上运输大宗货物的巨型船舶，具备巨大的载货量、长距离航行能力，世界运输的重要一环。"
 tech_modern_cruise_ships: "现代邮轮"
 tech_modern_cruise_ships_desc: "专为高效、大规模海上货物运输设计的先进船舶，结合了先进的物流技术与舒适的船员生活环境，确保货物安全快速送达的同时，也提升了航运的可持续性。"
 tech_household_appliance_manufacturing: "家电制造"
 tech_household_appliance_manufacturing_desc: "早期家电主要依赖于手工装配和简单机械化生产，产品功能单一，但为家庭生活带来了前所未有的便利与舒适。"
 tech_color_tv: "彩色电视"
 tech_color_tv_desc: "利用电子技术和色彩编码原理，将图像和声音信号转换为彩色画面和声音的家用视听设备，为观众带来丰富多彩的视觉享受。"
 tech_lcd_tv: "液晶电视"
 tech_lcd_tv_desc: "采用液晶显示技术，通过控制液晶分子的排列来显示图像的电视，具有轻薄、高清晰度、低能耗等优点，丰富了人们的娱乐生活。"
 tech_smart_tv: "智能电视"
 tech_smart_tv_desc: "内置智能操作系统，支持网络连接、应用下载、语音控制等功能的电视机，能够为用户提供个性化的内容推荐和丰富的互动体验。"
 tech_automobile_manufacturing: "汽车制造"
 tech_automobile_manufacturing_desc: "早期汽车制造是手工或小规模机械化生产的过程，初期的汽车设计简单，但标志着个人交通方式的革命性突破。"
 tech_automotive_radar: "汽车雷达"
 tech_automotive_radar_desc: "利用电磁波探测周围环境的电子设备，能够实时感知车辆周围的障碍物、行人等，为驾驶者提供安全预警和辅助驾驶信息。"
 tech_navigation_system: "导航系统"
 tech_navigation_system_desc: "利用卫星定位、地图数据和计算机技术，为车辆、行人等提供准确、实时导航和路径规划服务的系统。"
 tech_electronic_product: "电子产品"
 tech_electronic_product_desc: "早期电子产品以电子管、晶体管等元件为基础，功能相对简单，但开启了电子技术在通讯、计算等领域的应用先河。"
 tech_semiconductor: "半导体"
 tech_semiconductor_desc: "导电性能介于导体与绝缘体之间的材料，是现代电子技术的绝对基础，广泛应用于集成电路、计算机、通讯等领域。"
 tech_integrated_circuit: "集成电路"
 tech_integrated_circuit_desc: "将大量电子元件如晶体管、电阻、电容等集成在一个小型芯片上，实现特定电路功能的微型电子器件，预示着智能化时代的黎明。"
 tech_smart_chip: "智能芯片"
 tech_smart_chip_desc: "内置处理器、存储器、输入输出接口等功能的微型计算机系统，能够执行复杂计算、数据处理和智能控制任务。"
 tech_mobile_phone: "移动电话"
 tech_mobile_phone_desc: "便携式无线通信设备，允许用户随时随地进行语音通话、短信发送、上网浏览等通信活动，是现代人不可或缺的通讯工具。"
 tech_intelligent_mobile_phone: "智能手机"
 tech_intelligent_mobile_phone_desc: "具备操作系统、支持多种应用程序安装和运行的移动电话，集通讯、娱乐、办公等多种功能于一体，极大丰富了人们的日常生活。"
 tech_machine_building: "机器制造"
 tech_machine_building_desc: "运用机械工程技术，结合精密加工、自动化控制等手段，设计、生产各类机械设备和自动化生产线的过程，以提高生产效率、降低成本并满足多样化的生产需求。"
 tech_gantry_planer: "龙门刨床"
 tech_gantry_planer_desc: "一种重型机床，采用龙门式框架结构，配备刨削刀具，用于加工大型工件表面的平面、沟槽等，具有高精度和高效率的特点。"
 tech_numerical_control_machine: "数控机床"
 tech_numerical_control_machine_desc: "通过预先编好的程序控制机床的运动和加工过程，实现零件自动加工的机床，具有高精度、高效率、灵活性强的特点。"
 tech_adaptive_control_machine_tool: "自适控制机床"
 tech_adaptive_control_machine_tool_desc: "能够实时监测加工过程中的各种参数变化，并自动调整工作状态的先进机床，生产效率和良品率均较高。"
 tech_aircraft_manufacturing: "飞机制造"
 tech_aircraft_manufacturing_desc: "将设计蓝图转化为实体飞机的复杂过程，涉及精密加工、材料科学、系统工程等多个领域，确保飞机安全、高效地飞行。"
 tech_modern_aircraft: "现代飞机"
 tech_modern_aircraft_desc: "集成了先进材料、精密制造、智能控制和高效动力系统的高科技产品，普遍采用喷气式引擎，能够安全、快速、舒适地将乘客和货物送达全球各地。"
 tech_large_scale_equipment_manufacturing: "大型设备制造"
 tech_large_scale_equipment_manufacturing_desc: "运用先进材料、精密工艺和复杂系统工程，生产具有庞大体积、高精度和高性能要求的重型机械设备的过程。"
 tech_industrial_robot: "工业机器人"
 tech_industrial_robot_desc: "自动执行工作的机器装置，依靠自身的动力和控制能力实现各种复杂操作，广泛应用于工业自动化领域，提高生产效率和灵活性。"
 tech_intelligent_giant_production_equipment: "智能化巨型生产设备"
 tech_intelligent_giant_production_equipment_desc: "结合先进的人工智能、自动化技术和精密制造工艺的体积极为庞大的大型设备，能够自主完成黑盒式的复杂生产任务，实现高度智能化和自动化生产。"
 tech_first_generation_supercomputers: "第一代超级计算机"
 tech_first_generation_supercomputers_desc: "在计算机技术发展的早期阶段，为了应对大规模、复杂计算任务而设计制造的计算机。性能远超当时的普通计算机，采用了当时最先进的电子元件和并行处理技术，以实现更高的计算速度和更大的存储容量，但是体积极为庞大。作为世界上第一台超级计算机，CDC 6600由西蒙·克雷设计制造，于1963年问世。"
 tech_modern_supercomputers: "现代超级计算机"
 tech_modern_supercomputers_desc: "集合了数百万乃至数亿个处理器核心、采用高速互联网络和先进散热技术的巨型计算机系统，能够以前所未有的速度处理海量数据，解决复杂科学计算和工程模拟问题，现代科学进步仰仗于此。"
 tech_rocket_engineering: "火箭工程"
 tech_rocket_engineering_desc: "设计、制造和发射火箭以将卫星、探测器或人类送入太空，涉及高度复杂的机械、热力学、材料科学和航天动力学等领域的综合性技术工程。"
 tech_modern_rockets: "现代火箭"
 tech_modern_rockets_desc: "大量采用先进材料、燃料和控制系统，能够高效、可靠地将卫星、探测器或宇航员送入预定轨道或深空的火箭，载荷相比早期火箭有很大提升。"
 tech_semi_mechanized_mining: "半机械化矿业"
 tech_semi_mechanized_mining_desc: "采用部分机械设备辅助人工进行矿石开采、运输和加工的生产方式，以提高生产效率和降低劳动强度。"
 tech_coal_planer_and_segmented_support: "刨煤机和节式支架"
 tech_coal_planer_and_segmented_support_desc: "煤矿开采中的关键设备，刨煤机用于连续切割煤层，而节式支架则提供支撑和稳定，保障作业安全和生产效率。"
 tech_electrohydraulic_control_hydraulic_support: "电液控液压支架"
 tech_electrohydraulic_control_hydraulic_support_desc: "煤矿综采工作面的重要支护设备，通过电液控制系统实现支架的自动升降、推移和调节，提高支护效率和作业安全性。"
 tech_small_agricultural_machinery: "小型农业机械"
 tech_small_agricultural_machinery_desc: "专为崎岖地形中的小规模农田作业设计的轻便、灵活、高效的机械设备，如小型拖拉机、播种机、收割机等，有助于减轻农民劳动强度，提高农业生产效率。"
 tech_popularization_of_tractors: "拖拉机普及"
 tech_popularization_of_tractors_desc: "随着工业部门的发展，拖拉机普遍进入到了农民的工作中，永远的改变了从前面朝黄土背朝天的农业形式。"
 tech_light_industrial_tools: "轻工业工具"
 tech_light_industrial_tools_desc: "用于轻工业生产过程中，辅助完成产品加工、装配、检测等工序的各类专业化工具。"
 tech_light_industrial_machinery: "轻工业机械"
 tech_light_industrial_machinery_desc: "专门为轻工业生产设计的机械，涵盖纺织、食品、造纸、日化等多个领域，用于实现原料加工、产品制造、包装运输等自动化、高效化生产流程。"
 tech_light_industrial_equipment: "轻工业设备"
 tech_light_industrial_equipment_desc: "轻工业生产中不可或缺的一环，包括各种集成化生产线、加工机械、包装机械等，用于提高生产效率、保障产品质量和满足市场需求。"
 tech_heavy_industrial_tools: "重工业工具"
 tech_heavy_industrial_tools_desc: "重工业工具是专用于重型工业生产和加工过程中，具有高强度、高耐用性和高精度等特点的各类专业化工具。"
 tech_heavy_industrial_machinery: "重工业机械"
 tech_heavy_industrial_machinery_desc: "专门用于重型工业生产的机械，如矿山机械、重型机床等，具有庞大的体积、强大的动力和高效的生产能力，是重工业发展的基石。"
 tech_heavy_industrial_equipment: "重工业设备"
 tech_heavy_industrial_equipment_desc: "支撑重型工业生产的关键设施，包括冶金炉、起重机、挖掘机等，它们具有高强度、高精度和高效能的特点，用于原材料加工、产品制造和基础设施建设等重工业领域。"
 tech_chemical_tools: "化工工具"
 tech_chemical_tools_desc: "化工工具是指在化学工业中用于混合、搅拌、分离、过滤、测量等工艺操作的设备和器具。"
 tech_chemical_machinery: "化工机械"
 tech_chemical_machinery_desc: "化学工业中用于物料混合、反应、分离、提纯、输送等工艺过程的机械，具有耐腐蚀、耐高温、高压及密封性好等特点。"
 tech_chemical_equipment: "化工设备"
 tech_chemical_equipment_desc: "化学工业中用于化学反应、物质分离、能量转换等工艺过程的各类大型装置，包括反应器、分离器、换热器、塔器等，对化学品的生产至关重要。"
 tech_complex_industrial_machinery: "复杂工业机械"
 tech_complex_industrial_machinery_desc: "高度集成化、现代化的高端制造装备，运用先进的材料科学、信息技术和自动化技术，实现高效、精准、灵活的工业生产，现代制造业的命脉。"
 tech_complex_industrial_equipment: "复杂工业设备"
 tech_complex_industrial_equipment_desc: "融合了最新科技成果的集成化生产设备，具备高度自动化、智能化的特点，能够高效、精准地完成复杂生产任务。"
 tech_cutting_edge_industrial_equipment: "尖端工业设备"
 tech_cutting_edge_industrial_equipment_desc: "近未来工业设备融合最前沿的人工智能自主判断技术、物联网和材料技术等，只要有资源，这将会是生产力的猛兽。"
 tech_ammunition_manufacturing: "弹药制造"
 tech_ammunition_manufacturing_desc: "根据战争需求，大规模地生产包括炸弹、炮弹、子弹等各类弹药的过程。"
 tech_large_caliber_bullets: "大口径子弹"
 tech_large_caliber_bullets_desc: "大口径子弹是指直径较大、通常用于重型枪械或火炮，具有强大杀伤力和远距离射击能力的弹药。"
 tech_high_energy_bullet: "高能子弹"
 tech_high_energy_bullet_desc: "高能子弹是指装有高效能炸药或特殊材料，能在击中目标时释放巨大能量，产生强烈杀伤和破坏效果的子弹。"
 tech_intelligent_ammunition: "智能化弹药"
 tech_intelligent_ammunition_desc: "智能化弹药是指集成了传感器、制导与控制技术等智能化元素，能够自主探测、识别目标并精确打击的现代弹药。"
 tech_weapon_manufacturing: "武器制造"
 tech_weapon_manufacturing_desc: "为了满足战争需求，大规模地生产各类枪械、火炮、坦克、军舰、飞机等武器装备的过程。"
 tech_assault_rifles: "突击步枪"
 tech_assault_rifles_desc: "结合了步枪的杀伤力和射程以及冲锋枪的射速和便携性的自动步枪，是现代步兵的基本武器。"
 tech_modularized_light_weapons: "模块化轻武器"
 tech_modularized_light_weapons_desc: "将枪械等轻武器划分为多个独立且可互换的模块，通过组合不同模块来满足多样化战术需求，提高作战效能和后勤保障的灵活性。"
 tech_intelligent_weapons: "智能化武器"
 tech_intelligent_weapons_desc: "智能化武器是指采用人工智能技术，能够自主或按照人的意志完成侦察、搜索、瞄准、攻击等多种军事任务的高技术武器装备。"
 tech_world_war_ii_military_ships: "二战军用舰船"
 tech_world_war_ii_military_ships_desc: "各国海军在二战期间广泛使用的水面和水下战斗舰艇，代表为战列舰、木甲板航空母舰、火炮巡洋舰、早期潜艇等。"
 tech_cold_war_naval_ships: "冷战海军舰船"
 tech_cold_war_naval_ships_desc: "各国海军在冷战期间广泛使用的水面和水下战斗舰艇，代表为导弹巡洋舰，导弹驱逐舰，核动力潜艇等。"
 tech_informationized_naval_ships: "信息化海军舰船"
 tech_informationized_naval_ships_desc: "各国海军在千禧年后广泛使用的水面和水下战斗舰艇，代表为核动力航母，濒海战斗舰，盾舰等。"
 tech_new_informationized_naval_ships: "近未来海军舰船"
 tech_new_informationized_naval_ships_desc: "各国海军在近未来广泛使用的水面和水下战斗舰艇，代表为空天母舰，电磁炮击舰，激光拦截舰等。"
 tech_world_war_ii_artillery: "二战火炮"
 tech_world_war_ii_artillery_desc: "各国在二战期间广泛使用的大口径射击武器，包括反坦克炮、步兵炮、加农炮、榴弹炮等多种类型。"
 tech_informationized_long_range_strike_system: "信息化远程打击系统"
 tech_informationized_long_range_strike_system_desc: "利用初代信息网络和精确制导技术，实现对远距离目标进行高精度、高效率打击的作战系统。"
 tech_intelligent_firepower_strike_system: "智能化火力打击系统"
 tech_intelligent_firepower_strike_system_desc: "集成了现代通信、人工智能、精确制导等先进技术，能够自主或按照人的意志进行高精度、高效率火力打击的智能化作战系统。"
 tech_the_return_of_the_artillery_era: "大炮时代归来"
 tech_the_return_of_the_artillery_era_desc: "象征着在现代化战争中，传统的大炮火力打击系统经过智能化、信息化升级后，重新焕发出强大的战斗力，成为现代战场上的重要力量。"
 tech_riveted_homogeneous_armor: "铆接均质装甲"
 tech_riveted_homogeneous_armor_desc: "铆接均质装甲主要应用于早期的坦克以及二战中日本的小型坦克。"
 tech_extra_armour: "早期附加装甲"
 tech_extra_armour_desc: "早期附加装甲包含普通均质钢装甲等。"
 tech_excellent_bulletproof_appearance: "优良避弹外形"
 tech_excellent_bulletproof_appearance_desc: "装甲带经过严格设计与处理，具有良好的防弹外形。"
 tech_composite_armor: "复合装甲"
 tech_composite_armor_desc: "由两层或多层性能不同的材料组成的装甲。"
 tech_explosive_anti_armor: "爆炸反应装甲"
 tech_explosive_anti_armor_desc: "爆炸反应装甲为坦克提供了令人难以置信的防护。"
 tech_ordinary_cannon_tank_gun: "普通加农坦克炮"
 tech_ordinary_cannon_tank_gun_desc: "装在坦克上的加农炮，身管长与口径之比较大，装药号数较少，适用于低射界射击。"
 tech_armor_piercing_bullet: "穿甲弹"
 tech_armor_piercing_bullet_desc: "穿甲弹是一种典型的动能弹，依靠弹丸强度、重量和速度穿透装甲的炮弹，现代穿甲弹弹头很尖，弹体细长，采用钢合金、贫铀合金等制成，强度极高。"
 tech_armor_piercing_shell: "破甲弹"
 tech_armor_piercing_shell_desc: "随着主战坦克都相继装备低压滑膛炮和更牢固的装甲，破甲弹应运而生。破甲弹是以聚能装药爆炸后形成的金属射流穿透装甲的炸弹。也称聚能装药破甲弹，是反坦克的主要弹种之一。"
 tech_hesh: "碎甲弹"
 tech_hesh_desc: "碎甲弹是一战时的反战舰弹药，用来破坏坚固的战列舰。由于它具有一定的反装甲作用，而又可以有效的杀伤人员，后来被作为一种多用途弹装备坦克。"
 tech_high_pressure_smoothbore_gun: "高压滑膛炮"
 tech_high_pressure_smoothbore_gun_desc: "高压滑膛炮，就是炮管内没有膛线，口径大，但是可以发射炮射式导弹。"
 tech_depleted_uranium: "贫铀弹"
 tech_depleted_uranium_desc: "贫铀弹是以含有铀238的硬质合金为主要原料制成的炮弹和枪弹。"
 tech_world_war_ii_tanks: "二战坦克"
 tech_world_war_ii_tanks_desc: "在第二次世界大战期间发展壮大的陆地作战车辆，由于经验不足，此时的坦克并没有形成统一的设计思想，质量参差不齐。"
 tech_laser_ranging_fire_control_system: "激光测距火控系统"
 tech_laser_ranging_fire_control_system_desc: "集成了激光测距技术与火控计算机等组件的射击系统。"
 tech_automatic_sensing_system: "自动传感系统"
 tech_automatic_sensing_system_desc: "坦克系统的重要组成部分，提升了态势感知能力。"
 tech_intelligent_unmanned_turrets: "智能化无人炮塔"
 tech_intelligent_unmanned_turrets_desc: "采用自动装弹、武器遥控等技术，实现了炮塔的无人化操作，提升了安全性。"
 tech_guerrilla_warfare: "游击战"
 tech_guerrilla_warfare_desc: "高度机动、灵活的非正规作战方式，以袭击为主要手段，以弱胜强的典范。"
 tech_nine_principles_of_battles: "9条战役原则"
 tech_nine_principles_of_battles_desc: "正确决策、优势兵力、出奇制胜、主动灵活、密切协同、纵深立体、全面保障、信息主导、持续作战。"
 tech_modernized_depth: "现代化大纵深"
 tech_modernized_depth_desc: "利用先进武器装备和信息技术，在广阔战场上实施多层次、全方位的纵深打击和防御的战术体系。"
 tech_battle_theory: "战役学理论"
 tech_battle_theory_desc: "研究战役规律、指导战役实践，涵盖战役准备、实施及基本原则，与战略学、战术学等相互关联，为现代战争胜利提供理论支撑的学科。"
 tech_air_ground_integrated_combat_system: "空地一体化作战体系"
 tech_air_ground_integrated_combat_system_desc: "综合运用陆军、空军（有时包括海军）力量，通过先进的信息技术和武器装备，实现空地协同作战的高效、灵活和全面的作战体系。"
 tech_informationized_synthetic_tactical_corps: "信息化合成战术兵团"
 tech_informationized_synthetic_tactical_corps_desc: "以信息化为核心，将多种兵种高度融合，具备快速反应、灵活机动和高效协同作战能力的战术兵团。"
 tech_navy_concept: "海军概念"
 tech_navy_concept_desc: "海军是一个主要在海洋方向上进行作战任务的战略性军种，以舰艇部队和海军航空兵为主体，担负海上作战任务。"
 tech_world_war_ii_naval_strategic_thinking: "二战海军战略思想"
 tech_world_war_ii_naval_strategic_thinking_desc: "以夺取制海权为核心，通过海上破交、护航、登陆等多种战术手段，实现海上力量的优势，以保障国家海上利益。"
 tech_sea_power_theory: "海权论"
 tech_sea_power_theory_desc: "由马汉创造的一种强调海上力量的军事理论。该理论认为，控制了海洋就能控制大陆，夺取制海权的关键是拥有能够进行海上封锁和决战的海军力量。"
 tech_ocean_strategy: "远洋战略"
 tech_ocean_strategy_desc: "海军在远离本国海区实施进攻或防御的总体方略，旨在保护国家海上利益和维护海上安全。"
 tech_nearshore_defense_and_anti_access_strategy: "近海防御及反介入战略"
 tech_nearshore_defense_and_anti_access_strategy_desc: "依托陆基反舰导弹和陆基航空兵的，旨在保护国家近海安全、阻止外部势力介入的军事战略。"
 tech_informationized_modern_naval_thinking: "信息化现代海军思想"
 tech_informationized_modern_naval_thinking_desc: "将信息技术与海军建设深度融合，以提升海军作战效能和战略反应能力的现代军事战略思维。"
 tech_efficient_supply: "高效补给"
 tech_efficient_supply_desc: "在军事行动中，通过快速、准确地提供所需物资和人员支持，以确保部队的战斗力和持续作战能力。"
 tech_sugar_supply: "糖分补给"
 tech_sugar_supply_desc: "战争中的"甜头"总是让人欲罢不能。"
 tech_food_supply: "食品补给"
 tech_food_supply_desc: "不吃饱怎么打仗？"
 tech_tobacco_supply: "烟草补给"
 tech_tobacco_supply_desc: "抽一根放松一下。"
 tech_liquor_supply: "烈酒补给"
 tech_liquor_supply_desc: "暂时忘却这该死的战争。"
 tech_drug_supply: "药物补给"
 tech_drug_supply_desc: "我觉得我还能再抢救一下。"
 tech_individual_system: "单兵系统"
 tech_individual_system_desc: "又称单兵无线集群系统，是利用通信技术进行无线图像传输的单兵无线监控系统。"
 tech_motorized_reconnaissance: "机动化侦查"
 tech_motorized_reconnaissance_desc: "利用机动车辆等装备，在战场上进行快速、灵活的侦察活动，以获取敌方情报和战场信息。"
 tech_aerial_reconnaissance: "空中侦查"
 tech_aerial_reconnaissance_desc: "指用飞机、气球、卫星等在空中实施的侦察，是获取敌人纵深内情况的重要侦察手段。"
 tech_advanced_communication_equipment: "先进通信设备"
 tech_advanced_communication_equipment_desc: "采用高新技术，具备高效、隐蔽、可靠通信能力的军事设备。"
 tech_uav_reconnaissance: "无人机侦查"
 tech_uav_reconnaissance_desc: "使用无人驾驶侦察机或搭载侦察设备的其他无人机进行的侦察，廉价、隐蔽且高效。"
 tech_auxiliary_equipment: "辅助装备"
 tech_auxiliary_equipment_desc: "用于实施和保障军事行动的除主要武器系统外的其他军事技术器材。"
 tech_anti_tank_and_anti_aircraft_equipment_equipment: "反坦克与防空装备"
 tech_anti_tank_and_anti_aircraft_equipment_equipment_desc: "包括反坦克导弹、防空导弹、高射炮等多种类型，用于打击敌方坦克和空中目标。"
 tech_javelin_missiles: "标枪导弹"
 tech_javelin_missiles_desc: "20世纪90年代美国研制的一种便携式红外单兵反坦克导弹，也称为FGM-148反坦克导弹。"
 tech_drone_strikes: "无人机袭击"
 tech_drone_strikes_desc: "无人机袭击是指使用无人机作为攻击平台，对特定目标进行打击或破坏的行为。"
 tech_military_logistics: "军事后勤学"
 tech_military_logistics_desc: "军事后勤学是研究军事后勤的理论并揭示其活动规律的学科。"
 tech_antibiotics: "军用抗生素"
 tech_antibiotics_desc: "抗生素是用来治疗或预防由细菌引起的感染的药物。"
 tech_targeted_drugs: "靶向药物"
 tech_targeted_drugs_desc: "靶向药物是能够精准定位于身体内特定的病变部位并释放有效药物成分以杀伤病变区域细胞的抗癌药物。靶向药物现已成为医药研发热点和治疗人类和农作物恶性疾病的重要武器。"
 tech_trenches: "堑壕工事"
 tech_trenches_desc: "堑壕工事是城市或城镇周边沿阵地正面挖掘的供战斗用的防御工事。"
 tech_concrete_fortifications: "混凝土工事"
 tech_concrete_fortifications_desc: "混凝土材料构筑的防御工事。"
 tech_modern_military_defense_system: "现代军事防御体系"
 tech_modern_military_defense_system_desc: "现代军事防御体系是由兵力部署、阵地编成、火力配系、障碍物配系、战斗保障和后勤保障等防御要素组成的有机整体。"
 tech_truck_transport: "卡车运输"
 tech_truck_transport_desc: "卡车运输是一种重要的货物运输方式，具有高效、灵活和适应性强等特点。"
 tech_rail_transport: "铁路运输"
 tech_rail_transport_desc: "铁路运输是使用铁路列车大量运送旅客和货物的一种重要运输方式。"
 tech_helicopter_transport: "航空运输"
 tech_helicopter_transport_desc: "航空运输是指使用飞机进行物资、人员等的快速运输方式。
 tech_mobile_infantry: "机动步兵"
 tech_mobile_infantry_desc: "是指搭乘车辆实施机动和作战的兵种。"
 tech_mechanized_infantry: "机械化步兵"
 tech_mechanized_infantry_desc: "机械化步兵是以步兵为主体、以坦克和装甲输送车或步兵战车为机动和突击手段的兵种。"
 tech_combined_arms_army: "综合兵种军"
 tech_combined_arms_army_desc: "综合兵种军是由多个不同兵种组成的，具有综合作战能力的军队单位。"
 tech_advanced_armored_battalion: "高级装甲营"
 tech_advanced_armored_battalion_desc: "高级装甲营是装备先进坦克和装甲车辆的装甲部队编制，具有强大的火力和机动能力。"
 tech_mobile_team: "机动战队"
 tech_mobile_team_desc: "重点组建的高机动，强侦察的现代作战单位。"
 tech_field_artillery: "野战炮"
 tech_mobile_team_desc: "野战炮是指在野外战斗的可移动的炮，区别于舰炮、坦克炮或列车炮等。"
 tech_self_propelled_artillery: "自行火炮"
 tech_self_propelled_artillery_desc: "自行火炮是同车辆底盘构成一体自身能运动的火炮。"
 tech_multiple_rocket_launchers: "多管火箭炮"
 tech_multiple_rocket_launchers_desc: "多管火箭炮是炮兵装备的火箭弹射装置，具有多发联装式特点，可短时间发射大量火箭弹以命中大范围目标。"
 tech_digital_artillery: "数字化火炮"
 tech_digital_artillery_desc: "数字化火炮是指配备了数字化火控系统的火炮，实现了从目标侦察到火炮瞄准全程一体化、数字化、自动化。"
 tech_railgun: "轨道炮"
 tech_railgun_desc: "轨道炮是利用电磁发射技术制成的一种先进的动能杀伤武器。"
 tech_biplane: "双翼飞机"
 tech_biplane_desc: "双翼飞机是早期一种拥有上下并列配置的两副机翼的飞机。"
 tech_fighter_aircraft: "单翼螺旋桨战斗机"
 tech_fighter_aircraft_desc: "采用单翼设计和螺旋桨驱动的战斗机类型。"
 tech_jet_fighter_aircraft: "喷气战斗机"
 tech_jet_fighter_aircraft_desc: "喷气战斗机是指使用喷气式发动机作为动力来源的战斗机，具有高速、高机动性和高作战能力的特点。"
 tech_combat_drones: "战斗无人机"
 tech_combat_drones_desc: "战斗无人机是一种由无线电遥控设备或由自身程序控制装置操纵的、执行作战任务的非载人飞行器。"
 tech_flying_fortress: "空中堡垒"
 tech_flying_fortress_desc: "近未来空中的巨无霸，配备巨量的机库，与区域防空系统。"
 tech_destroyer: "驱逐舰"
 tech_destroyer_desc: "一种多用途的军舰，是海军舰队中突击力较强的中型军舰之一。"
 tech_submarine: "潜艇"
 tech_submarine_desc: "早期初步运用了潜航技术的舰艇，航程短，隐蔽性差。"
 tech_cold_war_submarine: "冷战潜艇"
 tech_cold_war_submarine_desc: "运用了冷战最新的导弹技术、电力技术等制造的进阶潜艇，职能逐步由破交转为导弹攻击。"
 tech_modern_submarine: "现代潜艇"
 tech_modern_submarine_desc: "现代潜艇是具备高度隐蔽性、先进探测与导航设备、强大武器系统和优异机动性能的水下作战舰艇。"
 tech_stealth_submarine: "隐形潜艇"
 tech_stealth_submarine_desc: "近未来真正的海底猎手，核引擎以及巨量的补给可以让这个怪物在大洋中潜伏数年。"
 tech_dreadnought: "无畏舰"
 tech_dreadnought_desc: "在19世纪末至20世纪初出现的大型装甲战舰，以装备大口径主炮、厚重的装甲和强大的蒸汽轮机动力为特点，标志着现代海军战舰发展的新阶段。"
 tech_battleship: "战列舰"
 tech_battleship_desc: "以大口径火炮攻击与厚重装甲防护为主的高吨位海军作战舰艇，又称战斗舰、主力舰，是巨舰大炮主义的象征。"
 tech_missile_cruiser: "导弹巡洋舰"
 tech_missile_cruiser_desc: "导弹巡洋舰是以导弹为主要舰载武器的大型军舰，拥有强大的火力、较高的航速和良好的装甲防护，可执行远程防空、反舰和反潜等多种任务，通常是舰队中的指挥舰。"
 tech_battlecruiser: "现代化导弹巡洋舰"
 tech_battlecruiser_desc: "以导弹、舰炮、近防武器系统、反潜武器和电子战设备为主要舰载武器的现代化巡洋舰。"
 tech_littoral_combat_ship: "信息化导弹巡洋舰"
 tech_littoral_combat_ship_desc: "集成了先进信息处理、传输和指挥控制系统的导弹巡洋舰。"
 tech_aircraft_carrier: "航母"
 tech_aircraft_carrier_desc: "二战航母简而言之就是二战时期各国建造的主要用于搭载和起降舰载机进行作战的大型军舰。"
 tech_light_aircraft_carrier: "轻型航母"
 tech_light_aircraft_carrier_desc: "轻型舰队母舰，与中型及重型航空母舰相比，具有排水量较小、载机量较低、造价较低等特点。"
 tech_fleet_carrier: "舰队航母"
 tech_fleet_carrier_desc: "舰队航母是指跟随一国海军舰队行动的航空母舰，它拥有相对完善的装甲防护、更高的速度和更多的载机量，是海军舰队中的重要力量。"
 tech_modern_aircraft_carrier: "现代航母"
 tech_modern_aircraft_carrier_desc: "世界各国海军里体型最大、吨位最重的超大型军用舰种，被视为强国海军水面作战力量的核心，也是一个国家综合国力的象征。"
 tech_nuclear_powered_aircraft_carrier: "核动力航母"
 tech_nuclear_powered_aircraft_carrier_desc: "以核反应堆为动力装置的航空母舰。"
 tech_basic_military_concept: "基本军队概念"
 tech_basic_military_concept_desc: "军队是国家或政治集团为准备和实施战争而建立的正规武装组织。"
 tech_professional_army: "职业军队"
 tech_professional_army_desc: "职业军队是指没有义务兵，所招士兵全部由自愿加入并有一定相关技能，以工薪制给予报酬的军事力量。"
 tech_massive_conscription: "大规模征兵"
 tech_massive_conscription_desc: "大规模征兵是指国家或政治集团为了增强军事力量，在短时间内招募大量新兵入伍的行为。"
 tech_political_army: "政治化军队"
 tech_political_army_desc: "政治化军队是指高度重视政治工作，强调军队在政治上的坚定立场和忠诚信仰的军队。"
 tech_conscription_propaganda: "征兵宣传"
 tech_conscription_propaganda_desc: "征兵宣传是鼓励适龄青年积极报名参军，增强国防意识的活动。"
 tech_uranium_mining_and_refining: "铀矿开采与精炼"
 tech_uranium_mining_and_refining_desc: "铀矿开采是将地下自然富集的铀矿采出，精炼则是提取并纯化铀元素的过程。"
 tech_enrichment_and_purification_of_deuterium_and_tritium: "氘与氚的浓缩与提纯"
 tech_enrichment_and_purification_of_deuterium_and_tritium_desc: "氘的浓缩与提纯主要采用蒸馏法，通过液氢精馏技术分离；氚的浓缩与提纯则利用反应堆中子生产，再通过热扩散等方法进行富集。"
 tech_uranium_refining_by_centrifuge: "离心法铀精炼"
 tech_uranium_refining_by_centrifuge_desc: "离心法铀精炼是将六氟化铀气体注入高速离心机，利用不同质量铀同位素在旋转离心力作用下的差异进行分离，从而得到铀-235富集产品的方法。"
 tech_nuclear_power_technology: "核电技术"
 tech_nuclear_power_technology_desc: "核电技术是利用核裂变或核聚变反应所释放的能量发电的技术。"
 tech_advanced_nuclear_power_technology: "先进核电技术"
 tech_advanced_nuclear_power_technology_desc: "先进核电技术是指采用更安全、更高效、更环保的核裂反应发电的技术。"
 tech_modern_nuclear_power_technology: "现代核电技术"
 tech_modern_nuclear_power_technology_desc: "现代核电技术是利用核裂变反应所释放的能量进行发电的高效、清洁技术。"
 tech_nuclear_weapons: "核武器"
 tech_nuclear_weapons_desc: "核武器是利用能自持进行的原子核裂变或聚变反应瞬时释放的巨大能量，产生爆炸，实施大规模杀伤破坏的武器。"
 tech_hydrogen_bombs: "氢弹"
 tech_hydrogen_bombs_desc: "氢弹是利用核裂变装置爆炸能量引发氘、氚等轻核的自持聚变反应，瞬时释放巨大能量的核武器，又称聚变弹或热核弹。"
 tech_tactical_nuclear_weapons: "战术核武器"
 tech_tactical_nuclear_weapons_desc: "战术核武器是主要用于直接支援陆、海、空战场作战，打击敌方战役战术纵深内重要目标的核武器。"
 tech_marxism: "马克思列宁主义"
 tech_marxism_desc: "马克思列宁主义是马克思主义和列宁主义的总称，是列宁发展起来的马克思主义。"
 tech_critical_school: "批判学派"
 tech_critical_school_desc: "批判学派是坚持批判观和方法进行研究的学派，主要对现行的社会制度和传播秩序进行理性思辨的批判。"
 tech_neo_marxism: "新马克思主义"
 tech_neo_marxism_desc: "新马克思主义是尝试重新检讨或修正马克思古典理念，但仍坚持马克思主义某些原则的理论。"
 tech_capital_in_the_21st_century: "《21世纪资本论》"
 tech_capital_in_the_21st_century_desc: "法国经济学家托马斯·皮凯蒂所著的一部经济学著作,对自18世纪工业革命至今的财富分配数据进行了深入分析，认为不加制约的资本主义导致了财富不平等的加剧，自由市场经济并不能完全解决财富分配不平等的问题。"
 tech_positivism: "实证主义"
 tech_positivism_desc: "实证主义是强调感觉经验、排斥形而上学传统的西方哲学派别，产生于19世纪30至40年代的法国和英国，创始人为法国哲学家孔德。"
 tech_empirical_school: "经验学派"
 tech_empirical_school_desc: "经验学派是主张从经验事实出发，运用经验性方法研究传播现象的学派。"
 tech_media_environment_school: "媒介环境学派"
 tech_media_environment_school_desc: "媒介环境学派是传播学三大学派之一，产生于20世纪60年代，是把媒介当作环境的研究学派。"
 tech_marxist_political_economics: "马克思主义政治经济学"
 tech_marxist_political_economics_desc: "马克思主义政治经济学是马克思主义理论体系中的重要组成部分，它主要通过分析资本主义制度的内部矛盾和演变规律，揭示经济基础对于政治、社会和文化的决定作用。"
 tech_classical_political_economy: "古典政治经济学"
 tech_classical_political_economy_desc: "即资产阶级政治经济学基本理论，是经济学中其他理论推导的出发点。"
 tech_economics_foundations: "资本论"
 tech_economics_foundations_desc: "即马克思主义政治经济学基本理论，是经济学中其他理论推导的出发点。"
 tech_keynesianism: "凯恩斯主义"
 tech_keynesianism_desc: "凯恩斯主义是以英国经济学家约翰·梅纳德·凯恩斯的名字命名的经济理论，主张国家采用扩张性经济政策，通过增加需求促进经济增长。"
 tech_phillips_curve_and_is_lm_model: "菲利普斯曲线与IS-LM模型"
 tech_phillips_curve_and_is_lm_model_desc: "菲利普斯曲线表明失业与通货膨胀存在一种交替关系，即通货膨胀率高时，失业率低；通货膨胀率低时，失业率高。
IS-LM模型则是描述产品市场和货币市场之间相互联系的理论结构。 "
 tech_new_keynesianism: "新凯恩斯主义"
 tech_new_keynesianism_desc: "新凯恩斯主义是对原凯恩斯主义理论的补充和修正，旨在解释工资和价格粘性等市场不完全竞争现象。"
 tech_modern_macroeconomics: "现代宏观经济学"
 tech_modern_macroeconomics_desc: "任何货币不管是实体的还是虚拟的都应该得到全面的考察。既然可以将全球所有市场都考虑在内，为何还只考虑一个单一市场在未来五年的表现如何？"
 tech_general_equilibrium_theory: "一般均衡理论"
 tech_general_equilibrium_theory_desc: "该理论着眼于整个经济，分析商品和生产要素的价格及供求量的决定，认为各种经济现象均可表现为数量关系，且这些数量之间存在着非常密切的联系。"
 tech_behavioral_economics: "行为经济学"
 tech_behavioral_economics_desc: "一门研究个人和机构经济决策过程的学科，它将心理学、社会学、人类学等学科的理论观点与经济学理论相结合，探讨人们经济行为背后的心理、社会和人类学因素如何影响经济决策和行为。"
 tech_neoclassical_economics: "新古典经济学"
 tech_neoclassical_economics_desc: "新古典经济学是现代经济学中一种重要的经济学思想，它强调市场经济的机制和个人理性行为，并提供了对价格、收入分配和资源配置等一系列经济问题的分析框架。"
 tech_austrian_school: "奥地利学派"
 tech_austrian_school_desc: "奥地利学派是边际学派中最主要的学派，产生于19世纪70年代，流行于19世纪末20世纪初，也被称为维也纳学派或心理学派。"
 tech_monetarism: "货币主义"
 tech_monetarism_desc: "货币主义是20世纪50年代末至60年代在美国兴起的一个经济学流派，又称货币学派。"
 tech_solow_model: "索洛模型"
 tech_solow_model_desc: "索洛模型，又称新古典经济增长模型或外生经济增长模型，是经济学家罗伯特·索洛于1957年提出的经济增长模型。"
 tech_second_generation_neoclassical_economics: "第二代新古典经济学"
 tech_second_generation_neoclassical_economics_desc: "第二代新古典经济学是宏观经济学派之一，也被称为第二代新古典主义宏观经济学或新兴古典经济学派，它强调总体经济学必须立足于个体经济学的基础，主张理性预期。"
 tech_endogenous_growth_theory: "内生增长理论"
 tech_endogenous_growth_theory_desc: "内生增长理论是产生于20世纪80年代中期的一个西方宏观经济理论分支，其核心思想是认为经济能够不依赖外力推动实现持续增长，内生的技术进步是保证经济持续增长的决定因素。"
 tech_supply_side_school: "供给学派"
 tech_supply_side_school_desc: "供给学派亦称“供给经济学”、“供给方面经济学”，是20世纪70年代出现于美国的一个经济学流派，着重从供给方面考察经济现状和寻求对策。"
 tech_chicago_school: "芝加哥学派"
 tech_chicago_school_desc: "芝加哥学派是许多不同学科学派的统称，因这些学派都源自于芝加哥大学（或芝加哥市），故名芝加哥学派，主要包括芝加哥经济学派、芝加哥建筑学派、芝加哥传播学派等。"
 tech_neoliberalism: "新自由主义"
 tech_neoliberalism_desc: "新自由主义是一种经济和政治学思潮，它反对国家和政府对经济的不必要干预，强调自由市场的重要性，并主张私有化、自由贸易和全球化。"
 tech_scientific_management_theory: "科学管理理论"
 tech_scientific_management_theory_desc: "科学管理理论是指用科学的原则和方法，客观地解决管理问题所形成的理论。"
 tech_14_management_principles: "14条管理原则"
 tech_14_management_principles_desc: "法约尔提出的14条管理原则包括：
1.分工；2. 职权与职责；3. 纪律；4. 统一指挥；5. 统一领导；6. 个人利益服从整体利益；7. 报酬合理；8. 集权与分权；9. 等级链；10. 秩序；11. 公平；12. 保持人员的稳定；13. 首创精神；14. 团结精神。"
 tech_behavioral_science_school: "行为科学学派"
 tech_behavioral_science_school_desc: "行为科学学派是在梅奥开创的人际关系学说的基础上发展起来的学派，它以人的行为及其产生的原因作为研究对象，主要代表人物有马斯洛、梅奥、赫茨伯格等。"
 tech_strategic_management: "战略管理"
 tech_strategic_management_desc: "战略管理是指对一个企业或组织在一定时期的全局的、长远的发展方向、目标、任务和政策，以及资源调配做出的决策和管理艺术，包括战略制定、战略实施、战略评价和战略控制等过程。"
 tech_listen_to_the_master_of_masters: "听大师中的大师说"
 tech_listen_to_the_master_of_masters_desc: "“听大师中的大师说”不仅是对这些卓越人物智慧的尊重和认可，也是寻求学习、提升自我认知的一种途径。通过倾听他们的言论，我们可以汲取宝贵的经验和启示，为自己的成长和发展提供有力的支持。"
 tech_modern_management: "现代管理学"
 tech_modern_management_desc: "现代管理学是研究现代社会条件下社会管理活动的各种现象、一般规律和一般方法的科学。它的基础理论涉及辩证唯物论、系统科学方法论、人学理论、经济科学以及定量分析理论等多个方面。"
 tech_existentialism: "存在主义"
 tech_existentialism_desc: "存在主义是一种主要强调人的存在、个体经验、自由选择和责任的哲学流派。"
 tech_modernism: "现代主义"
 tech_modernism_desc: "现代主义是20世纪前卫反叛的各种文艺思潮，具有唯心、荒诞、抽象、虚无、超脱等特点，并体现在哲学、文学、美术、戏剧、建筑等多个领域。"
 human_rights: "公民主义"
 human_rights_desc: "接受全民享有普遍、不可剥夺权利的理念，将新观念引入国家的社会和政治领域。"
 feminism: "新女权主义"
 feminism_desc: "新女权主义是一种关于推进妇女社会、经济和政治平等的意识形态。女权主义者认为，女性应该在拥有财产、工作和参与政治上拥有与男性相同的法定权利。"
 tech_postmodernism: "后现代主义"
 tech_postmodernism_desc: "后现代主义是20世纪六七十年代在西方出现的具有重大影响的社会文化思潮，涉及文学、艺术、语言、历史、哲学等领域，是对现代文化哲学和精神价值取向进行批判和解构的一种哲学思维方式和态度。"
 tech_power_supply: "电力供应"
 tech_power_supply_desc: "电力供应是指电力生产企业向电力用户提供电力产品的过程，包括发电、输电、配电和售电等环节，是经济社会发展和人民生活中不可或缺的重要基础设施。"
 tech_application_of_computer_city_management: "计算机城市管理应用"
 tech_application_of_computer_city_management_desc: "计算机技术在城市管理中的应用主要体现在构建城市管理公共信息网络服务平台，实现城市管理数字化、网格化、精细化。"
 tech_internet: "互联网"
 tech_internet_desc: "互联网，又称国际网络，指的是网络与网络之间所串连成的庞大网络，这些网络以一组通用的协议相连，形成逻辑上的单一巨大国际网络。"
 tech_big_data: "大数据"
 tech_big_data_desc: "大数据，或称巨量资料，指的是所涉及的资料量规模巨大到无法透过主流软件工具，在合理时间内达到撷取、管理、处理、并整理成为帮助企业经营决策更积极目的的资讯。"
 tech_sanitation_operation: "环卫运作"
 tech_sanitation_operation_desc: "现代化管理的城市环境卫生组织工作。"
 tech_urban_operation_and_maintenance: "城市运维"
 tech_urban_operation_and_maintenance_desc: "城市运维是指对城市基础设施、公共服务及城市运行进行维护、管理和优化的综合性工作。"
 tech_department_store: "百货大楼"
 tech_department_store_desc: "百货大楼是指经营各种商品的大型商场，它不仅是商业上的重要场所，也是城市繁华的象征。"
 tech_civil_aviation: "民用航空"
 tech_civil_aviation_desc: "使用各类航空器从事除了国防、警察和海关等国家航空活动以外的所有的航空活动。民用航空活动是航空活动的一部分。"
 tech_aviation_management: "航空管理"
 tech_aviation_management_desc: "航空管理涵盖航空运输各环节的规划、组织、协调、监督和控制。"
 tech_civil_aviation_equipment: "民用航空设备"
 tech_civil_aviation_equipment_desc: "民用航空设备是指支持民用航空活动所需的各种专业设备和系统。"
 tech_literary_creation: "文学创作"
 tech_literary_creation_desc: "文学创作是运用文字表达思想、情感和故事的创造性活动。"
 atonal_music: "无调性音乐"
 atonal_music_desc: "何必循规蹈矩，老调重弹？所有的调式由我重写！"
 experimental_music: "实验音乐"
 experimental_music_desc: "生活处处皆音乐！"
 tech_multimedia: "多媒体"
 tech_multimedia_desc: "多媒体是集文本、图像、音频、视频等多种信息形式于一体的技术或媒介。"
 tech_video_production_and_editing: "视频制作剪辑"
 tech_video_production_and_editing_desc: "视频制作剪辑是将原始视频素材进行编辑、处理，以呈现完整视频内容的过程。"
 tech_film_and_television_special_effects: "影视特效"
 tech_film_and_television_special_effects_desc: "影视特效是通过计算机图形图像技术，为影视作品创造或增强视觉效果的手段。"
 tech_3d_film_modeling: "三维电影建模"
 tech_3d_film_modeling_desc: "三维电影建模是电影制作中，利用计算机软件创建逼真虚拟角色、场景和特效的技术。"
 tech_construction_department: "施工部门"
 tech_construction_department_desc: "施工部门是负责工程项目具体实施，包括现场作业、进度控制和质量管理的部门。"
 tech_cement: "水泥"
 tech_cement_desc: "水泥是加水搅拌后能硬化并牢固胶结石材的粉状无机胶凝材料。"
 tech_reinforced_concrete: "钢筋混凝土"
 tech_reinforced_concrete_desc: "钢筋混凝土是一种由钢筋和混凝土两种材料组合而成的复合材料，用于增强结构的强度和耐久性。"
 tech_lightweight_building_materials: "轻型建筑材料"
 tech_lightweight_building_materials_desc: "轻型建筑材料是密度小、重量轻，具有优良隔热、隔声、防火等性能的建筑材料。"
 tech_construction_tools: "施工工具"
 tech_construction_tools_desc: "施工工具是建筑行业中用于完成各种施工任务的器具和设备。"
 tech_complete_construction_vehicles: "完备施工车辆"
 tech_complete_construction_vehicles_desc: "完备施工车辆是指配备齐全、功能完善的各类施工用车辆，满足施工现场多样化需求。"
 tech_complete_construction_machinery: "完备施工机械"
 tech_complete_construction_machinery_desc: "完备施工机械是指包括挖掘机、起重机等在内的，能够满足各种施工需求且性能优良的机械设备组合。"
 tech_real_estate_development: "房地产开发"
 tech_real_estate_development_desc: "房地产开发是指在依法取得国有土地使用权的土地上进行基础设施建设和房屋建设的行为。"
 tech_real_estate_agency: "地产中介"
 tech_real_estate_agency_desc: "地产中介是连接买卖双方，提供房地产信息、咨询、评估、代理等服务的专业机构或个人。"
 tech_giant_tower_crane: "巨型塔吊"
 tech_giant_tower_crane_desc: "巨型塔吊是用于大型建筑工地，具有高度提升能力和广泛作业范围的重型起重设备。"
 tech_civil_air_conditioner: "民用空调"
 tech_civil_air_conditioner_desc: "民用空调是用于家庭或类似环境，提供制冷、制热、除湿等舒适环境调节功能的电器设备。"
 tech_gas_air_conditioner: "燃气空调"
 tech_gas_air_conditioner_desc: "燃气空调是利用燃气作为能源，通过燃烧产生冷热能，进而实现室内温度调节的空调系统。"
 tech_inverter_air_conditioner: "变频空调"
 tech_inverter_air_conditioner_desc: "变频空调是通过调整压缩机运行频率，实现按需供冷/热，节能高效的空调类型。"
 tech_office_service: "办公服务"
 tech_office_service_desc: "办公服务是为企业或个人提供办公场所、设施、信息及技术支持等一站式解决方案的服务。"
 tech_electronic_office: "电子办公"
 tech_electronic_office_desc: "电子办公是利用现代信息技术，实现办公流程自动化、信息共享和远程协作的办公模式。"
 tech_file_management: "档案管理"
 tech_file_management_desc: "档案管理是对机构或个人产生的各种档案材料进行收集、整理、保管、利用和销毁的全过程管理。"
 tech_computer_office: "计算机办公"
 tech_computer_office_desc: "计算机办公是利用计算机及其软件工具，进行文档处理、数据分析和信息管理等工作的办公方式。"
 tech_office_supplies: "办公用品"
 tech_office_supplies_desc: "办公用品是日常办公所需的各类文具、设备及耗材的总称。"
 tech_printer: "打印机"
 tech_printer_desc: "打印机是将计算机中的电子文档转换成纸质文档的输出设备。"
 tech_office_professional_software: "办公专业软件"
 tech_office_professional_software_desc: "办公专业软件是专为办公场景设计，用于提升文字处理、数据处理、演示制作等效率的软件工具。"
 tech_public_policy_and_management: "公共政策与管理"
 tech_public_policy_and_management_desc: "公共政策与管理是政府或公共机构为解决社会公共问题、实现公共利益，通过制定和执行政策、调配社会资源、进行公共管理活动的过程。"
 tech_colonization: "经济殖民"
 tech_colonization_desc: "随着国力的兴盛，我们开始尝试对其他国家或地区进行间接的强迫统治和剥削。"
 tech_road_administration_department: "路政部门"
 tech_road_administration_department_desc: "路政部门是交通系统中的重要执法机构，主要负责依法保护公路设施、维护公路路权，并管理相关公路事务。"
 tech_bureaucracy_theory: "官僚主义理论"
 tech_bureaucracy_theory_desc: "现代官僚机构运作的理论。"
 tech_new_public_management: "新公共管理"
 tech_new_public_management:_desc: "新公共管理是强调经济效率、市场导向和企业管理技术在公共管理中的应用的理论和实践。"
 tech_law_enforcement_department: "执法部门"
 tech_law_enforcement_department_desc: "执法部门是依法具有执法权的国家行政机关，负责实施法律、法规和规章，对违法行为进行查处和处罚，以维护社会秩序和公共利益。"
 tech_advanced_education_system: "先进教育系统"
 tech_advanced_education_system_desc: "先进教育系统是指运用多元化教学方法、注重个性化教育、融合创新技术，以培养具备综合素质和创新能力人才为目标的教育体系。"
 tech_port_management: "港口管理"
 tech_port_management_desc: "港口管理是对港口及其相关设施、运营和服务进行规划、组织、协调和监督，以确保港口高效运营和可持续发展的活动。"
 tech_container: "集装箱"
 tech_container_desc: "集装箱是能装载包装或无包装货进行运输，并便于用机械设备进行装卸搬运的一种成组工具。集装箱最大的成功在于其产品的标准化以及由此建立的一整套运输体系。能够让一个载重几十吨的庞然大物实现标准化，并且以此为基础逐步实现全球范围内的船舶、港口、航线、公路、中转站、桥梁、隧道、多式联运相配套的物流系统，这的确堪称人类有史以来创造的伟大奇迹之一。"
 tech_smart_port: "智慧港口"
 tech_smart_port_desc: "智慧港口是以现代化基础设施设备为基础，深度融合新一代信息技术，实现高效、智能、绿色运营的现代港口形态。"
 tech_giant_cruise_ship: "巨型邮轮"
 tech_giant_cruise_ship_desc: "巨型邮轮是吨位庞大、设施完善、载客量高的海上旅游与休闲平台，提供多样化的娱乐与服务。"
 tech_material_science: "材料科学"
 tech_material_science_desc: "材料科学是研究材料的组织结构、性质、生产流程、使用效能及其相互关系的综合性应用科学。"
 tech_power_mechanical_engineering: "动力机械工程"
 tech_power_mechanical_engineering_desc: "动力机械工程是研究如何将燃料的化学能和流体动能高效、安全、低污染地转换为动力的学科，涵盖燃气轮机、汽轮机、内燃机等多种动力设备。"
 tech_communication_and_astronautics: "通信与航天学"
 tech_communication_and_astronautics_desc: "通信与航天学是研究信息的传输、处理及其在航天领域应用的科学与技术，涵盖卫星通信、深空探测、导航定位等多个方面。"
 tech_computer_ai_science: "计算机AI科学"
 tech_computer_ai_science_desc: "计算机AI科学是研究、开发和应用人工智能技术，使计算机系统能够模拟、延伸和扩展人类智能的科学与技术领域。"
 tech_analytical_ultracentrifuge: "分析型超速离心机"
 tech_analytical_ultracentrifuge_desc: "分析型超速离心机是用于化学、生物学领域，能够高精度测量和分析样品沉降行为的先进分析仪器。"
 tech_particle_collider: "粒子对撞机"
 tech_particle_collider_desc: "粒子对撞机是在高能同步加速器基础上发展的大型装置，用于加速并碰撞粒子流，以产生高能反应，探索微观粒子宏观效应及新物理规律。"
 tech_basic_education_system: "基本教育体系"
 tech_basic_education_system_desc: "基本教育体系是一个国家教育制度相对稳定的框架，规定了教育体系的基本构架以及教育内容、方法、评价、管理和投入等要素之间的基本关系。"
 tech_campus_culture: "校园文化"
 tech_campus_culture_desc: "校园文化是学校在长期办学过程中形成的，包括精神文化、环境文化、制度文化和活动文化等在内的，具有独特魅力和鲜明个性的文化氛围。"
 tech_campus_communication: "校园通讯"
 tech_campus_communication_desc: "校园通讯是学校内部进行信息传播、交流互动的重要渠道，涵盖新闻动态、活动通知、学术讲座等多方面内容。"
 tech_electronic_campus: "电子化校园"
 tech_electronic_campus_desc: "电子化校园是以网络为基础，利用信息技术实现校园环境、资源、活动全面数字化，提升教学效率和管理水平的现代教育模式。"
 tech_teaching_equipment: "教学用器械"
 tech_teaching_equipment_desc: "教学用器械是指在教学过程中，用于辅助教师授课、学生实验、实践操作等活动的各种设备和工具。"
 tech_teaching_laboratory: "教学实验室"
 tech_teaching_laboratory_desc: "教学实验室是高等学校主要从事实验教学工作的场所，旨在培养学生的动手能力、综合能力和创新能力。"
 tech_accounting: "会计学"
 tech_accounting_desc: "会计学是研究财务活动和成本资料的收集、分类、综合、分析和解释，以形成协助决策的信息系统，并有效地管理经济的一门应用学科。"
 tech_international_trade_theory: "国际贸易理论"
 tech_international_trade_theory_desc: "国际贸易理论是解释国际贸易产生原因、结构、利益分配以及国家应如何对待国际贸易的经济学说，历经古典、新古典、新贸易及新兴古典等多个发展阶段。"
 tech_intellectual_property: "知识产权"
 tech_intellectual_property_desc: "基于创造成果和工商标记依法产生的权利的统称。"
 tech_auditing: "审计学"
 tech_auditing_desc: "审计学是一门专门研究审计理论和方法，探索审计发展规律，对经济活动进行有效监督的社会学科。"
 tech_financial_supervision_system: "金融监管体系"
 tech_financial_supervision_system_desc: "金融监管体系是由具有金融监管职能的机构、法律、内容和方法等构成的有机整体，用于维护金融安全、稳定市场秩序。"
 tech_international_public_relations: "国际公共关系"
 tech_international_public_relations_desc: "国际公共关系是指一个组织在本国以外地区针对国外公众开展的公共关系活动，或其对国外公众有显著影响的公共关系工作。"
 nationalism: "现代民族主义"
 nationalism_desc: "现代民族主义是以民族共同体为依托，强调民族利益、维护民族传统和特点，旨在推动建立或维护属于自己民族的民族国家的思想观念。"
 pan-nationalism: "国族主义"
 pan-nationalism_desc: "国族主义不仅仅关注一个民族的内部团结，还强调多个民族在一个国家内的融合和统一。国族主义试图构建一个更大的、包含多个民族的国家认同，强调国族内部的和谐与统一。"
 tech_blood_nationalism: "血缘民族主义"
 tech_blood_nationalism_desc: "血缘民族主义的特点在于它强调民族身份的生物学基础，这种身份通常与特定的种族或族群紧密相连。这种民族主义形式可能导致对外来人群的排斥，强化内部的团结，并可能被用作政治动员的工具。"
 tech_culture_nationalism: "文化民族主义"
 tech_culture_nationalism_desc: "文化民族主义不仅仅关注一个民族的内部团结，还强调同一文化圈或宗教圈的多个民族的团结和互助。文化民族主义试图构建一个包含同一文化圈或宗教圈的多个民族的国家认同，强调文化圈或宗教圈内部的和谐与团结。"
 tech_international_politics: "国际政治"
 tech_international_politics_desc: "国际政治是指国际社会中各主权国家、国际组织以及各种政治力量之间的相互关系及其矛盾运动过程的综合。"
 tech_modern_diplomacy: "现代外交学"
 tech_modern_diplomacy_desc: "现代外交学是研究现代国家对外交往活动、外交政策、外交策略、外交艺术以及国际政治格局和外交环境等问题的学科。"
 landing_craft: "现代登陆艇"
 landing_craft_desc: "专门为保护水上部队而设计的舰艇大大提高了两栖攻击成功的概率。"
 civilizing_mission: "文明开化"
 civilizing_mission_desc: "我们伟大的国家有责任将现代化和城市化的光芒照射到发展中国家，教育欠发达国家的人民，并向他们灌输基于我们光荣的文化而来的神圣价值观。"
 colonization: "新殖民主义"
 colonization_desc: "在民族解放运动的打击下，赤裸裸的暴力和强权已经被国际社会所唾弃，西方发达国家被迫改变了直接的殖民统治的旧方式，而采取更隐蔽的、间接的殖民侵略手段。  "
 corporatism: "法团主义"
 corporatism_desc: "一种基于社会内不同企业群体合作的处理社会关系的方法，最终目标是解决阶级冲突。"